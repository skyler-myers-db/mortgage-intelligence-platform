version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    groups:
      root-tooling:
        patterns:
          - "*"
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "08:15"
      timezone: America/New_York
    open-pull-requests-limit: 8
    groups:
      react-stack:
        patterns:
          - react
          - react-dom
          - react-router-dom
          - "@types/react*"
          - "@vitejs/plugin-react"
          - babel-plugin-react-compiler
          - "@rolldown/plugin-babel"
      tanstack:
        patterns:
          - "@tanstack/*"
      test-tooling:
        patterns:
          - vitest
          - "@playwright/*"
          - "@axe-core/*"
          - eslint
          - "@typescript-eslint/*"
      vite-typescript:
        patterns:
          - vite
          - typescript
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:30"
      timezone: America/New_York
    open-pull-requests-limit: 5
    groups:
      python-runtime:
        patterns:
          - "*"
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:45"
      timezone: America/New_York
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: chore
      include: scope
