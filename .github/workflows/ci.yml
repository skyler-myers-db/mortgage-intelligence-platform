name: ci

# Slice 9 CI -- PR + push workflow. Every job below runs in parallel; in-progress
# runs on the same ref are cancelled by `concurrency` so rapid pushes only
# burn one runner per branch. Everything here is credential-free; the
# nightly workflow (nightly.yml) handles live-UC checks with secrets.
#
# Secret policy: this workflow MUST NOT reference any repo secrets. Anyone
# opening a PR from a fork gets the same green bar as a maintainer.

on:
  pull_request:
  push:
    branches:
      - main
      - 'feature/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Mirror of pyproject.toml requires-python pin. Bump both in lockstep.
  PYTHON_VERSION: '3.11'
  # frontend/package.json requires Node >=22.22; follow the current Node 22
  # LTS line so CI receives patch updates while satisfying that floor.
  NODE_VERSION: '22'
  # Pinned exactly, like every other tool version here: the runner image's
  # preinstalled shellcheck drifts, and a new release adding one check would
  # redden CI on a commit that changed no shell at all.
  SHELLCHECK_VERSION: 'v0.11.0'
  # Placeholder BUNDLE_VARs so `databricks bundle validate` can resolve
  # variable references without any real workspace secrets. The nightly
  # workflow swaps these for real values.
  BUNDLE_VAR_sql_warehouse_id: 'ffffffffffffffff'
  BUNDLE_VAR_genie_space_id: '00000000-0000-0000-0000-000000000000'
  BUNDLE_VAR_lakebase_instance: 'mip-placeholder'

jobs:
  backend-tests:
    name: backend (ruff + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: ruff
        run: ruff check backend tests tools jobs pipelines
      - name: mypy (ratcheted type gate — audit P2-14)
        run: python -m mypy backend
      - name: pytest (parallel + coverage gate)
        # Unit + integration under the default pytest config; integration
        # tests that require workspace creds skip themselves when env is
        # absent. Repository-seam tests install their in-process fixtures
        # explicitly through pytest fixtures; there is no runtime mock-mode
        # switch in production code. The coverage floor is set to the
        # current measured suite baseline and should only move upward.
        run: |
          pytest -q -n auto --dist=loadscope \
            --cov=backend \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml:coverage.xml \
            --cov-report=html:coverage/html \
            --cov-fail-under=83
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: |
            coverage.xml
            coverage/html
          if-no-files-found: ignore

  frontend-tests:
    name: frontend (lint + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        # frontend/package-lock.json may not exist; fall back to npm install
        # to match the local dev path.
        run: |
          if [ -f frontend/package-lock.json ]; then
            npm --prefix frontend ci
          else
            npm --prefix frontend install --no-audit --no-fund
          fi
      - run: npm --prefix frontend run lint
      - run: npm --prefix frontend run test
      - run: npm --prefix frontend run build
      - run: npm --prefix frontend run budget

  bundle-syntax-check:
    # `databricks bundle validate` unavoidably performs a
    # /api/2.0/preview/scim/v2/Me auth preflight against the workspace,
    # which is impossible in PR CI (no real token, by design). We run
    # the real `bundle validate` in `nightly.yml` where secrets are
    # wired. In PR CI we do a lighter but still-meaningful check:
    # (1) YAML parses, (2) the top-level structure matches the bundle
    # schema's required keys, and (3) every included `resources/*.yml`
    # + inline bundle resource parses too. Catches broken YAML /
    # typo'd resource keys without authentication.
    name: bundle YAML + schema-shape check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install pyyaml
        run: python -m pip install --upgrade pip pyyaml
      - name: Parse databricks.yml + resource includes
        run: |
          python - <<'PY'
          import sys, yaml, pathlib
          root = pathlib.Path(".")
          main = yaml.safe_load((root / "databricks.yml").read_text())
          assert main.get("bundle", {}).get("name"), "databricks.yml missing bundle.name"
          targets = main.get("targets", {})
          for required in ("dev", "prod"):
              assert required in targets, f"databricks.yml missing targets.{required}"
              assert targets[required].get("workspace", {}).get("host"), \
                  f"targets.{required}.workspace.host is required"
          resources = main.get("resources", {})
          for kind in ("jobs", "pipelines", "sql_warehouses", "apps"):
              if kind in resources:
                  for key in resources[kind]:
                      print(f"  resources.{kind}.{key}")
          # Parse any resources/*.yml includes
          for yml in sorted((root / "resources").glob("*.yml")):
              parsed = yaml.safe_load(yml.read_text())
              assert parsed is not None, f"{yml} is empty or invalid"
              print(f"  include: {yml.name} OK")
          print("bundle YAML + schema shape: OK")
          PY

  talk-track-lint:
    name: talk-track word-count gate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Enforce 1000-1500 spoken-word window
        # pytest unit test covers the same gate; the CLI invocation here is
        # redundant coverage so the failure message in CI output points
        # directly at the file + count.
        run: python tools/talk_track_wc.py

  file-size-gate:
    name: file-size gate
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Enforce monolith allowlist
        run: python tools/check_file_sizes.py --warn 500 --fail 900

  shell-lint:
    name: shell (shellcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned shellcheck
        run: |
          set -euo pipefail
          url="https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL --retry 3 "$url" | tar -xJ -C /tmp
          sudo install -m 0755 "/tmp/shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version
      - name: Lint tracked shell scripts
        # --severity=warning is the enforced floor. The 85 remaining info-level
        # findings are almost all SC2030/SC2031 subshell-scope noise, which the
        # deploy script's M2M subshells trip by design; deploy.sh already
        # carries targeted `# shellcheck disable=SC2031` directives with
        # reasons where it matters.
        #
        # Warning level is the point of this gate: SC2154 (referenced but not
        # assigned) is what catches a function moved into scripts/lib/ that
        # still reads a caller-scoped variable -- the failure mode a shell
        # split introduces silently and no test here would otherwise see.
        run: make lint-shell

  release-hygiene:
    name: release source hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build source zip
        run: make zip
      - name: Inspect source zip
        run: python tools/release_hygiene.py dist/mortgage-intelligence-platform.zip
      - name: gitleaks --no-git on source artifact
        run: |
          set -euo pipefail
          if ! command -v gitleaks >/dev/null 2>&1; then
            GITLEAKS_VERSION="8.30.1"
            mkdir -p "$HOME/.local/bin"
            curl -sSfL \
              "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
              -o /tmp/gitleaks.tar.gz
            tar -xzf /tmp/gitleaks.tar.gz -C "$HOME/.local/bin" gitleaks
            chmod +x "$HOME/.local/bin/gitleaks"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.local/bin:$PATH"
          fi
          if command -v gitleaks >/dev/null 2>&1; then
            rm -rf dist/source-hygiene
            mkdir -p dist/source-hygiene
            unzip -q dist/mortgage-intelligence-platform.zip -d dist/source-hygiene
            root="$PWD"
            cd dist/source-hygiene/mortgage-intelligence-platform
            gitleaks detect --no-git --source . --config "$root/.gitleaks.toml" --redact --verbose
          else
            echo "::warning::gitleaks is unavailable; release_hygiene.py already validated banned artifact paths"
          fi

  playwright-offline:
    # Post-cutover the backend refuses to boot without live Databricks
    # credentials (see backend/runtime.py::_preflight_credentials), which
    # are intentionally absent in PR CI. So the offline Playwright job
    # can't stand up a real uvicorn + vite pair. We still parse every spec,
    # then serve the production frontend and execute the route-fulfilled
    # Growth Agent handoff contract. Real-data end-to-end runs remain in
    # nightly.yml against the deployed app with workspace credentials.
    name: e2e (parse + governed handoff fixture)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        run: |
          if [ -f frontend/package-lock.json ]; then
            npm --prefix frontend ci
          else
            npm --prefix frontend install --no-audit --no-fund
          fi
      - name: Playwright test --list (parse + collect, no run)
        working-directory: frontend
        run: npx playwright test --list
      - name: Build production frontend
        run: npm --prefix frontend run build
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Execute governed handoff and virtualization fixtures
        working-directory: frontend
        env:
          MIP_APP_URL: http://127.0.0.1:4173
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/mip-vite-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/mip-vite-preview.log
              exit 1
            fi
            sleep 1
          done
          npx playwright test tests/e2e/growth_agent_handoff_fixture.spec.ts
          E2E_LAYOUT_MOCK=1 npx playwright test tests/e2e/layout-stability.spec.ts \
            --grep "expanded virtual-row geometry" --workers=1

  security-scan:
    # SAST + secret-scan gate. This job is credential-free like the rest
    # of ci.yml: no repo secrets, runs identically on fork PRs and
    # maintainer branches. Three rails:
    #   1. gitleaks  -- secret scan on committed files (diff on PR,
    #      full-history on push-to-main). Allowlist lives in
    #      `.gitleaks.toml` at repo root.
    #   2. bandit    -- Python SAST across backend/tools/jobs/pipelines
    #      at medium+ severity. `.bandit` silences test-only noise.
    #   3. pip-audit -- Python dependency CVE scan from requirements.txt.
    #   4. npm audit -- frontend dependency CVE scan at high+ severity,
    #      including dev/build tooling because it runs in CI and build hosts.
    # Each step has a single responsibility and runs independently so
    # CI output points directly at the failing rail.
    name: security (gitleaks + bandit + npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          # gitleaks needs full history on push-to-main so the
          # full-history scan is meaningful. On PRs the action only
          # scans the diff regardless.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: gitleaks (secret scan)
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.28.0"
          mkdir -p "$HOME/.local/bin"
          GITLEAKS_BIN="$(command -v gitleaks || true)"
          if [ -z "$GITLEAKS_BIN" ]; then
            curl -fsSL \
              "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
              -o /tmp/gitleaks.tar.gz
            tar -xzf /tmp/gitleaks.tar.gz -C "$HOME/.local/bin" gitleaks
            chmod +x "$HOME/.local/bin/gitleaks"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            GITLEAKS_BIN="$HOME/.local/bin/gitleaks"
          fi
          "$GITLEAKS_BIN" detect --source . --config .gitleaks.toml --redact --verbose

      - name: Install Python security tools
        run: |
          python -m pip install --upgrade pip
          pip install 'bandit[toml]==1.7.9' 'pip-audit==2.9.0'

      - name: bandit (Python SAST)
        # Two-step: a wide-net informational run (medium+ severity,
        # high confidence) that always prints findings, then a strict
        # gate (high severity, high confidence) that fails the build.
        # `.bandit` config silences explicitly-justified skips (see
        # the file's header comment). Medium findings are visible in
        # the log but do not block; high findings do.
        run: |
          bandit -c .bandit -r backend tools jobs pipelines -x tests -ll -ii -f txt || true
          bandit -c .bandit -r backend tools jobs pipelines -x tests --severity-level high --confidence-level high -q

      - name: pip-audit (Python deps)
        # One advisory is ignored here. It has its reachability and its
        # upstream status written at the call site and re-checked whenever
        # the list changes; an ignore without both is a bug.
        #
        # PYSEC-2026-3552 (cryptography's PKCS#7 EnvelopedData oracle) was
        # ignored here until 2026-09-08, when mlflow 3.16.0 admitted
        # cryptography<51 and requirements.in moved to 50.0.1. That ignore is
        # retired; the fix is installed.
        #
        # GHSA-h7x2-h6g9-p789 (CVE-2026-71211, ignore added 2026-09-08) is an
        # SSRF in MLflow's self-hosted tracking server: _create_gateway_secret
        # (mlflow/server/handlers.py) stores auth_config.api_base unvalidated
        # and the AI Gateway proxy (mlflow/server/gateway_api.py raw_proxy)
        # later issues requests to it.
        #   1. Unreachable. This repo never runs `mlflow server` or
        #      `mlflow gateway`. mlflow is used as a client SDK
        #      (mlflow.genai.evaluate, pyfunc packaging, UC model
        #      registration) against the Databricks-managed tracking server,
        #      which is not this package's server code. `grep -rE "mlflow
        #      (server|gateway)|mlflow\.server"` over the repo returns nothing.
        #   2. No fixed release exists. The advisory lists no patched version
        #      and marks >=3.13.0,<=3.15.2 vulnerable. The pinned mlflow 3.16.0
        #      postdates the advisory's last update (2026-08-31) and its
        #      _create_gateway_secret handler is byte-identical to 3.15.1's,
        #      so pip-audit's silence on 3.16.0 is a range artifact, not a
        #      fix. The ignore stays so a later range extension cannot redden
        #      CI for a finding whose proof is unchanged. Re-verified
        #      2026-09-08 by AST-comparing the installed 3.15.1 and 3.16.0
        #      copies: _create_gateway_secret is identical and raw_proxy
        #      differs only in budget-accounting plumbing (no api_base
        #      validation), so 3.16.0 carries the same code the advisory
        #      describes.
        # Remove this ignore when the advisory gains a first_patched_version,
        # then move the mlflow pin to that release.
        # Review date: 2026-10-08. Re-check with
        #   gh api /advisories/GHSA-h7x2-h6g9-p789 --jq '.vulnerabilities[].first_patched_version'
        # (null on 2026-09-08; advisory last updated 2026-08-31). If it is
        # still null, re-confirm proofs 1 and 2 above and move this date
        # forward; if it is set, retire the ignore and bump the pin instead.
        run: pip-audit -r requirements.txt --strict --ignore-vuln GHSA-h7x2-h6g9-p789

      - name: npm audit (frontend prod + dev deps)
        # `--audit-level=high` means only high/critical CVEs fail the
        # job; moderate/low findings print but don't block. We include
        # devDependencies because Vite, Vitest, Playwright, and build
        # plugins execute in CI / bundle-production contexts.
        run: npm --prefix frontend audit --audit-level=high
        continue-on-error: false
