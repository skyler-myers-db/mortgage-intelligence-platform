name: deploy-dev
on:
  workflow_dispatch:
    inputs:
      skip_silver:
        description: "Skip FRED + Cotality silver refresh jobs"
        type: boolean
        default: false
      skip_smoke:
        description: "Skip deployed app smoke test"
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: dev
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: '22' }
      - uses: actions/setup-python@v6
        with: { python-version: '3.11' }
      - uses: databricks/setup-cli@v1.0.0
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npm --prefix frontend ci
      - name: Configure Databricks dev credentials
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_WAREHOUSE_ID: ${{ secrets.DATABRICKS_WAREHOUSE_ID }}
          GENIE_SPACE_ID: ${{ secrets.GENIE_SPACE_ID }}
        run: |
          set -euo pipefail
          missing=""
          for v in DATABRICKS_HOST DATABRICKS_TOKEN DATABRICKS_WAREHOUSE_ID GENIE_SPACE_ID; do
            if [ -z "${!v}" ]; then
              missing="$missing $v"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets:$missing"
            exit 1
          fi

          {
            echo "[DEFAULT]"
            echo "host  = ${DATABRICKS_HOST}"
            echo "token = ${DATABRICKS_TOKEN}"
            echo "auth_type = pat"
          } > "$HOME/.databrickscfg"
          chmod 600 "$HOME/.databrickscfg"

          {
            echo "APP_ENV=sandbox"
            echo "DATABRICKS_HOST=${DATABRICKS_HOST}"
            echo "DATABRICKS_WAREHOUSE_ID=${DATABRICKS_WAREHOUSE_ID}"
            echo "GENIE_SPACE_ID=${GENIE_SPACE_ID}"
            echo "MIP_DEFAULT_CATALOG=mip"
            echo "MIP_DEFAULT_SCHEMA=gold"
            echo "MIP_ENABLE_DEMO_FIRST_PARTY_FEEDS=1"
          } > .env.local
          chmod 600 .env.local
      - name: Deploy dev Databricks App
        env:
          DATABRICKS_AUTH_TYPE: pat
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          set -euo pipefail
          args=(-t dev --no-confirm)
          if [ "${{ inputs.skip_silver }}" = "true" ]; then
            args+=(--skip-silver)
          fi
          if [ "${{ inputs.skip_smoke }}" = "true" ]; then
            args+=(--skip-smoke)
          fi
          ./scripts/deploy.sh "${args[@]}"
