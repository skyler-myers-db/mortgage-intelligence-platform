            ${{ vars.MIP_AUDITOR_IDENTITIES && 'MIP_AUDITOR_IDENTITIES' || '' }}
            ${{ vars.MIP_BOOTSTRAP_WAREHOUSE_ID && 'MIP_BOOTSTRAP_WAREHOUSE_ID' || '' }}
            ${{ vars.MIP_CI_DEPLOYER_CLIENT_ID && 'MIP_CI_DEPLOYER_CLIENT_ID' || '' }}
            ${{ vars.MIP_CLIENT && 'MIP_CLIENT' || '' }}
            ${{ vars.MIP_CLOUD && 'MIP_CLOUD' || '' }}
            ${{ vars.MIP_COTALITY_SHARE_NAME && 'MIP_COTALITY_SHARE_NAME' || '' }}
            ${{ vars.MIP_COTALITY_SHARE_PROVIDER && 'MIP_COTALITY_SHARE_PROVIDER' || '' }}
            ${{ vars.MIP_COTALITY_SOURCE_CATALOG && 'MIP_COTALITY_SOURCE_CATALOG' || '' }}
            ${{ vars.MIP_COTALITY_SOURCE_SCHEMA && 'MIP_COTALITY_SOURCE_SCHEMA' || '' }}
            ${{ vars.MIP_COTALITY_SOURCE_TABLE_PREFIX && 'MIP_COTALITY_SOURCE_TABLE_PREFIX' || '' }}
            ${{ vars.MIP_DASHBOARD_PARENT_PATH && 'MIP_DASHBOARD_PARENT_PATH' || '' }}
            ${{ vars.MIP_DEFAULT_CATALOG && 'MIP_DEFAULT_CATALOG' || '' }}
            ${{ vars.MIP_ENABLE_DEMO_FIRST_PARTY_FEEDS && 'MIP_ENABLE_DEMO_FIRST_PARTY_FEEDS' || '' }}
            ${{ vars.MIP_EXPECT_METASTORE_ID && 'MIP_EXPECT_METASTORE_ID' || '' }}
            ${{ vars.MIP_EXPECT_WORKSPACE_ID && 'MIP_EXPECT_WORKSPACE_ID' || '' }}
            ${{ vars.MIP_GATEWAY_MODEL_ATTESTATION_SIGNING_KEY && 'MIP_GATEWAY_MODEL_ATTESTATION_SIGNING_KEY' || '' }}
            ${{ vars.MIP_GENIE_MANAGER_PRINCIPALS && 'MIP_GENIE_MANAGER_PRINCIPALS' || '' }}
            ${{ vars.MIP_GENIE_SPACE_NAME && 'MIP_GENIE_SPACE_NAME' || '' }}
            ${{ vars.MIP_IDENTITY_IDS_JSON && 'MIP_IDENTITY_IDS_JSON' || '' }}
            ${{ vars.MIP_IDENTITY_PREFIX && 'MIP_IDENTITY_PREFIX' || '' }}
            ${{ vars.MIP_INSTALL_CLASS && 'MIP_INSTALL_CLASS' || '' }}
            ${{ vars.MIP_LAKEBASE_DATABASE_NAME && 'MIP_LAKEBASE_DATABASE_NAME' || '' }}
            ${{ vars.MIP_LAKEBASE_INSTANCE && 'MIP_LAKEBASE_INSTANCE' || '' }}
            ${{ vars.MIP_LAKEBASE_READABLE_SECONDARIES && 'MIP_LAKEBASE_READABLE_SECONDARIES' || '' }}
            ${{ vars.MIP_LAKEBASE_SYNC_CATALOG && 'MIP_LAKEBASE_SYNC_CATALOG' || '' }}
            ${{ vars.MIP_LAKEBASE_SYNC_SCHEMA && 'MIP_LAKEBASE_SYNC_SCHEMA' || '' }}
            ${{ vars.MIP_LEGACY_BUNDLE_ROOT && 'MIP_LEGACY_BUNDLE_ROOT' || '' }}
