name: deploy-dev
on:
  workflow_dispatch:
    inputs:
      skip_silver:
        description: "Skip FRED + Cotality silver refresh jobs"
        type: boolean
        default: false
      skip_smoke:
        description: "Skip deployed app smoke test"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mip-dev-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: dev
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: '22' }
      - uses: actions/setup-python@v6
        with: { python-version: '3.11' }
      - uses: databricks/setup-cli@v1.0.0
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npm --prefix frontend ci
      - name: Configure Databricks dev credentials
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_WAREHOUSE_ID: ${{ secrets.DATABRICKS_WAREHOUSE_ID }}
          GENIE_SPACE_ID: ${{ secrets.GENIE_SPACE_ID }}
          MIP_COTALITY_ID_MASK_SECRET: ${{ secrets.MIP_COTALITY_ID_MASK_SECRET }}
          MIP_GENIE_ACTION_SECRET_CURRENT: ${{ secrets.MIP_GENIE_ACTION_SECRET_CURRENT }}
          MIP_GENIE_ACTION_SECRET_PREVIOUS: ${{ secrets.MIP_GENIE_ACTION_SECRET_PREVIOUS }}
          MIP_GENIE_ACTION_SECRET_KID: ${{ vars.MIP_GENIE_ACTION_SECRET_KID }}
          MIP_GENIE_ACTION_SECRET_PREVIOUS_KID: ${{ vars.MIP_GENIE_ACTION_SECRET_PREVIOUS_KID }}
          MIP_ADMIN_EMAILS: ${{ vars.MIP_ADMIN_EMAILS }}
          MIP_ADMIN_GROUP_NAME: ${{ vars.MIP_ADMIN_GROUP_NAME }}
        run: |
          set -euo pipefail
          missing=""
          for v in DATABRICKS_HOST DATABRICKS_TOKEN DATABRICKS_WAREHOUSE_ID GENIE_SPACE_ID MIP_COTALITY_ID_MASK_SECRET MIP_GENIE_ACTION_SECRET_CURRENT; do
            if [ -z "${!v}" ]; then
              missing="$missing $v"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets:$missing"
            exit 1
          fi
          if [ -z "${MIP_ADMIN_EMAILS:-}" ] && [ -z "${MIP_ADMIN_GROUP_NAME:-}" ]; then
            echo "::error::Configure MIP_ADMIN_EMAILS or MIP_ADMIN_GROUP_NAME as a dev environment/repository variable before deploying."
            exit 1
          fi

          {
            echo "[DEFAULT]"
            echo "host  = ${DATABRICKS_HOST}"
            echo "token = ${DATABRICKS_TOKEN}"
            echo "auth_type = pat"
          } > "$HOME/.databrickscfg"
          chmod 600 "$HOME/.databrickscfg"

          {
            echo "APP_ENV=sandbox"
            echo "DATABRICKS_HOST=${DATABRICKS_HOST}"
            echo "DATABRICKS_WAREHOUSE_ID=${DATABRICKS_WAREHOUSE_ID}"
            echo "GENIE_SPACE_ID=${GENIE_SPACE_ID}"
            echo "MIP_DEFAULT_CATALOG=mip"
            echo "MIP_DEFAULT_SCHEMA=gold"
            echo "MIP_ENABLE_DEMO_FIRST_PARTY_FEEDS=1"
            if [ -n "${MIP_GENIE_ACTION_SECRET_KID:-}" ]; then
              echo "MIP_GENIE_ACTION_SECRET_KID=${MIP_GENIE_ACTION_SECRET_KID}"
            fi
            if [ -n "${MIP_GENIE_ACTION_SECRET_PREVIOUS_KID:-}" ]; then
              echo "MIP_GENIE_ACTION_SECRET_PREVIOUS_KID=${MIP_GENIE_ACTION_SECRET_PREVIOUS_KID}"
            fi
            if [ -n "${MIP_ADMIN_EMAILS:-}" ]; then
              echo "MIP_ADMIN_EMAILS=${MIP_ADMIN_EMAILS}"
            fi
            if [ -n "${MIP_ADMIN_GROUP_NAME:-}" ]; then
              echo "MIP_ADMIN_GROUP_NAME=${MIP_ADMIN_GROUP_NAME}"
            fi
          } > .env.local
          chmod 600 .env.local
      - name: Mint deployed app bearer for smoke
        if: ${{ inputs.skip_smoke == false }}
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          missing=""
          for v in DATABRICKS_CLIENT_ID DATABRICKS_CLIENT_SECRET; do
            if [ -z "${!v:-}" ]; then
              missing="$missing $v"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required M2M OAuth secret(s) for deployed smoke:$missing"
            exit 1
          fi
          bearer="$(python tools/oauth_m2m_mint.py)"
          if [ -z "$bearer" ]; then
            echo "::error::M2M bearer token was empty"
            exit 1
          fi
          echo "::add-mask::$bearer"
          echo "MIP_BEARER_TOKEN=$bearer" >> "$GITHUB_ENV"
      - name: Deploy dev Databricks App
        env:
          DATABRICKS_AUTH_TYPE: pat
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          MIP_ADMIN_BEARER_TOKEN: ${{ secrets.MIP_ADMIN_BEARER_TOKEN }}
          MIP_COTALITY_ID_MASK_SECRET: ${{ secrets.MIP_COTALITY_ID_MASK_SECRET }}
          MIP_GENIE_ACTION_SECRET_CURRENT: ${{ secrets.MIP_GENIE_ACTION_SECRET_CURRENT }}
          MIP_GENIE_ACTION_SECRET_PREVIOUS: ${{ secrets.MIP_GENIE_ACTION_SECRET_PREVIOUS }}
        run: |
          set -euo pipefail
          args=(-t dev --no-confirm)
          if [ "${{ inputs.skip_silver }}" = "true" ]; then
            args+=(--skip-silver)
          fi
          if [ "${{ inputs.skip_smoke }}" = "true" ]; then
            args+=(--skip-smoke)
          fi
          ./scripts/deploy.sh "${args[@]}"
