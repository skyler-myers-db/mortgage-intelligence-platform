            ${{ secrets.MIP_AUDITOR_IDENTITIES && 'MIP_AUDITOR_IDENTITIES' || '' }}
            ${{ secrets.MIP_BOOTSTRAP_WAREHOUSE_ID && 'MIP_BOOTSTRAP_WAREHOUSE_ID' || '' }}
            ${{ secrets.MIP_CI_DEPLOYER_CLIENT_ID && 'MIP_CI_DEPLOYER_CLIENT_ID' || '' }}
            ${{ secrets.MIP_CLIENT && 'MIP_CLIENT' || '' }}
            ${{ secrets.MIP_CLOUD && 'MIP_CLOUD' || '' }}
            ${{ secrets.MIP_COTALITY_SHARE_NAME && 'MIP_COTALITY_SHARE_NAME' || '' }}
            ${{ secrets.MIP_COTALITY_SHARE_PROVIDER && 'MIP_COTALITY_SHARE_PROVIDER' || '' }}
            ${{ secrets.MIP_COTALITY_SOURCE_CATALOG && 'MIP_COTALITY_SOURCE_CATALOG' || '' }}
            ${{ secrets.MIP_COTALITY_SOURCE_SCHEMA && 'MIP_COTALITY_SOURCE_SCHEMA' || '' }}
            ${{ secrets.MIP_COTALITY_SOURCE_TABLE_PREFIX && 'MIP_COTALITY_SOURCE_TABLE_PREFIX' || '' }}
            ${{ secrets.MIP_DASHBOARD_PARENT_PATH && 'MIP_DASHBOARD_PARENT_PATH' || '' }}
            ${{ secrets.MIP_DEFAULT_CATALOG && 'MIP_DEFAULT_CATALOG' || '' }}
            ${{ secrets.MIP_ENABLE_DEMO_FIRST_PARTY_FEEDS && 'MIP_ENABLE_DEMO_FIRST_PARTY_FEEDS' || '' }}
            ${{ secrets.MIP_EXPECT_METASTORE_ID && 'MIP_EXPECT_METASTORE_ID' || '' }}
            ${{ secrets.MIP_EXPECT_WORKSPACE_ID && 'MIP_EXPECT_WORKSPACE_ID' || '' }}
            ${{ secrets.MIP_GATEWAY_MODEL_ATTESTATION_SIGNING_KEY && 'MIP_GATEWAY_MODEL_ATTESTATION_SIGNING_KEY' || '' }}
            ${{ secrets.MIP_GENIE_MANAGER_PRINCIPALS && 'MIP_GENIE_MANAGER_PRINCIPALS' || '' }}
            ${{ secrets.MIP_GENIE_SPACE_NAME && 'MIP_GENIE_SPACE_NAME' || '' }}
            ${{ secrets.MIP_IDENTITY_IDS_JSON && 'MIP_IDENTITY_IDS_JSON' || '' }}
            ${{ secrets.MIP_IDENTITY_PREFIX && 'MIP_IDENTITY_PREFIX' || '' }}
            ${{ secrets.MIP_INSTALL_CLASS && 'MIP_INSTALL_CLASS' || '' }}
