name: deploy-dev
on:
  workflow_dispatch:
    inputs:
      skip_silver:
        description: "Skip FRED + Cotality silver refresh jobs"
        type: boolean
        default: false
      skip_smoke:
        description: "Skip deployed app smoke test"
        type: boolean
        default: false
      rebase_unverified_app:
        description: "One-time only: stop an existing App that has no signed rollback record"
        type: boolean
        default: false
      remediate_foreign_catalog_bindings:
        description: "Refused on pr105-host: rewrites catalog bindings for the whole shared metastore; leave false"
        type: boolean
        default: false
      repair_normal_credential:
        description: "Recovery only: rotate the missing normal-operator OAuth secret into GitHub"
        type: boolean
        default: false
      acknowledge_single_maintainer_break_glass:
        description: "Required: acknowledge audited self-approval because this repository has one maintainer"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Share one durable-state lane with nightly live validation: deployment may
  # stop the App and both workflows mutate the same dev Lakebase records.
  group: mip-dev-live-state
  cancel-in-progress: false

jobs:
  refuse-unacknowledged:
    if: ${{ !inputs.acknowledge_single_maintainer_break_glass }}
    runs-on: ubuntu-latest
    steps:
      - name: Refuse an unacknowledged single-maintainer deployment
        run: |
          set -euo pipefail
          echo "::error::Dev deployment requires explicit single-maintainer break-glass acknowledgement."
          exit 1
  deploy:
    if: ${{ inputs.acknowledge_single_maintainer_break_glass }}
    runs-on: ubuntu-latest
    # A first install may perform two serial one-use role convergences. Each
    # deliberately waits through a captured 65-minute OAuth/database lease
    # plus skew, so the manual deploy gate needs room for both and for the
    # subsequent bundle, migration, refresh, and smoke steps.
    timeout-minutes: 240
    environment: dev
    # The deployer is a dedicated account service principal with no OAuth
    # secret and no PAT: it authenticates only through GitHub Actions OIDC
    # workload identity federation, whose policy trusts this repository's
    # `dev` environment subject. The id-token permission lets this job, and no
    # other, request the GitHub ID token the Databricks token exchange presents.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: '22' }
      - uses: actions/setup-python@v6
        with: { python-version: '3.11' }
      - uses: databricks/setup-cli@bc7e6aabb6006d8d1758bd25ee1a100935c9cb7c # v1.7.0
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npm --prefix frontend ci
      - name: Configure Databricks dev credentials
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          # The deployer service principal's application id: a public
          # identifier (a dev environment variable, never a secret). Its
          # federation policy, not a stored credential, authenticates it.
          MIP_CI_DEPLOYER_CLIENT_ID: ${{ vars.MIP_CI_DEPLOYER_CLIENT_ID }}
          DATABRICKS_WAREHOUSE_ID: ${{ secrets.DATABRICKS_WAREHOUSE_ID }}
          GENIE_SPACE_ID: ${{ secrets.GENIE_SPACE_ID }}
          MIP_AI_GATEWAY_PROOF_SIGNING_KEY: ${{ secrets.MIP_AI_GATEWAY_PROOF_SIGNING_KEY }}
          MIP_GATEWAY_MODEL_ATTESTATION_SIGNING_KEY: ${{ secrets.MIP_GATEWAY_MODEL_ATTESTATION_SIGNING_KEY }}
          MIP_GENIE_ACTION_SECRET_KID: ${{ vars.MIP_GENIE_ACTION_SECRET_KID }}
          MIP_GENIE_ACTION_SECRET_PREVIOUS_KID: ${{ vars.MIP_GENIE_ACTION_SECRET_PREVIOUS_KID }}
          MIP_ADMIN_EMAILS: ${{ vars.MIP_ADMIN_EMAILS }}
          MIP_AUDITOR_EMAILS: ${{ vars.MIP_AUDITOR_EMAILS }}
          MIP_GENIE_REFUSAL_TEXT_CAPTURE: ${{ vars.MIP_GENIE_REFUSAL_TEXT_CAPTURE }}
          MIP_ADMIN_GROUP_NAME: ${{ vars.MIP_ADMIN_GROUP_NAME }}
          MIP_APPROVER_GROUP_NAME: ${{ vars.MIP_APPROVER_GROUP_NAME }}
          MIP_UC_APPROVED_OWNER_PRINCIPALS: ${{ vars.MIP_UC_APPROVED_OWNER_PRINCIPALS }}
          MIP_UC_FOREIGN_CATALOG_BINDING_POLICY: ${{ vars.MIP_UC_FOREIGN_CATALOG_BINDING_POLICY }}
          MIP_DEFAULT_CATALOG: ${{ vars.MIP_DEFAULT_CATALOG || 'mip' }}
          MIP_LENDER_NAME: ${{ vars.MIP_LENDER_NAME || 'Summit Mortgage' }}
          MIP_LENDER_NMLS_ID: ${{ vars.MIP_LENDER_NMLS_ID }}
          MIP_TENANT_ID: ${{ vars.MIP_TENANT_ID }}
          MIP_APP_NAME: ${{ vars.MIP_APP_NAME || 'mip-app' }}
          MIP_LAKEBASE_INSTANCE: ${{ vars.MIP_LAKEBASE_INSTANCE || 'mip-app-state' }}
          LAKEBASE_DATABASE: ${{ vars.LAKEBASE_DATABASE || 'mip_app_state' }}
          MIP_LAKEBASE_SYNC_CATALOG: ${{ vars.MIP_LAKEBASE_SYNC_CATALOG || 'mip_app_state' }}
          MIP_LAKEBASE_SYNC_SCHEMA: ${{ vars.MIP_LAKEBASE_SYNC_SCHEMA || 'mip_sync' }}
          MIP_LAKEBASE_SYNC_TABLES: ${{ vars.MIP_LAKEBASE_SYNC_TABLES || 'source_readiness,segment_population,funnel_snapshot_daily' }}
          MIP_RUNTIME_SECRET_SCOPE: ${{ vars.MIP_RUNTIME_SECRET_SCOPE || 'mip-runtime' }}
          MIP_APP_ROLLBACK_SECRET_SCOPE: ${{ vars.MIP_APP_ROLLBACK_SECRET_SCOPE || 'mip-app-rollback' }}
          MIP_GENIE_SPACE_NAME: ${{ vars.MIP_GENIE_SPACE_NAME || 'Mortgage Lead Intelligence' }}
          MIP_AI_GATEWAY_AGENT_MODEL_FAMILY: ${{ vars.MIP_AI_GATEWAY_AGENT_MODEL_FAMILY }}
          MIP_AI_GATEWAY_AGENT_EXPERIMENT_BASE: ${{ vars.MIP_AI_GATEWAY_AGENT_EXPERIMENT_BASE }}
          MIP_AI_GATEWAY_TABLE_PREFIX: ${{ vars.MIP_AI_GATEWAY_TABLE_PREFIX }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_OPERATOR2_CLIENT_ID: ${{ secrets.DATABRICKS_OPERATOR2_CLIENT_ID }}
          DATABRICKS_ADMIN_CLIENT_ID: ${{ secrets.DATABRICKS_ADMIN_CLIENT_ID }}
          DATABRICKS_RELEASE_PROBE_CLIENT_ID: ${{ secrets.DATABRICKS_RELEASE_PROBE_CLIENT_ID }}
          DATABRICKS_VERIFIER_CLIENT_ID: ${{ secrets.DATABRICKS_VERIFIER_CLIENT_ID }}
          DATABRICKS_AGENT_RUNTIME_CLIENT_ID: ${{ secrets.DATABRICKS_AGENT_RUNTIME_CLIENT_ID }}
          DATABRICKS_AGENT_PROXY_CREDENTIAL_BUNDLE: ${{ secrets.DATABRICKS_AGENT_PROXY_CREDENTIAL_BUNDLE }}
          DATABRICKS_ACCOUNT_HOST: ${{ secrets.DATABRICKS_ACCOUNT_HOST || 'https://accounts.cloud.databricks.com' }}
          DATABRICKS_ACCOUNT_ID: ${{ secrets.DATABRICKS_ACCOUNT_ID }}
          DATABRICKS_ACCOUNT_CLIENT_ID: ${{ secrets.DATABRICKS_ACCOUNT_CLIENT_ID }}
          DATABRICKS_ACCOUNT_CLIENT_SECRET: ${{ secrets.DATABRICKS_ACCOUNT_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          missing=""
          for v in DATABRICKS_HOST MIP_CI_DEPLOYER_CLIENT_ID DATABRICKS_WAREHOUSE_ID GENIE_SPACE_ID MIP_AI_GATEWAY_PROOF_SIGNING_KEY MIP_GATEWAY_MODEL_ATTESTATION_SIGNING_KEY DATABRICKS_CLIENT_ID DATABRICKS_OPERATOR2_CLIENT_ID DATABRICKS_ADMIN_CLIENT_ID DATABRICKS_RELEASE_PROBE_CLIENT_ID DATABRICKS_VERIFIER_CLIENT_ID DATABRICKS_AGENT_RUNTIME_CLIENT_ID DATABRICKS_AGENT_PROXY_CREDENTIAL_BUNDLE DATABRICKS_ACCOUNT_HOST DATABRICKS_ACCOUNT_ID DATABRICKS_ACCOUNT_CLIENT_ID DATABRICKS_ACCOUNT_CLIENT_SECRET; do
            if [ -z "${!v}" ]; then
              missing="$missing $v"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets or variables:$missing"
            exit 1
          fi
          # Retain every value in this shell for config writes, but expose only
          # the canonical proxy bundle to its bounded parser and only public
          # client IDs to the subsequent separation check.
          export -n DATABRICKS_HOST DATABRICKS_WAREHOUSE_ID GENIE_SPACE_ID
          export -n MIP_AI_GATEWAY_PROOF_SIGNING_KEY
          export -n MIP_GATEWAY_MODEL_ATTESTATION_SIGNING_KEY
          export -n MIP_GENIE_ACTION_SECRET_KID MIP_GENIE_ACTION_SECRET_PREVIOUS_KID
          export -n MIP_ADMIN_EMAILS MIP_ADMIN_GROUP_NAME MIP_APPROVER_GROUP_NAME MIP_AUDITOR_EMAILS
          export -n MIP_GENIE_REFUSAL_TEXT_CAPTURE
          export -n MIP_UC_APPROVED_OWNER_PRINCIPALS
          export -n MIP_UC_FOREIGN_CATALOG_BINDING_POLICY MIP_DEFAULT_CATALOG
          export -n MIP_APP_NAME MIP_LAKEBASE_INSTANCE LAKEBASE_DATABASE
          export -n MIP_LAKEBASE_SYNC_CATALOG MIP_LAKEBASE_SYNC_SCHEMA
          export -n MIP_LAKEBASE_SYNC_TABLES MIP_RUNTIME_SECRET_SCOPE
          export -n MIP_APP_ROLLBACK_SECRET_SCOPE
          export -n MIP_GENIE_SPACE_NAME
          export -n MIP_AI_GATEWAY_AGENT_MODEL_FAMILY MIP_AI_GATEWAY_AGENT_EXPERIMENT_BASE
          export -n MIP_AI_GATEWAY_TABLE_PREFIX DATABRICKS_ACCOUNT_HOST
          export -n DATABRICKS_ACCOUNT_ID DATABRICKS_ACCOUNT_CLIENT_SECRET
          if ! _AGENT_PROXY_PUBLIC_FIELDS="$(
            python -m tools.databricks.agent_proxy_credential_bundle public-fields
          )"; then
            echo "::error::DATABRICKS_AGENT_PROXY_CREDENTIAL_BUNDLE is invalid"
            exit 1
          fi
          IFS=$'\t' read -r DATABRICKS_AGENT_PROXY_CLIENT_ID \
            DATABRICKS_AGENT_PROXY_CREDENTIAL_ID <<< "$_AGENT_PROXY_PUBLIC_FIELDS"
          unset _AGENT_PROXY_PUBLIC_FIELDS
          export DATABRICKS_AGENT_PROXY_CLIENT_ID
          export -n DATABRICKS_AGENT_PROXY_CREDENTIAL_ID
          export -n DATABRICKS_AGENT_PROXY_CREDENTIAL_BUNDLE
          python - <<'PY'
          import os

          names = (
              "DATABRICKS_CLIENT_ID",
              "DATABRICKS_OPERATOR2_CLIENT_ID",
              "DATABRICKS_ADMIN_CLIENT_ID",
              "DATABRICKS_RELEASE_PROBE_CLIENT_ID",
              "DATABRICKS_VERIFIER_CLIENT_ID",
              "DATABRICKS_AGENT_RUNTIME_CLIENT_ID",
              "DATABRICKS_AGENT_PROXY_CLIENT_ID",
          )
          values = [os.environ[name].strip().casefold() for name in names]
          if len(set(values)) != len(values):
              raise SystemExit("Normal, operator2, admin, release-probe, verifier, agent-runtime, and agent-proxy M2M client IDs must be pairwise distinct.")
          account_client_id = os.environ.get(
              "DATABRICKS_ACCOUNT_CLIENT_ID", ""
          ).strip().casefold()
          if account_client_id and account_client_id in values:
              raise SystemExit("Account-SCIM OAuth client must be distinct from every app-facing M2M client ID.")
          # The deployer is the UC/App deployment authority. It must never be
          # one of the app-facing identities the deploy reconciles, grants and
          # audits, nor the account-SCIM authority.
          deployer_client_id = os.environ["MIP_CI_DEPLOYER_CLIENT_ID"].strip().casefold()
          if deployer_client_id in values:
              raise SystemExit("CI deployer client ID must be distinct from every app-facing M2M client ID.")
          if account_client_id and account_client_id == deployer_client_id:
              raise SystemExit("Account-SCIM OAuth client must be distinct from the CI deployer client ID.")
          PY
          export -n DATABRICKS_CLIENT_ID DATABRICKS_OPERATOR2_CLIENT_ID
          export -n DATABRICKS_ADMIN_CLIENT_ID DATABRICKS_RELEASE_PROBE_CLIENT_ID
          export -n DATABRICKS_VERIFIER_CLIENT_ID
          export -n DATABRICKS_AGENT_RUNTIME_CLIENT_ID DATABRICKS_AGENT_PROXY_CLIENT_ID
          export -n DATABRICKS_AGENT_PROXY_CREDENTIAL_ID
          export -n DATABRICKS_AGENT_PROXY_CREDENTIAL_BUNDLE DATABRICKS_ACCOUNT_CLIENT_ID
          export -n MIP_CI_DEPLOYER_CLIENT_ID
          # No stored credential: the SDK and CLI exchange this job's GitHub
          # ID token (ACTIONS_ID_TOKEN_REQUEST_*) for a short-lived Databricks
          # token as the deployer service principal. An env DATABRICKS_CLIENT_ID,
          # DATABRICKS_TOKEN or DATABRICKS_AUTH_TYPE would override this profile,
          # so no step that authenticates as the deployer carries one into a
          # Databricks client (scripts/deploy.sh un-exports the App client pair).
          {
            echo "[DEFAULT]"
            echo "host  = ${DATABRICKS_HOST}"
            echo "auth_type = github-oidc"
            echo "client_id = ${MIP_CI_DEPLOYER_CLIENT_ID}"
          } > "$HOME/.databrickscfg"
          chmod 600 "$HOME/.databrickscfg"

          {
            echo "APP_ENV=sandbox"
            echo "DATABRICKS_HOST=${DATABRICKS_HOST}"
            echo "DATABRICKS_WAREHOUSE_ID=${DATABRICKS_WAREHOUSE_ID}"
            echo "GENIE_SPACE_ID=${GENIE_SPACE_ID}"
            echo "MIP_DEFAULT_CATALOG=${MIP_DEFAULT_CATALOG}"
            echo "MIP_LENDER_NAME=${MIP_LENDER_NAME:-Summit Mortgage}"
            echo "MIP_LENDER_NMLS_ID=${MIP_LENDER_NMLS_ID:-}"
            echo "MIP_TENANT_ID=${MIP_TENANT_ID:-}"
            echo "MIP_APP_NAME=${MIP_APP_NAME:-mip-app}"
            echo "MIP_LAKEBASE_INSTANCE=${MIP_LAKEBASE_INSTANCE:-mip-app-state}"
            echo "LAKEBASE_INSTANCE_NAME=${MIP_LAKEBASE_INSTANCE:-mip-app-state}"
            echo "LAKEBASE_DATABASE=${LAKEBASE_DATABASE:-mip_app_state}"
            echo "MIP_LAKEBASE_DATABASE_NAME=${LAKEBASE_DATABASE:-mip_app_state}"
            echo "MIP_LAKEBASE_SYNC_CATALOG=${MIP_LAKEBASE_SYNC_CATALOG:-mip_app_state}"
            echo "MIP_LAKEBASE_SYNC_SCHEMA=${MIP_LAKEBASE_SYNC_SCHEMA:-mip_sync}"
            echo "MIP_LAKEBASE_SYNC_TABLES=${MIP_LAKEBASE_SYNC_TABLES:-source_readiness,segment_population,funnel_snapshot_daily}"
            echo "MIP_RUNTIME_SECRET_SCOPE=${MIP_RUNTIME_SECRET_SCOPE:-mip-runtime}"
            echo "MIP_APP_ROLLBACK_SECRET_SCOPE=${MIP_APP_ROLLBACK_SECRET_SCOPE:-mip-app-rollback}"
            echo "MIP_GENIE_SPACE_NAME=${MIP_GENIE_SPACE_NAME:-Mortgage Lead Intelligence}"
            echo "MIP_DEFAULT_SCHEMA=gold"
            echo "MIP_ENABLE_DEMO_FIRST_PARTY_FEEDS=1"
            echo "MIP_APPROVER_IDENTITIES=${DATABRICKS_CLIENT_ID},${DATABRICKS_OPERATOR2_CLIENT_ID}"
            echo "MIP_ADMIN_IDENTITIES=${DATABRICKS_ADMIN_CLIENT_ID},${DATABRICKS_RELEASE_PROBE_CLIENT_ID}"
            if [ -n "${MIP_GENIE_ACTION_SECRET_KID:-}" ]; then
              echo "MIP_GENIE_ACTION_SECRET_KID=${MIP_GENIE_ACTION_SECRET_KID}"
            fi
            if [ -n "${MIP_GENIE_ACTION_SECRET_PREVIOUS_KID:-}" ]; then
              echo "MIP_GENIE_ACTION_SECRET_PREVIOUS_KID=${MIP_GENIE_ACTION_SECRET_PREVIOUS_KID}"
            fi
            if [ -n "${MIP_ADMIN_EMAILS:-}" ]; then
              echo "MIP_ADMIN_EMAILS=${MIP_ADMIN_EMAILS}"
            fi
            if [ -n "${MIP_AUDITOR_EMAILS:-}" ]; then
              echo "MIP_AUDITOR_EMAILS=${MIP_AUDITOR_EMAILS}"
            fi
            if [ -n "${MIP_GENIE_REFUSAL_TEXT_CAPTURE:-}" ]; then
              echo "MIP_GENIE_REFUSAL_TEXT_CAPTURE=${MIP_GENIE_REFUSAL_TEXT_CAPTURE}"
            fi
            if [ -n "${MIP_ADMIN_GROUP_NAME:-}" ]; then
              echo "MIP_ADMIN_GROUP_NAME=${MIP_ADMIN_GROUP_NAME}"
            fi
            if [ -n "${MIP_APPROVER_GROUP_NAME:-}" ]; then
              echo "MIP_APPROVER_GROUP_NAME=${MIP_APPROVER_GROUP_NAME}"
            fi
            if [ -n "${MIP_UC_APPROVED_OWNER_PRINCIPALS:-}" ]; then
              echo "MIP_UC_APPROVED_OWNER_PRINCIPALS=${MIP_UC_APPROVED_OWNER_PRINCIPALS}"
            fi
            if [ -n "${MIP_UC_FOREIGN_CATALOG_BINDING_POLICY:-}" ]; then
              echo "MIP_UC_FOREIGN_CATALOG_BINDING_POLICY=${MIP_UC_FOREIGN_CATALOG_BINDING_POLICY}"
            fi
            if [ -n "${MIP_AI_GATEWAY_AGENT_MODEL_FAMILY:-}" ]; then
              echo "MIP_AI_GATEWAY_AGENT_MODEL_FAMILY=${MIP_AI_GATEWAY_AGENT_MODEL_FAMILY}"
            fi
            if [ -n "${MIP_AI_GATEWAY_AGENT_EXPERIMENT_BASE:-}" ]; then
              echo "MIP_AI_GATEWAY_AGENT_EXPERIMENT_BASE=${MIP_AI_GATEWAY_AGENT_EXPERIMENT_BASE}"
            fi
            if [ -n "${MIP_AI_GATEWAY_TABLE_PREFIX:-}" ]; then
              echo "MIP_AI_GATEWAY_TABLE_PREFIX=${MIP_AI_GATEWAY_TABLE_PREFIX}"
            fi
          } > .env.local
          chmod 600 .env.local
      - name: Prove the GitHub OIDC deployer identity
        # Read-only, before the credential repair and before scripts/deploy.sh:
        # the DEFAULT github-oidc profile must authenticate, through both the
        # Python SDK and the Go CLI, as the reviewed deployer service principal
        # on the pr105-host workspace, with the authority the governed deploy
        # requires. It prints booleans only (an exception or CLI failure adds
        # its class or exit code, never a message or value) and exits 2 on any
        # mismatch. The profile and host checks run first; on a mismatch the
        # step exits before any network call.
        env:
          DATABRICKS_CONFIG_PROFILE: DEFAULT
          MIP_CI_DEPLOYER_CLIENT_ID: ${{ vars.MIP_CI_DEPLOYER_CLIENT_ID }}
          # Compared for equality only, under names neither the SDK nor the
          # CLI reads, so the profile alone selects the host and identity.
          MIP_PROOF_DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          MIP_PROOF_WAREHOUSE_ID: ${{ secrets.DATABRICKS_WAREHOUSE_ID }}
          MIP_PROOF_GENIE_SPACE_ID: ${{ secrets.GENIE_SPACE_ID }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import configparser
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          import yaml

          TARGET = "pr105-host"
          PROFILE = "DEFAULT"
          # Ambient names that would override or redirect the profile.
          OVERRIDES = (
              "DATABRICKS_HOST",
              "DATABRICKS_TOKEN",
              "DATABRICKS_AUTH_TYPE",
              "DATABRICKS_CLIENT_ID",
              "DATABRICKS_CLIENT_SECRET",
              "DATABRICKS_CONFIG_FILE",
          )
          checks = {}
          notes = {}


          def same(left, right):
              return bool(left) and left == right


          def report():
              for name, ok in checks.items():
                  note = f" ({notes[name]})" if name in notes else ""
                  print(f"{name}={'true' if ok else 'false'}{note}")
              if not all(checks.values()):
                  print("::error::GitHub OIDC deployer identity proof failed; see the false checks above.")
                  sys.exit(2)


          def probe(name, read):
              try:
                  checks[name] = bool(read())
              except Exception as exc:  # the class only, never its message
                  checks[name] = False
                  notes[name] = type(exc).__name__


          def admins(groups):
              return "admins" in {
                  str(group or "").strip().casefold() for group in groups
              }


          expected = os.environ.get("MIP_CI_DEPLOYER_CLIENT_ID", "").strip()
          secret_host = os.environ.get("MIP_PROOF_DATABRICKS_HOST", "").strip().rstrip("/")
          bundle = yaml.safe_load(Path("databricks.yml").read_text(encoding="utf-8")) or {}
          workspace = (((bundle.get("targets") or {}).get(TARGET) or {}).get("workspace")) or {}
          bundle_host = str(workspace.get("host") or "").strip().rstrip("/")
          parser = configparser.ConfigParser(interpolation=None)
          parser.read(Path.home() / ".databrickscfg", encoding="utf-8")
          profile = {key: value.strip() for key, value in parser[PROFILE].items()}
          profile_host = profile.get("host", "").rstrip("/")

          checks["deployer_client_id_set"] = bool(expected)
          checks["github_oidc_request_env_present"] = all(
              os.environ.get(name)
              for name in ("ACTIONS_ID_TOKEN_REQUEST_URL", "ACTIONS_ID_TOKEN_REQUEST_TOKEN")
          )
          checks["no_ambient_auth_override"] = not any(os.environ.get(name) for name in OVERRIDES)
          checks["profile_holds_only_host_auth_type_client_id"] = set(profile) == {
              "host",
              "auth_type",
              "client_id",
          }
          checks["profile_auth_type_is_github_oidc"] = profile.get("auth_type") == "github-oidc"
          checks["profile_client_id_is_the_deployer"] = same(profile.get("client_id"), expected)
          checks["profile_host_is_DATABRICKS_HOST"] = same(profile_host, secret_host)
          checks["profile_host_is_the_pr105_host_target"] = same(profile_host, bundle_host)
          if not all(checks.values()):
              report()

          from databricks.sdk import WorkspaceClient

          client = None
          me = None


          def authenticate():
              global client, me
              client = WorkspaceClient(profile=PROFILE)
              me = client.current_user.me()
              config = client.config
              return (
                  config.auth_type == "github-oidc"
                  and same(config.client_id, expected)
                  and same(str(config.host or "").rstrip("/"), profile_host)
              )


          probe("sdk_authenticates_with_the_github_oidc_profile", authenticate)
          if me is not None:
              probe("me_is_the_deployer", lambda: same(str(me.user_name or ""), expected))
              probe("me_in_admins", lambda: admins(group.display for group in me.groups or ()))
              probe(
                  "metastore_owner_is_the_deployer",
                  lambda: same(
                      str(
                          client.metastores.get(client.metastores.current().metastore_id).owner
                          or ""
                      ),
                      expected,
                  ),
              )
              warehouse_id = os.environ.get("MIP_PROOF_WAREHOUSE_ID", "").strip()
              probe(
                  "warehouse_resolves",
                  lambda: bool(warehouse_id)
                  and same(str(client.warehouses.get(warehouse_id).id or ""), warehouse_id),
              )
              space_id = os.environ.get("MIP_PROOF_GENIE_SPACE_ID", "").strip()
              probe(
                  "genie_space_resolves",
                  lambda: bool(space_id)
                  and same(str(client.genie.get_space(space_id).space_id or ""), space_id),
              )

          # The Go CLI resolves the same profile through its own auth path.
          try:
              cli = subprocess.run(
                  ["databricks", "current-user", "me", "--profile", PROFILE, "-o", "json"],
                  capture_output=True,
                  text=True,
                  check=False,
                  timeout=300,
              )
              cli_exit, cli_stdout = cli.returncode, cli.stdout
          except (OSError, subprocess.SubprocessError) as exc:
              cli_exit, cli_stdout = None, ""
              notes["cli_authenticates"] = type(exc).__name__
          checks["cli_authenticates"] = cli_exit == 0
          if cli_exit not in (0, None):
              notes["cli_authenticates"] = f"exit {cli_exit}"
          try:
              cli_me = json.loads(cli_stdout) if cli_exit == 0 else {}
          except ValueError:
              cli_me = {}
          if not isinstance(cli_me, dict):
              cli_me = {}
          probe("cli_me_is_the_deployer", lambda: same(str(cli_me.get("userName") or ""), expected))
          probe(
              "cli_me_in_admins",
              lambda: admins(group.get("display") for group in cli_me.get("groups") or ()),
          )
          report()
          print("GitHub OIDC deployer identity proven.")
          PY
      - name: Repair normal operator OAuth credential
        if: ${{ inputs.repair_normal_credential }}
        env:
          # The deployer authenticates through the DEFAULT github-oidc profile.
          # The normal identity's client id rides under its own name: an env
          # DATABRICKS_CLIENT_ID would override the profile's client_id and
          # aim the token exchange at the normal service principal.
          # DATABRICKS_HOST stays for the isolation gate; it equals the
          # profile's host, which the proof step above checked.
          DATABRICKS_CONFIG_PROFILE: DEFAULT
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          MIP_NORMAL_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          GH_TOKEN: ${{ secrets.MIP_GITHUB_CREDENTIAL_SINK_TOKEN }}
          MIP_AI_GATEWAY_PROOF_SIGNING_KEY: ${{ secrets.MIP_AI_GATEWAY_PROOF_SIGNING_KEY }}
          MIP_AI_GATEWAY_PROOF_PREVIOUS_VERIFY_KEY: ${{ secrets.MIP_AI_GATEWAY_PROOF_PREVIOUS_VERIFY_KEY }}
          MIP_AI_GATEWAY_PROOF_HISTORICAL_VERIFY_KEYS: ${{ vars.MIP_AI_GATEWAY_PROOF_HISTORICAL_VERIFY_KEYS }}
          # No live `mip-app` fallback: unset fails closed below.
          MIP_APP_NAME: ${{ vars.MIP_APP_NAME }}
          MIP_DEPLOYMENT_SOURCE_GIT_SHA: ${{ github.sha }}
          MIP_M2M_GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # This step rotates an OAuth secret before, and outside,
          # scripts/deploy.sh and its isolation preflight. So first, before
          # any workspace call: deploy-dev.yml only, DATABRICKS_HOST must be
          # the forked-anchor pr105-host target's workspace (never the dev
          # target's live workspace), and MIP_APP_NAME must name the CI
          # staging App (tools/databricks/ci_install_isolation.py).
          python -m tools.databricks.ci_install_isolation repair-credential
          missing=""
          for v in DATABRICKS_HOST MIP_NORMAL_CLIENT_ID \
                   GH_TOKEN MIP_AI_GATEWAY_PROOF_SIGNING_KEY MIP_APP_NAME \
                   MIP_DEPLOYMENT_SOURCE_GIT_SHA MIP_M2M_GITHUB_REPOSITORY; do
            if [ -z "${!v}" ]; then
              missing="$missing $v"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required credential-repair input(s):$missing"
            exit 1
          fi
          if ! MIP_AI_GATEWAY_PROOF_VERIFY_KEY="$(
            python - <<'PY'
          import os
          from backend.services.ai_gateway_proof_attestation import (
              derive_gateway_proof_verify_key,
          )

          print(
              derive_gateway_proof_verify_key(
                  os.environ["MIP_AI_GATEWAY_PROOF_SIGNING_KEY"]
              )
          )
          PY
          )"; then
            echo "::error::MIP_AI_GATEWAY_PROOF_SIGNING_KEY is invalid"
            exit 1
          fi
          export MIP_AI_GATEWAY_PROOF_VERIFY_KEY
          python -m tools.databricks.provision_m2m_oauth \
            --identity-role normal \
            --expected-application-id "$MIP_NORMAL_CLIENT_ID" \
            --app-name "$MIP_APP_NAME" \
            --no-grant-can-use \
            --gh-repo "$GITHUB_REPOSITORY" \
            --rotate \
            --set-gh-secrets
      - name: Deploy dev Databricks App
        if: ${{ !inputs.repair_normal_credential }}
        env:
          # The deployer is the DEFAULT github-oidc profile: scripts/deploy.sh's
          # workspace-auth bind checks its host against the pr105-host target,
          # exports it as the deployer profile and unsets DATABRICKS_HOST. The
          # App client pairs below are un-exported before deploy.sh's first
          # child, so none overrides the profile's client_id.
          DATABRICKS_CONFIG_PROFILE: DEFAULT
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          # The deploy's 300-second identity-probe secrets are minted, listed
          # and deleted through the deployer's workspace
          # service_principal_secrets_proxy: account-plane probe secrets never
          # became visible to the runner's inventory (docs/deployment.md, owner
          # step 9). Unset, the tools keep the account plane.
          MIP_TEMP_CREDENTIAL_PLANE: workspace
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          DATABRICKS_OPERATOR2_CLIENT_ID: ${{ secrets.DATABRICKS_OPERATOR2_CLIENT_ID }}
          DATABRICKS_ADMIN_CLIENT_ID: ${{ secrets.DATABRICKS_ADMIN_CLIENT_ID }}
          DATABRICKS_ADMIN_CLIENT_SECRET: ${{ secrets.DATABRICKS_ADMIN_CLIENT_SECRET }}
          DATABRICKS_RELEASE_PROBE_CLIENT_ID: ${{ secrets.DATABRICKS_RELEASE_PROBE_CLIENT_ID }}
          DATABRICKS_RELEASE_PROBE_CLIENT_SECRET: ${{ secrets.DATABRICKS_RELEASE_PROBE_CLIENT_SECRET }}
          DATABRICKS_VERIFIER_CLIENT_ID: ${{ secrets.DATABRICKS_VERIFIER_CLIENT_ID }}
          DATABRICKS_VERIFIER_CLIENT_SECRET: ${{ secrets.DATABRICKS_VERIFIER_CLIENT_SECRET }}
          DATABRICKS_AGENT_RUNTIME_CLIENT_ID: ${{ secrets.DATABRICKS_AGENT_RUNTIME_CLIENT_ID }}
          DATABRICKS_AGENT_RUNTIME_CLIENT_SECRET: ${{ secrets.DATABRICKS_AGENT_RUNTIME_CLIENT_SECRET }}
          DATABRICKS_AGENT_PROXY_CREDENTIAL_BUNDLE: ${{ secrets.DATABRICKS_AGENT_PROXY_CREDENTIAL_BUNDLE }}
          DATABRICKS_ACCOUNT_HOST: ${{ secrets.DATABRICKS_ACCOUNT_HOST || 'https://accounts.cloud.databricks.com' }}
          DATABRICKS_ACCOUNT_ID: ${{ secrets.DATABRICKS_ACCOUNT_ID }}
          DATABRICKS_ACCOUNT_CLIENT_ID: ${{ secrets.DATABRICKS_ACCOUNT_CLIENT_ID }}
          DATABRICKS_ACCOUNT_CLIENT_SECRET: ${{ secrets.DATABRICKS_ACCOUNT_CLIENT_SECRET }}
          MIP_AI_GATEWAY_PROOF_SIGNING_KEY: ${{ secrets.MIP_AI_GATEWAY_PROOF_SIGNING_KEY }}
          MIP_AI_GATEWAY_PROOF_PREVIOUS_VERIFY_KEY: ${{ secrets.MIP_AI_GATEWAY_PROOF_PREVIOUS_VERIFY_KEY }}
          MIP_AI_GATEWAY_PROOF_HISTORICAL_VERIFY_KEYS: ${{ vars.MIP_AI_GATEWAY_PROOF_HISTORICAL_VERIFY_KEYS }}
          MIP_GATEWAY_MODEL_ATTESTATION_SIGNING_KEY: ${{ secrets.MIP_GATEWAY_MODEL_ATTESTATION_SIGNING_KEY }}
          MIP_GATEWAY_MODEL_ATTESTATION_PREVIOUS_VERIFY_KEY: ${{ secrets.MIP_GATEWAY_MODEL_ATTESTATION_PREVIOUS_VERIFY_KEY }}
          MIP_UC_APPROVED_OWNER_PRINCIPALS: ${{ vars.MIP_UC_APPROVED_OWNER_PRINCIPALS }}
          MIP_UC_FOREIGN_CATALOG_BINDING_POLICY: ${{ vars.MIP_UC_FOREIGN_CATALOG_BINDING_POLICY }}
          MIP_DEFAULT_CATALOG: ${{ vars.MIP_DEFAULT_CATALOG || 'mip' }}
          MIP_LENDER_NAME: ${{ vars.MIP_LENDER_NAME || 'Summit Mortgage' }}
          MIP_LENDER_NMLS_ID: ${{ vars.MIP_LENDER_NMLS_ID }}
          MIP_TENANT_ID: ${{ vars.MIP_TENANT_ID }}
          MIP_APP_NAME: ${{ vars.MIP_APP_NAME || 'mip-app' }}
          MIP_LAKEBASE_INSTANCE: ${{ vars.MIP_LAKEBASE_INSTANCE || 'mip-app-state' }}
          LAKEBASE_DATABASE: ${{ vars.LAKEBASE_DATABASE || 'mip_app_state' }}
          MIP_LAKEBASE_SYNC_CATALOG: ${{ vars.MIP_LAKEBASE_SYNC_CATALOG || 'mip_app_state' }}
          MIP_LAKEBASE_SYNC_SCHEMA: ${{ vars.MIP_LAKEBASE_SYNC_SCHEMA || 'mip_sync' }}
          MIP_LAKEBASE_SYNC_TABLES: ${{ vars.MIP_LAKEBASE_SYNC_TABLES || 'source_readiness,segment_population,funnel_snapshot_daily' }}
          MIP_RUNTIME_SECRET_SCOPE: ${{ vars.MIP_RUNTIME_SECRET_SCOPE || 'mip-runtime' }}
          MIP_APP_ROLLBACK_SECRET_SCOPE: ${{ vars.MIP_APP_ROLLBACK_SECRET_SCOPE || 'mip-app-rollback' }}
          MIP_AGENT_PROXY_SECRET_SCOPE: ${{ vars.MIP_AGENT_PROXY_SECRET_SCOPE }}
          MIP_GENIE_SPACE_NAME: ${{ vars.MIP_GENIE_SPACE_NAME || 'Mortgage Lead Intelligence' }}
          MIP_AI_GATEWAY_AGENT_MODEL_FAMILY: ${{ vars.MIP_AI_GATEWAY_AGENT_MODEL_FAMILY }}
          MIP_AI_GATEWAY_AGENT_EXPERIMENT_BASE: ${{ vars.MIP_AI_GATEWAY_AGENT_EXPERIMENT_BASE }}
          MIP_AI_GATEWAY_TABLE_PREFIX: ${{ vars.MIP_AI_GATEWAY_TABLE_PREFIX }}
          # A literal, never a var: the CI staging install's own bundle root
          # (~/.bundle/<bundle>/dev-ci) and its _ci display-name suffix, so
          # this run never uploads into or shares state with the live
          # install. scripts/deploy.sh refuses this workflow without it, and
          # refuses any live-default name beside it (D-platform-process-b
          # step 7; tools/databricks/ci_install_isolation.py). The root and
          # suffix are defence in depth on the forked-anchor pr105-host
          # target's own workspace, but the catalog names checked beside it
          # are the primary UC isolation: that workspace shares the live
          # install's metastore.
          MIP_BUNDLE_ROOT_LEAF: dev-ci
          MIP_REBASE_UNVERIFIED_APP: ${{ inputs.rebase_unverified_app && '1' || '0' }}
          MIP_REMEDIATE_FOREIGN_CATALOG_BINDINGS: ${{ inputs.remediate_foreign_catalog_bindings && '1' || '0' }}
          MIP_REQUIRE_AI_GATEWAY_CLAIMABLE: '1'
          SALESFORCE_INSTANCE_URL: ${{ vars.SALESFORCE_INSTANCE_URL }}
          SALESFORCE_CLIENT_ID: ${{ vars.SALESFORCE_CLIENT_ID }}
          SALESFORCE_USERNAME: ${{ vars.SALESFORCE_USERNAME }}
          SALESFORCE_API_VERSION: ${{ vars.SALESFORCE_API_VERSION }}
          SALESFORCE_SOBJECT: ${{ vars.SALESFORCE_SOBJECT }}
          SALESFORCE_EXTERNAL_ID_FIELD: ${{ vars.SALESFORCE_EXTERNAL_ID_FIELD }}
          SALESFORCE_CLIENT_SECRET: ${{ secrets.SALESFORCE_CLIENT_SECRET }}
          SALESFORCE_PASSWORD: ${{ secrets.SALESFORCE_PASSWORD }}
          SALESFORCE_SECURITY_TOKEN: ${{ secrets.SALESFORCE_SECURITY_TOKEN }}
        run: |
          set -euo pipefail
          # The forked-anchor CI staging target only, never `dev`: its own
          # workspace host binds this run's auth to the staging workspace,
          # where the reserved identities are resolved by name (unassigned
          # in the live workspace by owner invariant; the UC metastore is
          # shared, docs/deployment.md "CI staging install").
          # scripts/deploy.sh and tools/databricks/bundle_env.py refuse this
          # workflow on any other target
          # (tools/databricks/ci_install_isolation.py).
          args=(-t pr105-host --no-confirm)
          if [ "${{ inputs.skip_silver }}" = "true" ]; then
            args+=(--skip-silver)
          fi
          if [ "${{ inputs.skip_smoke }}" = "true" ]; then
            args+=(--skip-smoke)
          fi
          ./scripts/deploy.sh "${args[@]}"
