name: deploy-dev
# One client per dispatch (M1-PR7). `client` names the client's GitHub
# Environment, whose variables (public fields) and secrets (identifying and
# secret fields) hold its whole profile (tools/clients/schema.py); nothing
# client-specific lives in this file. `phase` is the scripts/deploy.sh
# --phase the run executes: `plan` is read-only, the others mutate behind the
# environment's approval. Manual dispatch only: no push, pull_request or
# schedule trigger reaches a deploy job.
on:
  workflow_dispatch:
    inputs:
      client:
        description: "The client's GitHub Environment (its MIP_CLIENT key)"
        type: string
        required: true
      phase:
        description: "scripts/deploy.sh --phase: plan (read-only), release, data, adopt or unadopt"
        type: choice
        options: [plan, release, data, adopt, unadopt]
        default: plan
      owner_attestation:
        description: "Mutating phases: the exact profile ack (purpose profile) the plan printed; hardware-key attestation is deferred (M1-PR5)"
        type: string
        default: ""
      operation_acks:
        description: "One run only: purpose=<sha256> pairs a tool printed (adopt_plan, quiesce_window, genie_pin, ...)"
        type: string
        default: ""
      expected_active_deployment_sha256:
        description: "release only: the active deployment sha256 (or none) the plan printed"
        type: string
        default: ""
      protections_unverified_ack:
        description: "Only if GITHUB_TOKEN cannot read the environment's protection rules: the exact protections_unverified ack"
        type: string
        default: ""
      skip_silver:
        description: "Skip FRED + Cotality silver refresh jobs"
        type: boolean
        default: false
      skip_smoke:
        description: "Skip deployed app smoke test"
        type: boolean
        default: false
      rebase_unverified_app:
        description: "One-time only: stop an existing App that has no signed rollback record"
        type: boolean
        default: false
      acknowledge_single_maintainer_break_glass:
        description: "Required: acknowledge audited self-approval because this repository has one maintainer"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  refuse-unacknowledged:
    if: ${{ !inputs.acknowledge_single_maintainer_break_glass }}
    runs-on: ubuntu-latest
    steps:
      - name: Refuse an unacknowledged single-maintainer deployment
        run: |
          set -euo pipefail
          echo "::error::Dev deployment requires explicit single-maintainer break-glass acknowledgement."
          exit 1
  check-dispatch:
    # Before any job names an environment: GitHub creates an environment the
    # first time a job references a name it does not know, with no protection
    # rules, so a malformed client key never reaches `environment:`. A
    # well-formed key that has no environment yet resolves no profile and
    # refuses in the deploy job, before any ID token is exchanged.
    if: ${{ inputs.acknowledge_single_maintainer_break_glass }}
    runs-on: ubuntu-latest
    steps:
      - name: Refuse a malformed client key or phase
        env:
          MIP_DISPATCH_CLIENT: ${{ inputs.client }}
          MIP_DISPATCH_PHASE: ${{ inputs.phase }}
        run: |
          set -euo pipefail
          if [[ ! "$MIP_DISPATCH_CLIENT" =~ ^[a-z][a-z0-9-]{1,30}$ ]]; then
            echo "::error::client must be a client key: 2-31 lowercase letters, digits or '-', from a letter."
            exit 1
          fi
          case "$MIP_DISPATCH_PHASE" in
            plan|release|data|adopt|unadopt) ;;
            *) echo "::error::phase must be plan, release, data, adopt or unadopt."; exit 1 ;;
          esac
  build:
    # No ID token and no environment: Node, npm and the package index run
    # here only. The job builds the frontend, stages the App runtime closure,
    # downloads the hash-pinned wheelhouse and seals all three under a sha256
    # manifest (tools/databricks/prebuilt_release.py) whose digest the deploy
    # job checks before it installs anything.
    needs: check-dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      manifest-sha256: ${{ steps.manifest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with: { node-version: '22' }
      - uses: actions/setup-python@v6
        with: { python-version: '3.11' }
      - name: Build the frontend
        run: |
          set -euo pipefail
          npm --prefix frontend ci --no-audit --no-fund
          npm --prefix frontend run build
      - name: Download the hash-pinned wheelhouse
        # The App runtime closure only (requirements-deploy.hashes.txt, uv.lock
        # with hashes, x86_64-manylinux_2_28): never the dev tools.
        run: |
          set -euo pipefail
          python -m pip download --no-deps --only-binary=:all: --require-hashes \
            -r requirements-deploy.hashes.txt -d "$RUNNER_TEMP/prebuilt-release/wheelhouse"
      - name: Stage the App runtime closure
        # The stage needs the deploy tooling: install it offline from the
        # wheelhouse just downloaded, as the deploy job will.
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/stage-venv"
          "$RUNNER_TEMP/stage-venv/bin/python" -m pip install --no-index --find-links "$RUNNER_TEMP/prebuilt-release/wheelhouse" \
            --require-hashes --only-binary=:all: -r requirements-deploy.hashes.txt
          "$RUNNER_TEMP/stage-venv/bin/python" -m tools.databricks.app_runtime_closure stage \
            --ref "$GITHUB_SHA" \
            --dist frontend/dist \
            --out "$RUNNER_TEMP/prebuilt-release/app-release/source" \
            --manifest-out "$RUNNER_TEMP/prebuilt-release/app-release/manifest.json" \
            --require-brotli-check
          cp -R frontend/dist "$RUNNER_TEMP/prebuilt-release/dist"
      - name: Seal the prebuilt release with its sha256 manifest
        id: manifest
        run: |
          set -euo pipefail
          sha256="$(python -m tools.databricks.prebuilt_release manifest \
            --root "$RUNNER_TEMP/prebuilt-release" --git-sha "$GITHUB_SHA" \
            --requirements requirements-deploy.hashes.txt)"
          echo "sha256=${sha256}" >> "$GITHUB_OUTPUT"
          echo "prebuilt release manifest sha256: \`${sha256}\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the prebuilt release
        # Source, public packages and their manifest only: no profile value and
        # no PlanReport ever reaches an artifact.
        uses: actions/upload-artifact@v7
        with:
          name: prebuilt-release
          path: ${{ runner.temp }}/prebuilt-release
          if-no-files-found: error
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Per phase: plan 30, release 330, data 330, adopt and unadopt 60 minutes.
    # MIP_JOB_TIMEOUT_MINUTES below is the same expression (M0-PR9).
    timeout-minutes: ${{ fromJSON('{"plan":30,"release":330,"data":330,"adopt":60,"unadopt":60}')[inputs.phase] }}
    # The client's own environment: its reviewers and branch policy gate the
    # run, its variables and secrets are the profile, and the deployer's
    # federation policy trusts exactly its subject
    # (repo:<owner>/<repo>:environment:<client>).
    environment: ${{ inputs.client }}
    concurrency:
      group: mip-client-${{ inputs.client }}
      cancel-in-progress: false
    # The deployer is a dedicated account service principal with no OAuth
    # secret and no PAT: GitHub Actions OIDC workload identity federation
    # alone authenticates it. Only this job may request the ID token; actions:
    # read lets the preflight try to read the environment's protection rules
    # (spike S8 owed).
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      # Other teams' objects, owners and emails print as foreign#n handles (plan §4.16).
      MIP_REDACT_FOREIGN_NAMES: '1'
    steps:
      - name: Record the job deadline
        # timeout-minutes above, read at job start (M0-PR9): deploy.sh opens a
        # quiesce window only while this deadline leaves the predicted window,
        # the predicted restore and 15 minutes, and the window's dead-man
        # restarts blue at it if this runner dies. MIP_JOB_TIMEOUT_MINUTES must
        # equal timeout-minutes (tests/unit/test_quiesce_window_workflow.py).
        env:
          MIP_JOB_TIMEOUT_MINUTES: ${{ fromJSON('{"plan":30,"release":330,"data":330,"adopt":60,"unadopt":60}')[inputs.phase] }}
        run: |
          set -euo pipefail
          echo "MIP_JOB_DEADLINE_EPOCH=$(( $(date -u +%s) + MIP_JOB_TIMEOUT_MINUTES * 60 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with: { python-version: '3.11' }
      - uses: databricks/setup-cli@bc7e6aabb6006d8d1758bd25ee1a100935c9cb7c # v1.7.0
      - uses: actions/download-artifact@v8
        with:
          name: prebuilt-release
          path: ${{ runner.temp }}/prebuilt-release
      - name: Verify the prebuilt release against its manifest
        # Stdlib and git only, before a single wheel is installed: every file
        # is re-hashed, the manifest's own sha256 is the build job's output,
        # and the staged App source must be this checkout's commit byte for
        # byte (the build job ran npm; only the dist's bytes are its).
        env:
          MIP_PREBUILT_RELEASE_SHA256: ${{ needs.build.outputs.manifest-sha256 }}
        run: |
          set -euo pipefail
          python -m tools.databricks.prebuilt_release verify \
            --root "$RUNNER_TEMP/prebuilt-release" --git-sha "$GITHUB_SHA" \
            --requirements requirements-deploy.hashes.txt \
            --expect-manifest-sha256 "$MIP_PREBUILT_RELEASE_SHA256"
      - name: Install the deploy tooling offline and hash-pinned
        # No package index and no Node: the wheelhouse the manifest sealed.
        run: |
          set -euo pipefail
          python -m pip install --no-index --find-links "$RUNNER_TEMP/prebuilt-release/wheelhouse" \
            --require-hashes --only-binary=:all: -r requirements-deploy.hashes.txt
      - name: Resolve the client profile
        id: profile
        uses: ./.github/actions/resolve-client-profile
        with:
          environment: ${{ inputs.client }}
          vars-json: ${{ toJSON(vars) }}
          secrets-json: ${{ toJSON(secrets) }}
      - name: Prove the GitHub OIDC deployer identity
        # Read-only, before scripts/deploy.sh (tools/clients/oidc_proof.py):
        # the DEFAULT github-oidc profile authenticates, through the SDK and
        # the CLI, as the profile's deployer, in admins, on the profile's
        # workspace and metastore. Booleans only; exits 2 on any mismatch.
        env:
          DATABRICKS_CONFIG_PROFILE: DEFAULT
        run: python -m tools.clients.oidc_proof --env-file .env.local
      - name: Preflight the dispatch
        # tools/clients/dispatch_preflight.py: the workflow ref, the review
        # mode, the exact profile and operation acks, the environment
        # protections (unreadable is recorded by a plan and refused by a
        # mutating phase without its exact ack), approval provenance (not
        # applicable in single_maintainer_audited), the trust-root chain
        # (deferred, M1-PR5) and the tracked-tree scan. It exports the
        # operation acks for this job only.
        env:
          MIP_VARS_JSON: ${{ toJSON(vars) }}
          MIP_SECRETS_JSON: ${{ toJSON(secrets) }}
          MIP_DISPATCH_CLIENT: ${{ inputs.client }}
          MIP_DISPATCH_PHASE: ${{ inputs.phase }}
          MIP_DISPATCH_PROFILE_ACK: ${{ inputs.owner_attestation }}
          MIP_DISPATCH_OPERATION_ACKS: ${{ inputs.operation_acks }}
          MIP_DISPATCH_PROTECTIONS_ACK: ${{ inputs.protections_unverified_ack }}
          MIP_DISPATCH_EXPECTED_ACTIVE_DEPLOYMENT_SHA256: ${{ inputs.expected_active_deployment_sha256 }}
          MIP_DISPATCH_BREAK_GLASS: ${{ inputs.acknowledge_single_maintainer_break_glass }}
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -m tools.clients.dispatch_preflight
          --phase "$MIP_DISPATCH_PHASE"
          --environment "$MIP_DISPATCH_CLIENT"
          --vars-json env:MIP_VARS_JSON
          --secrets-json env:MIP_SECRETS_JSON
          --github-env "$GITHUB_ENV"
          --step-summary "$GITHUB_STEP_SUMMARY"
      - name: Run the client phase
        env:
          # The deployer is the DEFAULT github-oidc profile: scripts/deploy.sh's
          # workspace-auth bind checks its host against .env.local's
          # DATABRICKS_HOST. The whole profile, its secret fields included, is
          # the .env.local the resolve-client-profile action wrote, exactly as
          # an operator's: deploy.sh un-exports every credential before its
          # first child, and each child that resolves the profile reads
          # .env.local, so no secret is bound to this step.
          DATABRICKS_CONFIG_PROFILE: DEFAULT
          # Identity-probe secrets are minted, listed and deleted through the
          # deployer's workspace service_principal_secrets_proxy.
          MIP_TEMP_CREDENTIAL_PLANE: workspace
          MIP_PREBUILT_RELEASE_SHA256: ${{ needs.build.outputs.manifest-sha256 }}
          MIP_DISPATCH_PHASE: ${{ inputs.phase }}
          MIP_DISPATCH_SKIP_SILVER: ${{ inputs.skip_silver }}
          MIP_DISPATCH_SKIP_SMOKE: ${{ inputs.skip_smoke }}
          MIP_REBASE_UNVERIFIED_APP: ${{ inputs.rebase_unverified_app && '1' || '0' }}
          # No remediation input: the foreign-catalog binding remediation
          # rewrites bindings for the whole shared metastore, so this workflow
          # can never request it (docs/security/GRANTS.md).
          MIP_REMEDIATE_FOREIGN_CATALOG_BINDINGS: '0'
          MIP_REQUIRE_AI_GATEWAY_CLAIMABLE: '1'
        run: |
          set -euo pipefail
          args=(-t client --phase "$MIP_DISPATCH_PHASE" --no-confirm --prebuilt-release "$RUNNER_TEMP/prebuilt-release")
          if [ "$MIP_DISPATCH_SKIP_SILVER" = "true" ]; then
            args+=(--skip-silver)
          fi
          if [ "$MIP_DISPATCH_SKIP_SMOKE" = "true" ]; then
            args+=(--skip-smoke)
          fi
          ./scripts/deploy.sh "${args[@]}"
      - name: Record the quiesce window journal state
        # Read-only, whatever happened above (M0-PR9): the window journal and
        # its dead-man's marker, as codes and booleans only. It never stops,
        # starts, cancels or writes anything. This step has no key registry
        # (deploy.sh derives the verify key in its own process), so it records
        # the raw state, marked unverified; no decision ever reads it.
        if: always()
        env:
          DATABRICKS_CONFIG_PROFILE: DEFAULT
          MIP_APP_NAME: ${{ steps.profile.outputs.app-name }}
        run: |
          set -uo pipefail
          if line="$(python -m tools.databricks.quiesce_window status --unverified --app-name "$MIP_APP_NAME" | grep '^\[mip-quiesce-window\] status (unverified): journal ')"; then
            echo "$line"
            echo "$line" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::the quiesce window journal could not be read"
          fi
      - name: Remove the profile files
        # Defence in depth on an ephemeral runner: .env.local holds the whole
        # profile, secrets included, and the DEFAULT profile names the deployer.
        if: always()
        run: rm -f .env.local "$HOME/.databrickscfg"
