            ${{ vars.MIP_UC_METASTORE_OWNER && 'MIP_UC_METASTORE_OWNER' || '' }}
          MIP_REPOSITORY_SCOPE_SECRETS: >-
            ${{ secrets.APP_ENV && 'APP_ENV' || '' }}
            ${{ secrets.DATABRICKS_ACCOUNT_CLIENT_ID && 'DATABRICKS_ACCOUNT_CLIENT_ID' || '' }}
            ${{ secrets.DATABRICKS_ACCOUNT_CLIENT_SECRET && 'DATABRICKS_ACCOUNT_CLIENT_SECRET' || '' }}
            ${{ secrets.DATABRICKS_ACCOUNT_HOST && 'DATABRICKS_ACCOUNT_HOST' || '' }}
            ${{ secrets.DATABRICKS_ACCOUNT_ID && 'DATABRICKS_ACCOUNT_ID' || '' }}
            ${{ secrets.DATABRICKS_ADMIN_CLIENT_ID && 'DATABRICKS_ADMIN_CLIENT_ID' || '' }}
            ${{ secrets.DATABRICKS_ADMIN_CLIENT_SECRET && 'DATABRICKS_ADMIN_CLIENT_SECRET' || '' }}
            ${{ secrets.DATABRICKS_AGENT_PROXY_CLIENT_ID && 'DATABRICKS_AGENT_PROXY_CLIENT_ID' || '' }}
            ${{ secrets.DATABRICKS_AGENT_PROXY_CREDENTIAL_BUNDLE && 'DATABRICKS_AGENT_PROXY_CREDENTIAL_BUNDLE' || '' }}
            ${{ secrets.DATABRICKS_AGENT_RUNTIME_CLIENT_ID && 'DATABRICKS_AGENT_RUNTIME_CLIENT_ID' || '' }}
            ${{ secrets.DATABRICKS_AGENT_RUNTIME_CLIENT_SECRET && 'DATABRICKS_AGENT_RUNTIME_CLIENT_SECRET' || '' }}
            ${{ secrets.DATABRICKS_CLIENT_ID && 'DATABRICKS_CLIENT_ID' || '' }}
            ${{ secrets.DATABRICKS_CLIENT_SECRET && 'DATABRICKS_CLIENT_SECRET' || '' }}
            ${{ secrets.DATABRICKS_HOST && 'DATABRICKS_HOST' || '' }}
            ${{ secrets.DATABRICKS_OPERATOR2_CLIENT_ID && 'DATABRICKS_OPERATOR2_CLIENT_ID' || '' }}
            ${{ secrets.DATABRICKS_OPERATOR2_CLIENT_SECRET && 'DATABRICKS_OPERATOR2_CLIENT_SECRET' || '' }}
            ${{ secrets.DATABRICKS_RELEASE_PROBE_CLIENT_ID && 'DATABRICKS_RELEASE_PROBE_CLIENT_ID' || '' }}
            ${{ secrets.DATABRICKS_RELEASE_PROBE_CLIENT_SECRET && 'DATABRICKS_RELEASE_PROBE_CLIENT_SECRET' || '' }}
            ${{ secrets.DATABRICKS_VERIFIER_CLIENT_ID && 'DATABRICKS_VERIFIER_CLIENT_ID' || '' }}
            ${{ secrets.DATABRICKS_VERIFIER_CLIENT_SECRET && 'DATABRICKS_VERIFIER_CLIENT_SECRET' || '' }}
            ${{ secrets.LAKEBASE_DATABASE && 'LAKEBASE_DATABASE' || '' }}
            ${{ secrets.LAKEBASE_INSTANCE_NAME && 'LAKEBASE_INSTANCE_NAME' || '' }}
            ${{ secrets.MIP_ACCEPTED_EXPOSURE_JSON && 'MIP_ACCEPTED_EXPOSURE_JSON' || '' }}
            ${{ secrets.MIP_ADMIN_EMAILS && 'MIP_ADMIN_EMAILS' || '' }}
            ${{ secrets.MIP_ADMIN_GROUP_NAME && 'MIP_ADMIN_GROUP_NAME' || '' }}
            ${{ secrets.MIP_ADMIN_IDENTITIES && 'MIP_ADMIN_IDENTITIES' || '' }}
            ${{ secrets.MIP_AGENTIC_TIER && 'MIP_AGENTIC_TIER' || '' }}
            ${{ secrets.MIP_AGENT_PROXY_CLIENT_ID && 'MIP_AGENT_PROXY_CLIENT_ID' || '' }}
            ${{ secrets.MIP_AGENT_PROXY_SECRET_SCOPE && 'MIP_AGENT_PROXY_SECRET_SCOPE' || '' }}
            ${{ secrets.MIP_AGENT_RUNTIME_CLIENT_ID && 'MIP_AGENT_RUNTIME_CLIENT_ID' || '' }}
            ${{ secrets.MIP_AGENT_SUPERVISOR_NAME && 'MIP_AGENT_SUPERVISOR_NAME' || '' }}
            ${{ secrets.MIP_AI_GATEWAY_AGENT_EXPERIMENT_BASE && 'MIP_AI_GATEWAY_AGENT_EXPERIMENT_BASE' || '' }}
            ${{ secrets.MIP_AI_GATEWAY_PROOF_SIGNING_KEY && 'MIP_AI_GATEWAY_PROOF_SIGNING_KEY' || '' }}
            ${{ secrets.MIP_AI_GATEWAY_TABLE_PREFIX && 'MIP_AI_GATEWAY_TABLE_PREFIX' || '' }}
            ${{ secrets.MIP_AI_GATEWAY_VERIFIER_CLIENT_ID && 'MIP_AI_GATEWAY_VERIFIER_CLIENT_ID' || '' }}
            ${{ secrets.MIP_APPROVER_EMAILS && 'MIP_APPROVER_EMAILS' || '' }}
            ${{ secrets.MIP_APPROVER_GROUP_NAME && 'MIP_APPROVER_GROUP_NAME' || '' }}
            ${{ secrets.MIP_APPROVER_IDENTITIES && 'MIP_APPROVER_IDENTITIES' || '' }}
            ${{ secrets.MIP_APP_ENV && 'MIP_APP_ENV' || '' }}
            ${{ secrets.MIP_APP_NAME && 'MIP_APP_NAME' || '' }}
