            ${{ vars.MIP_SCHEDULED_REFRESH_RECIPIENTS && 'MIP_SCHEDULED_REFRESH_RECIPIENTS' || '' }}
            ${{ vars.MIP_SEED_OPERATOR_EMAIL && 'MIP_SEED_OPERATOR_EMAIL' || '' }}
            ${{ vars.MIP_UC_APPROVED_OWNER_PRINCIPALS && 'MIP_UC_APPROVED_OWNER_PRINCIPALS' || '' }}
            ${{ vars.MIP_UC_CATALOG_STORAGE_ROOT && 'MIP_UC_CATALOG_STORAGE_ROOT' || '' }}
            ${{ vars.MIP_UC_INTERIM_OWNER_PAIRS_JSON && 'MIP_UC_INTERIM_OWNER_PAIRS_JSON' || '' }}
            ${{ vars.MIP_UC_METASTORE_OWNER && 'MIP_UC_METASTORE_OWNER' || '' }}
        run: >-
          python -m tools.clients.workflow_contexts collect
          --vars-out "$RUNNER_TEMP/mip-client-vars.json"
          --secrets-out "$RUNNER_TEMP/mip-client-secrets.json"
      - name: Resolve the client profile
        id: profile
        uses: ./.github/actions/resolve-client-profile
        with:
          environment: ${{ inputs.client }}
          vars-file: ${{ runner.temp }}/mip-client-vars.json
          secrets-file: ${{ runner.temp }}/mip-client-secrets.json
      - name: Prove the GitHub OIDC deployer identity
        # Read-only, before scripts/deploy.sh (tools/clients/oidc_proof.py):
        # the DEFAULT github-oidc profile authenticates, through the SDK and
        # the CLI, as the profile's deployer, in admins, on the profile's
        # workspace and metastore. Booleans only; exits 2 on any mismatch.
        env:
          DATABRICKS_CONFIG_PROFILE: DEFAULT
        run: python -m tools.clients.oidc_proof --env-file .env.local
      - name: Preflight the dispatch
        # tools/clients/dispatch_preflight.py: the workflow ref, the review
        # mode, the exact profile and operation acks, the environment
        # protections (unreadable is recorded by a plan and refused by a
        # mutating phase without its exact ack), approval provenance (not
        # applicable in single_maintainer_audited), the trust-root chain
        # (deferred, M1-PR5) and the tracked-tree scan. It exports the
        # operation acks for this job only.
        env:
          MIP_DISPATCH_CLIENT: ${{ inputs.client }}
          MIP_DISPATCH_PHASE: ${{ inputs.phase }}
          MIP_DISPATCH_PROFILE_ACK: ${{ inputs.owner_attestation }}
          MIP_DISPATCH_OPERATION_ACKS: ${{ inputs.operation_acks }}
          MIP_DISPATCH_PROTECTIONS_ACK: ${{ inputs.protections_unverified_ack }}
          MIP_DISPATCH_EXPECTED_ACTIVE_DEPLOYMENT_SHA256: ${{ inputs.expected_active_deployment_sha256 }}
          MIP_DISPATCH_BREAK_GLASS: ${{ inputs.acknowledge_single_maintainer_break_glass }}
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -m tools.clients.dispatch_preflight
          --phase "$MIP_DISPATCH_PHASE"
          --environment "$MIP_DISPATCH_CLIENT"
          --vars-json "$RUNNER_TEMP/mip-client-vars.json"
          --secrets-json "$RUNNER_TEMP/mip-client-secrets.json"
          --github-env "$GITHUB_ENV"
          --step-summary "$GITHUB_STEP_SUMMARY"
      - name: Run the client phase
        # Every scripts/deploy.sh phase. freeze and thaw run the next step
        # instead: deploy.sh has no such phase and refuses the name.
        if: ${{ inputs.phase != 'freeze' && inputs.phase != 'thaw' }}
        env:
          # The deployer is the DEFAULT github-oidc profile: scripts/deploy.sh's
          # workspace-auth bind checks its host against .env.local's
          # DATABRICKS_HOST. The whole profile, its secret fields included, is
          # the .env.local the resolve-client-profile action wrote, exactly as
          # an operator's: deploy.sh un-exports every credential before its
          # first child, and each child that resolves the profile reads
          # .env.local, so no secret is bound to this step.
          DATABRICKS_CONFIG_PROFILE: DEFAULT
          # Identity-probe secrets are minted, listed and deleted through the
          # deployer's workspace service_principal_secrets_proxy.
          MIP_TEMP_CREDENTIAL_PLANE: workspace
          MIP_PREBUILT_RELEASE_SHA256: ${{ needs.build.outputs.manifest-sha256 }}
          MIP_DISPATCH_PHASE: ${{ inputs.phase }}
          MIP_DISPATCH_SKIP_SILVER: ${{ inputs.skip_silver }}
          MIP_DISPATCH_SKIP_SMOKE: ${{ inputs.skip_smoke }}
          MIP_REBASE_UNVERIFIED_APP: ${{ inputs.rebase_unverified_app && '1' || '0' }}
          MIP_REQUIRE_AI_GATEWAY_CLAIMABLE: '1'
        run: |
          set -euo pipefail
          args=(-t client --phase "$MIP_DISPATCH_PHASE" --no-confirm --prebuilt-release "$RUNNER_TEMP/prebuilt-release")
          if [ "$MIP_DISPATCH_SKIP_SILVER" = "true" ]; then
            args+=(--skip-silver)
          fi
          if [ "$MIP_DISPATCH_SKIP_SMOKE" = "true" ]; then
            args+=(--skip-smoke)
          fi
          ./scripts/deploy.sh "${args[@]}"
      - name: Freeze or thaw the emergency publisher
        # tools/clients/publisher_freeze.py, CI only: it signs the create-only
        # freeze marker (or its thaw) the emergency recipe's publisher obeys,
        # with the proof-signing key it reads in-process from .env.local. No
        # secret and no variable is bound to this step, the key is never in
        # its env or argv, and it prints marker ids, epochs and digests only.
        # The thaw's exact freeze_thaw ack arrives through GITHUB_ENV, from the
        # preflight above, which admits it in the thaw phase only.
        if: ${{ inputs.phase == 'freeze' || inputs.phase == 'thaw' }}
        env:
          DATABRICKS_CONFIG_PROFILE: DEFAULT
          MIP_DISPATCH_PHASE: ${{ inputs.phase }}
        run: python -m tools.clients.publisher_freeze --phase "$MIP_DISPATCH_PHASE" --env-file .env.local
      - name: Record the quiesce window journal state
        # Read-only, whatever happened above (M0-PR9): the window journal and
        # its dead-man's marker, as codes and booleans only. It never stops,
        # starts, cancels or writes anything. This step has no key registry
        # (deploy.sh derives the verify key in its own process), so it records
        # the raw state, marked unverified; no decision ever reads it.
        if: always()
        env:
          DATABRICKS_CONFIG_PROFILE: DEFAULT
          MIP_APP_NAME: ${{ steps.profile.outputs.app-name }}
        run: |
          set -uo pipefail
          if line="$(python -m tools.databricks.quiesce_window status --unverified --app-name "$MIP_APP_NAME" | grep '^\[mip-quiesce-window\] status (unverified): journal ')"; then
            echo "$line"
            echo "$line" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::the quiesce window journal could not be read"
          fi
      - name: Remove the profile files
        # Defence in depth on an ephemeral runner: .env.local and the two
        # collected objects hold the whole profile, secrets included, and the
        # DEFAULT profile names the deployer.
        if: always()
        run: rm -f .env.local "$HOME/.databrickscfg" "$RUNNER_TEMP/mip-client-vars.json" "$RUNNER_TEMP/mip-client-secrets.json"
