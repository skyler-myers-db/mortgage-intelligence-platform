name: deploy-dev
# One client per dispatch (M1-PR7). `client` names the client's GitHub
# Environment, whose variables (public fields) and secrets (identifying and
# secret fields) hold its whole profile (tools/clients/schema.py); nothing
# client-specific lives in this file. No step holds a whole vars or secrets
# context: a step's env prints in its log header, and a variable prints in
# clear (tools/clients/workflow_contexts.py names the two steps that read one). `phase` is the scripts/deploy.sh
# --phase the run executes: `plan` changes no governed resource (its one write
# is a create-only plan report in the deployer's plan-reports folder), the
# others mutate behind the environment's approval. Two phases never run
# scripts/deploy.sh: `freeze` and `thaw` sign the create-only marker the
# emergency recipe's publisher obeys (tools/clients/publisher_freeze.py),
# behind the same approval, profile ack and OIDC proof. Manual dispatch only: no push, pull_request or
# schedule trigger reaches a deploy job.
on:
  workflow_dispatch:
    inputs:
      client:
        description: "The client's GitHub Environment (its MIP_CLIENT key)"
        type: string
        required: true
      phase:
        description: "scripts/deploy.sh --phase: plan (no governed change; its one write is the create-only plan report), release, data, adopt or unadopt; or freeze / thaw (the emergency publisher's signed marker, no deploy.sh run)"
        type: choice
        options: [plan, release, data, adopt, unadopt, freeze, thaw]
        default: plan
      owner_attestation:
        description: "Mutating phases: the exact profile ack (purpose profile) the plan printed; hardware-key attestation is deferred (M1-PR5)"
        type: string
        default: ""
      operation_acks:
        description: "One run only: purpose=<sha256> pairs a tool printed (adopt_plan, quiesce_window, genie_pin, ...)"
        type: string
        default: ""
      expected_active_deployment_sha256:
        description: "release only: the active deployment sha256 (or none) the plan printed"
        type: string
        default: ""
      protections_unverified_ack:
        description: "Only if GITHUB_TOKEN cannot read the environment's protection rules: the exact protections_unverified ack"
        type: string
        default: ""
      skip_silver:
        description: "Skip FRED + Cotality silver refresh jobs"
        type: boolean
        default: false
      skip_smoke:
        description: "Skip deployed app smoke test"
        type: boolean
        default: false
      rebase_unverified_app:
        description: "One-time only: stop an existing App that has no signed rollback record"
        type: boolean
        default: false
      acknowledge_single_maintainer_break_glass:
        description: "Required: acknowledge audited self-approval because this repository has one maintainer"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  refuse-unacknowledged:
    if: ${{ !inputs.acknowledge_single_maintainer_break_glass }}
    runs-on: ubuntu-latest
    steps:
      - name: Refuse an unacknowledged single-maintainer deployment
        run: |
          set -euo pipefail
          echo "::error::Dev deployment requires explicit single-maintainer break-glass acknowledgement."
          exit 1
  check-dispatch:
    # Before any job names an environment: GitHub creates an environment the
    # first time a job references a name it does not know, with no protection
    # rules, so a malformed client key never reaches `environment:`, and an
    # environment that is not a client's (dev, copilot, github-pages) never
    # becomes a deploy target. A well-formed key that has no environment yet
    # resolves no profile and refuses in the deploy job, before any ID token
    # is exchanged.
    if: ${{ inputs.acknowledge_single_maintainer_break_glass }}
    runs-on: ubuntu-latest
    steps:
      - name: Refuse step debug logging
        # Step debug logging traces every expression with its operands before
        # a step runs, a variable's value included, and variables are never
        # masked: no step of this job may run under it.
        if: ${{ runner.debug == '1' }}
        run: |
          echo "::error::deploy-dev.yml refuses step debug logging: it prints expression operands, variables included, in clear."
          exit 1
      - name: Refuse a malformed client key or phase
        env:
          MIP_DISPATCH_CLIENT: ${{ inputs.client }}
          MIP_DISPATCH_PHASE: ${{ inputs.phase }}
        run: |
          set -euo pipefail
          if [[ ! "$MIP_DISPATCH_CLIENT" =~ ^[a-z][a-z0-9-]{1,30}$ ]]; then
            echo "::error::client must be a client key: 2-31 lowercase letters, digits or '-', from a letter."
            exit 1
          fi
          case "$MIP_DISPATCH_CLIENT" in
            copilot|dev|github-pages) echo "::error::client must name a client's environment; ${MIP_DISPATCH_CLIENT} is not one."; exit 1 ;;
          esac
          case "$MIP_DISPATCH_PHASE" in
            plan|release|data|adopt|unadopt|freeze|thaw) ;;
            *) echo "::error::phase must be plan, release, data, adopt, unadopt, freeze or thaw."; exit 1 ;;
          esac
      - name: Refuse a profile name set at repository or organization level
        # This job runs in no environment, so vars and secrets hold only
        # repository and organization entries here. GitHub merges those into
        # every client environment's contexts, and nothing says which scope an
        # entry came from: a field a client's environment omits would be filled
        # silently from another install's. Each expression yields a name or
        # nothing, never a value (generated: python -m
        # tools.clients.workflow_contexts print).
        env:
          MIP_REPOSITORY_SCOPE_VARS: >-
            ${{ vars.APP_ENV && 'APP_ENV' || '' }}
            ${{ vars.DATABRICKS_ACCOUNT_CLIENT_ID && 'DATABRICKS_ACCOUNT_CLIENT_ID' || '' }}
            ${{ vars.DATABRICKS_ACCOUNT_CLIENT_SECRET && 'DATABRICKS_ACCOUNT_CLIENT_SECRET' || '' }}
            ${{ vars.DATABRICKS_ACCOUNT_HOST && 'DATABRICKS_ACCOUNT_HOST' || '' }}
            ${{ vars.DATABRICKS_ACCOUNT_ID && 'DATABRICKS_ACCOUNT_ID' || '' }}
            ${{ vars.DATABRICKS_ADMIN_CLIENT_ID && 'DATABRICKS_ADMIN_CLIENT_ID' || '' }}
            ${{ vars.DATABRICKS_ADMIN_CLIENT_SECRET && 'DATABRICKS_ADMIN_CLIENT_SECRET' || '' }}
            ${{ vars.DATABRICKS_AGENT_PROXY_CLIENT_ID && 'DATABRICKS_AGENT_PROXY_CLIENT_ID' || '' }}
            ${{ vars.DATABRICKS_AGENT_PROXY_CREDENTIAL_BUNDLE && 'DATABRICKS_AGENT_PROXY_CREDENTIAL_BUNDLE' || '' }}
            ${{ vars.DATABRICKS_AGENT_RUNTIME_CLIENT_ID && 'DATABRICKS_AGENT_RUNTIME_CLIENT_ID' || '' }}
            ${{ vars.DATABRICKS_AGENT_RUNTIME_CLIENT_SECRET && 'DATABRICKS_AGENT_RUNTIME_CLIENT_SECRET' || '' }}
            ${{ vars.DATABRICKS_CLIENT_ID && 'DATABRICKS_CLIENT_ID' || '' }}
            ${{ vars.DATABRICKS_CLIENT_SECRET && 'DATABRICKS_CLIENT_SECRET' || '' }}
            ${{ vars.DATABRICKS_HOST && 'DATABRICKS_HOST' || '' }}
            ${{ vars.DATABRICKS_OPERATOR2_CLIENT_ID && 'DATABRICKS_OPERATOR2_CLIENT_ID' || '' }}
            ${{ vars.DATABRICKS_OPERATOR2_CLIENT_SECRET && 'DATABRICKS_OPERATOR2_CLIENT_SECRET' || '' }}
            ${{ vars.DATABRICKS_RELEASE_PROBE_CLIENT_ID && 'DATABRICKS_RELEASE_PROBE_CLIENT_ID' || '' }}
            ${{ vars.DATABRICKS_RELEASE_PROBE_CLIENT_SECRET && 'DATABRICKS_RELEASE_PROBE_CLIENT_SECRET' || '' }}
            ${{ vars.DATABRICKS_VERIFIER_CLIENT_ID && 'DATABRICKS_VERIFIER_CLIENT_ID' || '' }}
            ${{ vars.DATABRICKS_VERIFIER_CLIENT_SECRET && 'DATABRICKS_VERIFIER_CLIENT_SECRET' || '' }}
            ${{ vars.LAKEBASE_DATABASE && 'LAKEBASE_DATABASE' || '' }}
            ${{ vars.LAKEBASE_INSTANCE_NAME && 'LAKEBASE_INSTANCE_NAME' || '' }}
            ${{ vars.MIP_ACCEPTED_EXPOSURE_JSON && 'MIP_ACCEPTED_EXPOSURE_JSON' || '' }}
            ${{ vars.MIP_ADMIN_EMAILS && 'MIP_ADMIN_EMAILS' || '' }}
            ${{ vars.MIP_ADMIN_GROUP_NAME && 'MIP_ADMIN_GROUP_NAME' || '' }}
            ${{ vars.MIP_ADMIN_IDENTITIES && 'MIP_ADMIN_IDENTITIES' || '' }}
            ${{ vars.MIP_AGENTIC_TIER && 'MIP_AGENTIC_TIER' || '' }}
            ${{ vars.MIP_AGENT_PROXY_CLIENT_ID && 'MIP_AGENT_PROXY_CLIENT_ID' || '' }}
            ${{ vars.MIP_AGENT_PROXY_SECRET_SCOPE && 'MIP_AGENT_PROXY_SECRET_SCOPE' || '' }}
            ${{ vars.MIP_AGENT_RUNTIME_CLIENT_ID && 'MIP_AGENT_RUNTIME_CLIENT_ID' || '' }}
            ${{ vars.MIP_AGENT_SUPERVISOR_NAME && 'MIP_AGENT_SUPERVISOR_NAME' || '' }}
            ${{ vars.MIP_AI_GATEWAY_AGENT_EXPERIMENT_BASE && 'MIP_AI_GATEWAY_AGENT_EXPERIMENT_BASE' || '' }}
            ${{ vars.MIP_AI_GATEWAY_PROOF_SIGNING_KEY && 'MIP_AI_GATEWAY_PROOF_SIGNING_KEY' || '' }}
            ${{ vars.MIP_AI_GATEWAY_TABLE_PREFIX && 'MIP_AI_GATEWAY_TABLE_PREFIX' || '' }}
            ${{ vars.MIP_AI_GATEWAY_VERIFIER_CLIENT_ID && 'MIP_AI_GATEWAY_VERIFIER_CLIENT_ID' || '' }}
            ${{ vars.MIP_APPROVER_EMAILS && 'MIP_APPROVER_EMAILS' || '' }}
            ${{ vars.MIP_APPROVER_GROUP_NAME && 'MIP_APPROVER_GROUP_NAME' || '' }}
            ${{ vars.MIP_APPROVER_IDENTITIES && 'MIP_APPROVER_IDENTITIES' || '' }}
            ${{ vars.MIP_APP_ENV && 'MIP_APP_ENV' || '' }}
            ${{ vars.MIP_APP_NAME && 'MIP_APP_NAME' || '' }}
            ${{ vars.MIP_APP_ROLLBACK_SECRET_SCOPE && 'MIP_APP_ROLLBACK_SECRET_SCOPE' || '' }}
