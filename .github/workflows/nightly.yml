name: nightly (live UC)

# Nightly workflow -- runs the real-UC integration + Playwright suites
# against the dev Databricks workspace at ~05:00 CT (10:00 UTC). This is
# the canary that catches:
#   - SQL<->Python parity drift (tests/integration/test_sql_python_parity.py)
#   - Genie space regression (tests/integration/test_genie_live.py)
#   - Lakebase schema/auth drift (tests/integration/test_lakebase_round_trip.py)
#   - End-to-end live product path (tests/e2e/real_data.spec.ts)
#
# All jobs require repo secrets (see .github/workflows/README.md). A
# manual `workflow_dispatch` trigger is wired so an engineer can re-run
# after a workspace outage without waiting for the next cron fire.
#
# On failure: a GitHub issue is created with the failing job name + a
# link to the run. Slack/PagerDuty integration is deliberately deferred
# until the user picks a notification channel.

on:
  schedule:
    # 10:00 UTC = 05:00 CT (CDT) / 04:00 CT (CST). Early-morning run
    # catches regressions before the workday starts.
    - cron: '0 10 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '22'

permissions:
  contents: read
  issues: write   # required for the auto-filed failure issue

jobs:
  parity-live:
    name: SQL<->Python + Lakebase + Genie live
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_WAREHOUSE_ID: ${{ secrets.DATABRICKS_WAREHOUSE_ID }}
      GENIE_SPACE_ID: ${{ secrets.GENIE_SPACE_ID }}
      LAKEBASE_HOST: ${{ secrets.LAKEBASE_HOST }}
      LAKEBASE_USER: ${{ secrets.LAKEBASE_USER }}
      LAKEBASE_PASSWORD: ${{ secrets.LAKEBASE_PASSWORD }}
      LAKEBASE_DATABASE_NAME: ${{ secrets.LAKEBASE_DATABASE_NAME }}
      LAKEBASE_INTEGRATION: '1'   # opt-in flag Slice 5 requires
      # Live-UC tests MUST NOT run against mock repos.
      MIP_MOCK_MODE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Fail fast if required secrets are missing
        # Catches the "secrets were rotated and nobody updated the repo"
        # class of failure explicitly instead of letting pytest emit a
        # SKIP that a human has to decode.
        run: |
          missing=""
          for v in DATABRICKS_HOST DATABRICKS_TOKEN DATABRICKS_WAREHOUSE_ID \
                   GENIE_SPACE_ID LAKEBASE_HOST LAKEBASE_USER LAKEBASE_PASSWORD; do
            if [ -z "${!v}" ]; then
              missing="$missing $v"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets:$missing"
            exit 1
          fi
      - name: Install Databricks CLI (v2)
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
          databricks --version
      - name: databricks bundle validate (dev target, real creds)
        # The real validate moved here from PR CI because it unavoidably
        # calls /api/2.0/preview/scim/v2/Me which requires a real token.
        # Newer CLI (v0.297+) always resolves a profile from
        # ~/.databrickscfg -- env-var-only auth returns the misleading
        # error "no DEFAULT profile configured." Seed a real DEFAULT
        # profile from the secrets block; the secrets values double-pipe
        # into both the env vars the Python SDK reads and the
        # .databrickscfg file the CLI reads.
        env:
          DATABRICKS_AUTH_TYPE: pat
          BUNDLE_VAR_sql_warehouse_id: ${{ secrets.DATABRICKS_WAREHOUSE_ID }}
          BUNDLE_VAR_genie_space_id: ${{ secrets.GENIE_SPACE_ID }}
          BUNDLE_VAR_lakebase_instance: mip-app-state
        run: |
          {
            echo "[DEFAULT]"
            echo "host  = ${DATABRICKS_HOST}"
            echo "token = ${DATABRICKS_TOKEN}"
          } > "$HOME/.databrickscfg"
          chmod 600 "$HOME/.databrickscfg"
          databricks bundle validate -t dev
      - name: SQL <-> Python parity
        run: pytest -q tests/integration/test_sql_python_parity.py
      - name: Lakebase round-trip
        # continue-on-error so a stale LAKEBASE_PASSWORD secret doesn't
        # block the downstream Genie regression + Playwright runs.
        # Failure is still surfaced by the auto-filed GitHub issue; the
        # job-level conclusion is "failure" when this step fails, which
        # is the right behavior for the tracking issue.
        continue-on-error: true
        run: pytest -q tests/integration/test_lakebase_round_trip.py
      - name: Genie live
        if: always()
        run: pytest -q tests/integration/test_genie_live.py
      - name: Genie regression + adversarial
        # 29 checks total: 22 live-gated Genie space queries (wired to the
        # same secrets as the step above) + 7 credential-free graders that
        # lint space instructions and adversarial prompt contracts. Runs
        # after `Genie live` so a broken space surfaces there first.
        # `if: always()` so a Lakebase outage doesn't stop Genie regression
        # from exercising the hardened space.
        if: always()
        run: pytest -q tests/integration/test_genie_regression.py

  playwright-e2e-live:
    name: Playwright (real-UC golden path)
    needs: parity-live
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_WAREHOUSE_ID: ${{ secrets.DATABRICKS_WAREHOUSE_ID }}
      GENIE_SPACE_ID: ${{ secrets.GENIE_SPACE_ID }}
      # Deliberately omit LAKEBASE_HOST / _USER / _PASSWORD here so the
      # backend's `_resolve_lakebase_connection_params` takes the SDK
      # workspace-identity path: it calls `/api/2.0/database/instances/
      # mip-app-state` to resolve the real `read_write_dns`, uses the
      # PAT-identity's `user_name` as the Postgres user, and mints a
      # fresh short-lived Postgres password via
      # `/api/2.0/database/credentials`. This mirrors the pattern in
      # jobs/lakebase_migrate.py and what the deployed App does at
      # startup — one auth story for every environment, and no stale
      # LAKEBASE_PASSWORD secret to rotate.
      LAKEBASE_INTEGRATION: '1'
      MIP_MOCK_MODE: 'false'
      E2E_LIVE: '1'
      # real_data.spec.ts uses this to flip the force-degraded flag.
      MIP_FORCE_DEGRADED_TOKEN: ${{ secrets.MIP_FORCE_DEGRADED_TOKEN }}
      # Deliberately leave MIP_APP_URL / MIP_API_URL unset so the spec
      # falls back to localhost on the runner. The playwright config's
      # `webServer` block boots uvicorn+vite on the runner using the
      # same source_code_path the deployed App uses; all four upstream
      # dependencies (warehouse, Lakebase, Genie, UC) are live. This
      # tests the real code paths against real backends without
      # requiring a service-principal M2M OAuth client to traverse the
      # Databricks Apps OAuth proxy in CI. The deployed App (same
      # code) remains reachable by humans via browser OAuth at
      # ${{ secrets.MIP_APP_URL }}.
      # MIP_APP_URL: intentionally unset
      # MIP_API_URL: intentionally unset
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f frontend/package-lock.json ]; then
            npm --prefix frontend ci
          else
            npm --prefix frontend install --no-audit --no-fund
          fi
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run real-UC Playwright spec
        # Config + specs both live under `frontend/` so `@playwright/test`
        # imports resolve against frontend/node_modules. E2E_LIVE-gated
        # so this spec is nightly-only; the PR CI runs a --list parse
        # check.
        working-directory: frontend
        run: |
          npx playwright test \
            tests/e2e/real_data.spec.ts \
            --reporter=list --workers=1
      - name: Upload Playwright report + traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-live
          path: |
            frontend/playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

  notify-on-failure:
    name: File issue on failure
    needs: [parity-live, playwright-e2e-live]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create or update tracking issue
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `nightly: live-UC check failed on ${new Date().toISOString().slice(0, 10)}`;
            const body = [
              `Nightly real-UC workflow failed. Run: ${runUrl}`,
              '',
              '**Likely causes (in order):**',
              '- Databricks workspace credentials rotated (check repo secrets).',
              '- Serverless warehouse or Lakebase instance stopped.',
              '- `fn_*` UDF redeployed without fixture update (see `docs/runbook.md` §3).',
              '- Genie space deleted or its trusted-assets list pruned.',
              '',
              '**Triage:** docs/runbook.md §3 (parity-red) and §8 (CI failure triage).',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['ci-failure', 'nightly'],
            });
