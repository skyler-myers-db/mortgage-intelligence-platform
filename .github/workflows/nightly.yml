        run: |
          set -euo pipefail
          read -r -a variables <<< "$MIP_REPOSITORY_SCOPE_VARS"
          read -r -a secrets <<< "$MIP_REPOSITORY_SCOPE_SECRETS"
          if [ "$(( ${#variables[@]} + ${#secrets[@]} ))" -gt 0 ]; then
            echo "::error::repository- or organization-level profile names (delete each; a client's profile lives in its own environment only): variables: ${variables[*]:-none}; secrets: ${secrets[*]:-none}"
            exit 1
          fi

  check-validate-environment:
    # Before any job names <client>-validate or <client>. GitHub creates an
    # environment the first time a job references a name it does not know,
    # with no protection rules, and a federation policy trusts each name (the
    # validator's and the deployer's): so both must already exist with their
    # review mode's protections (tools/clients/dispatch_protections.read,
    # deploy-dev.yml's reader). Missing or drifted refuses here, before any
    # job reaches a workspace; unreadable (spike S8(a) owed) refuses unless
    # the dispatch carries, per unreadable environment, the exact
    # protections_unverified ack the refusal prints.
    needs: check-dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install the client tooling hash-pinned
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-deploy.hashes.txt
      - name: Refuse an environment that is missing or unprotected
        env:
          MIP_DISPATCH_CLIENT: ${{ inputs.client }}
          MIP_DISPATCH_PROTECTIONS_ACK: ${{ inputs.protections_unverified_ack }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m tools.clients.validation_session check-environment --client "$MIP_DISPATCH_CLIENT"

  parity-live:
    name: SQL<->Python + Lakebase + Genie live
    needs: check-validate-environment
    runs-on: ubuntu-latest
    # The parity suites, the Genie suites and the Genie semantic scorecard.
    timeout-minutes: 120
    # The validator's environment and federation subject. Only a validator
    # job may request the ID token, and only this environment's subject
    # reaches the validator: never the deployer's.
    environment: ${{ inputs.client }}-validate
    permissions:
      contents: read
      id-token: write
    outputs:
      # The per-run digest of <client>-validate's validation profile; the
      # browser job refuses to mint unless <client> holds the same values.
      profile_digest: ${{ steps.session.outputs.profile_digest }}
    env:
      LAKEBASE_INTEGRATION: '1'
    steps:
      - name: Refuse step debug logging
        if: ${{ runner.debug == '1' }}
        run: |
          echo "::error::nightly.yml refuses step debug logging: it prints expression operands, variables included, in clear."
          exit 1
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt --only-binary=:all:
      - name: Collect the validator's validation profile
        # Generated (tools/clients/validation_profile.collect_env("validator")):
        # each public name from vars by value, each name from secrets by value,
        # each identifying name from vars by presence only. No secret.
        env:
          MIP_CLIENT_VAR__MIP_CLIENT: ${{ vars.MIP_CLIENT }}
          MIP_CLIENT_VAR__MIP_APP_NAME: ${{ vars.MIP_APP_NAME }}
          MIP_CLIENT_VAR__MIP_DEFAULT_CATALOG: ${{ vars.MIP_DEFAULT_CATALOG }}
          MIP_CLIENT_SECRET__MIP_CLIENT: ${{ secrets.MIP_CLIENT }}
          MIP_CLIENT_SECRET__MIP_APP_NAME: ${{ secrets.MIP_APP_NAME }}
          MIP_CLIENT_SECRET__MIP_DEFAULT_CATALOG: ${{ secrets.MIP_DEFAULT_CATALOG }}
          MIP_CLIENT_SECRET__DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          MIP_CLIENT_SECRET__MIP_IDENTITY_IDS_JSON: ${{ secrets.MIP_IDENTITY_IDS_JSON }}
          MIP_CLIENT_VARS_MISFILED: >-
            ${{ vars.DATABRICKS_HOST && 'DATABRICKS_HOST' || '' }}
            ${{ vars.MIP_IDENTITY_IDS_JSON && 'MIP_IDENTITY_IDS_JSON' || '' }}
        run: >-
          python -m tools.clients.workflow_contexts collect
          --vars-out "$RUNNER_TEMP/mip-validate-vars.json"
          --secrets-out "$RUNNER_TEMP/mip-validate-secrets.json"
      - name: Prove the GitHub OIDC validator identity and open its session
        # Masks first; then, read-only, the validator (never in admins) and the
        # App's URL, SQL warehouse and Genie space; exports a short-lived token
        # and the profile's per-run digest (the job output profile_digest).
        id: session
        env:
          MIP_VALIDATE_ENVIRONMENT: ${{ inputs.client }}-validate
        run: >-
          python -m tools.clients.validation_session session
          --vars-json "$RUNNER_TEMP/mip-validate-vars.json"
          --secrets-json "$RUNNER_TEMP/mip-validate-secrets.json"
          --environment "$MIP_VALIDATE_ENVIRONMENT"
          --databrickscfg "$HOME/.databrickscfg"
          --github-env "$GITHUB_ENV"
          --github-output "$GITHUB_OUTPUT"
      - name: Fail fast unless the deployed App runs this commit
        run: python -m tools.clients.validation_session app-sha --token-env MIP_BEARER_TOKEN --git-sha "$GITHUB_SHA"
      - name: SQL <-> Python parity
        run: pytest -q tests/integration/test_sql_python_parity.py
      - name: Lakeview widgets resolve (dashboards)
        # Resolves every widget in dashboards/*.lvdash.json against the real
        # warehouse: the SQL executes, every encoded column is in the result
        # schema, and row shape matches the chart type. Release-blocking (no
        # continue-on-error): a broken widget means executives see a blank
        # chart on the next login.
        run: pytest tests/integration/test_dashboard_widgets_resolve.py -q --tb=short
      - name: Executive metrics reconcile to canonical snapshot
        run: pytest tests/integration/test_executive_metric_reconciliation.py -q --tb=short
      - name: Module 0 segment and raw-share parity
        run: pytest tests/integration/test_segment_count_parity.py -q --tb=short
      - name: Module 0 segment intersection parity
        run: pytest tests/integration/test_segment_intersection_parity.py -q --tb=short
      - name: Module 0 segment combination parity
        # The signal stack's exact core-segment rows (wow-stage-5): coverage,
        # per-code and inclusive-set sums against the Lead Queue's
        # segment_mode=all predicate, and the live contactable join.
        run: pytest tests/integration/test_segment_combination_parity.py -q --tb=short
      - name: Module 0 gold data-truth invariants
        run: pytest tests/integration/test_gold_data_truth.py -q --tb=short
      - name: Module 0 geography rollup reconciliation
        run: pytest tests/integration/test_geo_rollup_reconciliation.py -q --tb=short
      - name: Module 0 source readiness completeness
        run: pytest tests/integration/test_source_readiness_live.py -q --tb=short
      - name: Borrower dossier parity
        run: pytest tests/integration/test_borrower_dossier_parity.py -q --tb=short
      - name: Rate lever and rate window parity
        # The two gold tables that re-run fn_rate_spread / fn_in_the_money off
        # the scoring path: the Rate Lever grid (step 0 == scored
        # in_the_money, golden cases through the UC functions, live
        # contactable) and the why-now rate window.
        run: |
          pytest -q --tb=short \
            tests/integration/test_rate_sensitivity_parity.py \
            tests/integration/test_rate_window_weekly_live.py
      - name: Borrower identity and silver normalization invariants
        run: |
          pytest -q --tb=short \
            tests/integration/test_borrower_id_uniqueness.py \
            tests/integration/test_silver_coercion.py \
            tests/integration/test_silver_zip_5_digit.py
      - name: Lakebase post-activation read path
        # Release-blocking and DDL-free, through the App API: the deploy's
        # pre-activation migration owns the schema and grants; this proves
        # the active App's read path and circuit-breaker state.
        run: pytest -q tests/integration/test_lakebase_round_trip.py
      - name: Remint the validator token before the Genie suites
        run: python -m tools.clients.validation_session token --databrickscfg "$HOME/.databrickscfg" --github-env "$GITHUB_ENV"
      - name: Genie live
        if: always()
        run: pytest -q tests/integration/test_genie_live.py
      - name: Genie regression + adversarial
        # Live-gated Genie space queries plus credential-free graders that
        # lint space instructions and adversarial prompt contracts. `if:
        # always()` so a Lakebase outage doesn't stop Genie regression from
        # exercising the hardened space.
        if: always()
        run: pytest -q tests/integration/test_genie_regression.py
      - name: Remint the validator token before the Genie scorecard
        run: python -m tools.clients.validation_session token --databrickscfg "$HOME/.databrickscfg" --github-env "$GITHUB_ENV"
      - name: Genie semantic eval scorecard (deployed app)
        # The validator asks the App (its token is the App bearer) and runs
        # each question's canonical SQL itself: tools/genie_eval.py fails a
        # canonical question unless DATABRICKS_HOST, DATABRICKS_TOKEN and
        # DATABRICKS_WAREHOUSE_ID are set, and renders its catalog from
        # MIP_DEFAULT_CATALOG. The validator session exports all four.
        run: |
          python tools/wait_app_ready.py \
            --base "$MIP_APP_URL" \
            --token "$MIP_BEARER_TOKEN" \
            --timeout-s 600 \
            --interval-s 20 \
            --breakers warehouse,lakebase,genie \
            --genie-probe-question "Summarize the current Module 0 mortgage lead opportunity and cite the trusted assets."
          python tools/genie_eval.py \
            --base "$MIP_APP_URL" \
            --token "$MIP_BEARER_TOKEN" \
            --timeout 120 \
            --attempts 4 \
            --retry-backoff-s 20 \
            --pace-s 2
      - name: Remove the session files
        if: always()
        run: rm -f "$HOME/.databrickscfg" "$RUNNER_TEMP/mip-validate-vars.json" "$RUNNER_TEMP/mip-validate-secrets.json"

  playwright-e2e-live:
    name: Playwright (real-UC golden path)
    needs: parity-live
    runs-on: ubuntu-latest
    # The App API workflow contracts, three browsers, then the serialized
    # real-UC and procurement browser matrices (parity-live's Genie scorecard
    # already waited for the App to warm up).
    timeout-minutes: 90
    environment: ${{ inputs.client }}
    # The client's deploy environment, for the operator M2M secrets the
    # credential sink writes there only. No id-token: this job can exchange a
    # GitHub ID token for no identity, the deployer included, and it binds no
    # deploy-only name. Its only credentials are per-run App bearers minted
    # from the reserved operator identities' M2M secrets, and it calls the App
    # API (the normal operator's bearer reads the App's URL once). The secrets
    # are bound only in the env of the steps that mint, never on disk and
    # never in an npm or Playwright step's env. npm runs here only, never in a
    # job that can request an ID token, with no install script, and only
    # after the first mint, the App API suites and their archive. The remint
    # before the browser suites and the always() reconcile run after npm
    # package code has run, which could tamper with the checkout they execute:
    # a residual risk the lockfile limits and does not remove.
    permissions:
      contents: read
    env:
      LAKEBASE_INTEGRATION: '1'
      E2E_LIVE: '1'
    steps:
      - name: Refuse step debug logging
        if: ${{ runner.debug == '1' }}
        run: |
          echo "::error::nightly.yml refuses step debug logging: it prints expression operands, variables included, in clear."
          exit 1
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt --only-binary=:all:
      - name: Collect the browser job's validation profile
        # Generated (tools/clients/validation_profile.collect_env("validator")):
        # the public and identifying names only. The three operator M2M
        # secrets are bound only in the steps that mint below, never on disk.
        env:
          MIP_CLIENT_VAR__MIP_CLIENT: ${{ vars.MIP_CLIENT }}
          MIP_CLIENT_VAR__MIP_APP_NAME: ${{ vars.MIP_APP_NAME }}
          MIP_CLIENT_VAR__MIP_DEFAULT_CATALOG: ${{ vars.MIP_DEFAULT_CATALOG }}
          MIP_CLIENT_SECRET__MIP_CLIENT: ${{ secrets.MIP_CLIENT }}
          MIP_CLIENT_SECRET__MIP_APP_NAME: ${{ secrets.MIP_APP_NAME }}
          MIP_CLIENT_SECRET__MIP_DEFAULT_CATALOG: ${{ secrets.MIP_DEFAULT_CATALOG }}
          MIP_CLIENT_SECRET__DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          MIP_CLIENT_SECRET__MIP_IDENTITY_IDS_JSON: ${{ secrets.MIP_IDENTITY_IDS_JSON }}
          MIP_CLIENT_VARS_MISFILED: >-
            ${{ vars.DATABRICKS_HOST && 'DATABRICKS_HOST' || '' }}
            ${{ vars.MIP_IDENTITY_IDS_JSON && 'MIP_IDENTITY_IDS_JSON' || '' }}
        run: >-
          python -m tools.clients.workflow_contexts collect
          --vars-out "$RUNNER_TEMP/mip-validate-vars.json"
          --secrets-out "$RUNNER_TEMP/mip-validate-secrets.json"
      - name: Mint per-run App bearers for the reserved operator identities
        # normal (operator A), operator2 (operator B) and admin (the App's
        # admin role, a workspace USER), each in a child holding only its own
        # id and secret (tools/oauth_m2m_mint.py). Each bearer must be its
        # role's identity and never in the workspace admins group, or nothing
        # is exported; refuses an ambient DATABRICKS_TOKEN. Every minting step
        # binds the operator secrets in its own env (generated:
        # tools/clients/validation_profile.collect_env("operators")).
        env:
          MIP_CLIENT_SECRET__DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          MIP_CLIENT_SECRET__DATABRICKS_OPERATOR2_CLIENT_SECRET: ${{ secrets.DATABRICKS_OPERATOR2_CLIENT_SECRET }}
          MIP_CLIENT_SECRET__DATABRICKS_ADMIN_CLIENT_SECRET: ${{ secrets.DATABRICKS_ADMIN_CLIENT_SECRET }}
          MIP_CLIENT_VARS_MISFILED: >-
            ${{ vars.DATABRICKS_CLIENT_SECRET && 'DATABRICKS_CLIENT_SECRET' || '' }}
            ${{ vars.DATABRICKS_OPERATOR2_CLIENT_SECRET && 'DATABRICKS_OPERATOR2_CLIENT_SECRET' || '' }}
            ${{ vars.DATABRICKS_ADMIN_CLIENT_SECRET && 'DATABRICKS_ADMIN_CLIENT_SECRET' || '' }}
          MIP_BROWSER_ENVIRONMENT: ${{ inputs.client }}
          MIP_VALIDATE_PROFILE_DIGEST: ${{ needs.parity-live.outputs.profile_digest }}
        run: >-
          python -m tools.clients.validation_session operators
          --vars-json "$RUNNER_TEMP/mip-validate-vars.json"
          --secrets-json "$RUNNER_TEMP/mip-validate-secrets.json"
          --environment "$MIP_BROWSER_ENVIRONMENT"
          --github-env "$GITHUB_ENV"
      - name: Derive governed live campaign run marker
        run: |
          python - <<'PY'
          import os

          run_id = os.environ.get("GITHUB_RUN_ID", "")
          run_attempt = os.environ.get("GITHUB_RUN_ATTEMPT", "")
          if not run_id.isdigit() or not run_attempt.isdigit():
              raise SystemExit("GitHub run identity is not numeric")
          encode = str.maketrans("0123456789", "abcdefghij")
          marker = f"gha{run_id.translate(encode)}r{run_attempt.translate(encode)}"
          if len(marker) > 40:
              raise SystemExit("encoded GitHub run marker is unexpectedly long")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"MIP_LIVE_CAMPAIGN_RUN_MARKER={marker}\n")
          print("::notice::Derived a non-PII live campaign run marker.")
          PY
      - name: Recover abandoned live campaign fixtures
        # Product rows through the App API only (operator A and the App admin).
        run: |
          python -m tools.cleanup_live_campaign_fixtures \
            --base-url "$MIP_APP_URL" \
            --all-run-markers
      - name: Authenticated non-admin smoke (M2M)
        run: |
          python - <<'PY'
          from __future__ import annotations

          import os
          import json
          import urllib.error
          import urllib.request

          app_url = os.environ["MIP_APP_URL"].rstrip("/")
          tokens = {
              "operator_a": os.environ["MIP_NON_ADMIN_BEARER_TOKEN"],
              "operator_b": os.environ["MIP_OPERATOR2_BEARER_TOKEN"],
          }

          def response(path: str, *, token: str) -> tuple[int, object]:
              req = urllib.request.Request(
                  app_url + path,
                  headers={"Authorization": f"Bearer {token}"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:  # noqa: S310
                      raw = resp.read().decode("utf-8")
                      return int(resp.status), json.loads(raw) if raw else {}
              except urllib.error.HTTPError as exc:
                  return int(exc.code), {}

          def status(path: str, *, token: str) -> int:
              return response(path, token=token)[0]

          checks = {
              "/api/leads?limit=1": 200,
              "/api/audit/events?limit=1": 403,
              "/api/admin/rules": 403,
          }
          failed = []
          for label, token in tokens.items():
              session_status, session = response("/api/session", token=token)
              if session_status != 200 or session != {
                  "can_access_admin": False,
                  "can_approve": True,
              }:
                  failed.append(
                      f"{label} session: expected non-admin approver, "
                      f"got status={session_status}"
                  )
              for path, expected in checks.items():
                  actual = status(path, token=token)
                  print(f"{label}: {path} -> {actual}")
                  if actual != expected:
                      failed.append(f"{label} {path}: expected {expected}, got {actual}")
          admin_status, admin_session = response(
              "/api/session",
              token=os.environ["MIP_ADMIN_BEARER_TOKEN"],
          )
          if admin_status != 200 or admin_session != {
              "can_access_admin": True,
              "can_approve": True,
          }:
              failed.append(
                  "admin session: expected admin approver, "
                  f"got status={admin_status}"
              )
          if failed:
              raise SystemExit("; ".join(failed))
          PY
      - name: Recheck the deployed commit with the browser identity
        run: python -m tools.clients.validation_session app-sha --token-env MIP_NON_ADMIN_BEARER_TOKEN --git-sha "$GITHUB_SHA"
      - name: Read the install class the App reports
        # The App API suites refuse any App whose app_env is not dev or
        # sandbox; a prod App skips them (a listed gap) instead of failing
        # every run, and an unknown app_env refuses.
        id: install-class
        run: python -m tools.clients.validation_session install-class --token-env MIP_ADMIN_BEARER_TOKEN --github-output "$GITHUB_OUTPUT"
      - name: App API workflow contracts
        # Product rows through the App API only: campaigns under the run
        # marker, outreach drafts and approvals (never sent) and their audit
        # rows; the App service principal performs every Lakebase transaction.
        # Deselected: the audit-snapshot reader (beyond the validator's
        # reads) and the lead outcome, disposition and assignment replay,
        # which writes a funded-loan outcome on a real lead that no cleanup
        # undoes. The direct Delta scratch proofs (lifecycle replay, treatment
        # cap) and the system-lineage read are not here: they need more than
        # the App API (docs/deployment.md, "Live validation per client").
        if: steps.install-class.outputs.app_api_mutation == 'run'
        env:
          MIP_LIVE_MUTATION_OK: '1'
        run: |
          python -m tools.cleanup_live_campaign_fixtures \
            --base-url "$MIP_APP_URL" \
            --all-run-markers
          pytest -q --tb=short \
            tests/integration/test_campaign_audit_workflow_live.py \
            tests/integration/test_lakebase_idempotency_live.py \
            tests/integration/test_lakebase_concurrency_live.py \
            tests/integration/test_two_operator_recovery_live.py \
            --deselect tests/integration/test_lakebase_idempotency_live.py::test_live_saved_holdout_and_household_dedup_exclude_non_treatment_borrowers \
            --deselect tests/integration/test_lakebase_idempotency_live.py::test_live_duplicate_outcome_and_disposition_replay_without_breaker_trip
      - name: Always archive run-marked live campaign fixtures
        # Mints its own bearers, so a failed earlier step never strands this
        # run's fixtures; product rows through the App API only.
        if: always()
        env:
          MIP_CLIENT_SECRET__DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          MIP_CLIENT_SECRET__DATABRICKS_OPERATOR2_CLIENT_SECRET: ${{ secrets.DATABRICKS_OPERATOR2_CLIENT_SECRET }}
          MIP_CLIENT_SECRET__DATABRICKS_ADMIN_CLIENT_SECRET: ${{ secrets.DATABRICKS_ADMIN_CLIENT_SECRET }}
          MIP_CLIENT_VARS_MISFILED: >-
            ${{ vars.DATABRICKS_CLIENT_SECRET && 'DATABRICKS_CLIENT_SECRET' || '' }}
            ${{ vars.DATABRICKS_OPERATOR2_CLIENT_SECRET && 'DATABRICKS_OPERATOR2_CLIENT_SECRET' || '' }}
            ${{ vars.DATABRICKS_ADMIN_CLIENT_SECRET && 'DATABRICKS_ADMIN_CLIENT_SECRET' || '' }}
          MIP_BROWSER_ENVIRONMENT: ${{ inputs.client }}
          MIP_VALIDATE_PROFILE_DIGEST: ${{ needs.parity-live.outputs.profile_digest }}
        run: >-
          python -m tools.clients.validation_session operators
          --vars-json "$RUNNER_TEMP/mip-validate-vars.json"
          --secrets-json "$RUNNER_TEMP/mip-validate-secrets.json"
          --environment "$MIP_BROWSER_ENVIRONMENT"
          --
          python -m tools.cleanup_live_campaign_fixtures
          --run-marker "$MIP_LIVE_CAMPAIGN_RUN_MARKER"
      - name: Install the frontend with no install script
        # The first npm step: every earlier mint, App API write and archive ran
        # before any npm package code.
        run: npm --prefix frontend ci --ignore-scripts --no-audit --no-fund
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Remint per-run App bearers before the browser suites
        env:
          MIP_CLIENT_SECRET__DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          MIP_CLIENT_SECRET__DATABRICKS_OPERATOR2_CLIENT_SECRET: ${{ secrets.DATABRICKS_OPERATOR2_CLIENT_SECRET }}
          MIP_CLIENT_SECRET__DATABRICKS_ADMIN_CLIENT_SECRET: ${{ secrets.DATABRICKS_ADMIN_CLIENT_SECRET }}
          MIP_CLIENT_VARS_MISFILED: >-
            ${{ vars.DATABRICKS_CLIENT_SECRET && 'DATABRICKS_CLIENT_SECRET' || '' }}
            ${{ vars.DATABRICKS_OPERATOR2_CLIENT_SECRET && 'DATABRICKS_OPERATOR2_CLIENT_SECRET' || '' }}
            ${{ vars.DATABRICKS_ADMIN_CLIENT_SECRET && 'DATABRICKS_ADMIN_CLIENT_SECRET' || '' }}
          MIP_BROWSER_ENVIRONMENT: ${{ inputs.client }}
          MIP_VALIDATE_PROFILE_DIGEST: ${{ needs.parity-live.outputs.profile_digest }}
        run: >-
          python -m tools.clients.validation_session operators
          --vars-json "$RUNNER_TEMP/mip-validate-vars.json"
          --secrets-json "$RUNNER_TEMP/mip-validate-secrets.json"
          --environment "$MIP_BROWSER_ENVIRONMENT"
          --github-env "$GITHUB_ENV"
      - name: Run real-UC Playwright specs
        # Config + specs both live under `frontend/` so `@playwright/test`
        # imports resolve against frontend/node_modules. E2E_LIVE-gated so
        # this spec is live-validation-only; PR CI runs a --list parse check.
        # MIP_APP_URL is required for this deployed path, so the config's
        # webServer block is disabled and real_data.spec.ts attaches
        # MIP_BEARER_TOKEN as an Authorization header. Deselected on every
        # install (listed gaps): the four tests that write a lead outcome or a
        # call disposition on a real lead, with no run marker and no cleanup.
        working-directory: frontend
        run: |
          npx playwright test \
            --grep-invert "closed-loop outcome labels reject PII|duplicate disposition request ids replay|simultaneous outcome idempotency race|sales outcomes: live manual import writes" \
            tests/e2e/real_data.spec.ts \
            tests/e2e/live_hardening_regressions.spec.ts \
            tests/e2e/layout-stability.spec.ts \
            tests/e2e/economics_scatter.spec.ts \
            tests/e2e/growth_agent_live.spec.ts \
            tests/e2e/movement_closed_loop_regressions.spec.ts \
            tests/e2e/demo_visual.spec.ts \
            tests/e2e/accessibility.spec.ts \
            tests/e2e/responsive.spec.ts \
            tests/e2e/route_performance.spec.ts \
            --reporter=list --workers=1
      - name: Always reconcile live browser campaign fixtures
        if: always()
        env:
          MIP_CLIENT_SECRET__DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          MIP_CLIENT_SECRET__DATABRICKS_OPERATOR2_CLIENT_SECRET: ${{ secrets.DATABRICKS_OPERATOR2_CLIENT_SECRET }}
          MIP_CLIENT_SECRET__DATABRICKS_ADMIN_CLIENT_SECRET: ${{ secrets.DATABRICKS_ADMIN_CLIENT_SECRET }}
          MIP_CLIENT_VARS_MISFILED: >-
            ${{ vars.DATABRICKS_CLIENT_SECRET && 'DATABRICKS_CLIENT_SECRET' || '' }}
            ${{ vars.DATABRICKS_OPERATOR2_CLIENT_SECRET && 'DATABRICKS_OPERATOR2_CLIENT_SECRET' || '' }}
            ${{ vars.DATABRICKS_ADMIN_CLIENT_SECRET && 'DATABRICKS_ADMIN_CLIENT_SECRET' || '' }}
          MIP_BROWSER_ENVIRONMENT: ${{ inputs.client }}
          MIP_VALIDATE_PROFILE_DIGEST: ${{ needs.parity-live.outputs.profile_digest }}
        run: >-
          python -m tools.clients.validation_session operators
          --vars-json "$RUNNER_TEMP/mip-validate-vars.json"
          --secrets-json "$RUNNER_TEMP/mip-validate-secrets.json"
          --environment "$MIP_BROWSER_ENVIRONMENT"
          --
          python -m tools.cleanup_live_campaign_fixtures
          --all-run-markers
      - name: Run mocked Genie proof layout canary
        # This spec route-fulfills Genie responses to stress proof-drawer
        # layout with dense trusted-SQL evidence. Keep it separate from the
        # real-UC live gate so it is never counted as live Genie proof.
        working-directory: frontend
        env:
          GENIE_PROOF_LAYOUT_MOCKED: '1'
        run: |
          npx playwright test \
            tests/e2e/genie_proof_layout.spec.ts \
            --reporter=list --workers=1
      - name: Run mocked economics scatter response-shape canary
        # The selected test route-fulfills only the dense points response to
        # exercise cluster pagination. It is deliberately separated from the
        # real-UC step and must never be cited as live data proof. Unanchored:
        # Playwright greps "<project> <file> <describe> <title>", so a `^`
        # before the test's own title matches no test.
        working-directory: frontend
        env:
          ECONOMICS_SCATTER_MOCKED: '1'
        run: |
          npx playwright test \
            tests/e2e/economics_scatter.spec.ts \
            --grep 'mocked response-shape canary:' \
            --reporter=list --workers=1
      - name: Run procurement accessibility and browser/device matrix
        # Separate from the golden path so the standard live suite stays
        # Chromium-focused, while this gate expands only the procurement
        # specs across Chromium, Firefox, WebKit, phone, and tablet projects.
        working-directory: frontend
        env:
          E2E_BROWSER_MATRIX: '1'
        run: |
          npx playwright test \
            tests/e2e/accessibility_procurement.spec.ts \
            tests/e2e/cross_browser_matrix.spec.ts \
            --reporter=list --workers=1
      - name: Upload Playwright report on failure
        # Artifacts are not masked and the repository is public: live
        # Playwright runs carry bearer-authenticated requests and the client's
        # App surfaces. Off unless an operator enables it for a controlled,
        # redacted run.
        if: failure() && env.E2E_LIVE_FAILURE_ARTIFACTS == '1'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-live
          path: frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove the session files
        if: always()
        run: rm -f "$RUNNER_TEMP/mip-validate-vars.json" "$RUNNER_TEMP/mip-validate-secrets.json"

  kill-drill-simulated:
    name: Credential-kill drill (simulated targets)
    needs: check-validate-environment
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Simulated drills (genie / token / warehouse-sim / lakebase-sim) do NOT
    # touch real infra: they poison env vars in a private subshell, boot a
    # drill backend on :8001 under the validator's session, and assert the
    # visible degraded contract (/api/health flips, data endpoints 503 with
    # retryable=true, no silent mock fallback). A drill failure IS a release
    # blocker. The real-infra drill (stop and restart the warehouse and the
    # Lakebase instance) needs CAN_MANAGE, which no nightly identity holds:
    # an operator runs tools/kill_drill/run_drill.sh --target warehouse-real.
    environment: ${{ inputs.client }}-validate
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Refuse step debug logging
        if: ${{ runner.debug == '1' }}
        run: |
          echo "::error::nightly.yml refuses step debug logging: it prints expression operands, variables included, in clear."
          exit 1
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install deps
        # requirements-dev.txt, not the App's runtime requirements.txt: the
        # validator session (tools/clients) also needs PyYAML.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt --only-binary=:all:
      - name: Install jq + lsof (runner usually has both; belt & braces)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq lsof
      - name: Collect the validator's validation profile
        env:
          MIP_CLIENT_VAR__MIP_CLIENT: ${{ vars.MIP_CLIENT }}
          MIP_CLIENT_VAR__MIP_APP_NAME: ${{ vars.MIP_APP_NAME }}
          MIP_CLIENT_VAR__MIP_DEFAULT_CATALOG: ${{ vars.MIP_DEFAULT_CATALOG }}
          MIP_CLIENT_SECRET__MIP_CLIENT: ${{ secrets.MIP_CLIENT }}
          MIP_CLIENT_SECRET__MIP_APP_NAME: ${{ secrets.MIP_APP_NAME }}
          MIP_CLIENT_SECRET__MIP_DEFAULT_CATALOG: ${{ secrets.MIP_DEFAULT_CATALOG }}
          MIP_CLIENT_SECRET__DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          MIP_CLIENT_SECRET__MIP_IDENTITY_IDS_JSON: ${{ secrets.MIP_IDENTITY_IDS_JSON }}
          MIP_CLIENT_VARS_MISFILED: >-
            ${{ vars.DATABRICKS_HOST && 'DATABRICKS_HOST' || '' }}
            ${{ vars.MIP_IDENTITY_IDS_JSON && 'MIP_IDENTITY_IDS_JSON' || '' }}
        run: >-
          python -m tools.clients.workflow_contexts collect
          --vars-out "$RUNNER_TEMP/mip-validate-vars.json"
          --secrets-out "$RUNNER_TEMP/mip-validate-secrets.json"
      - name: Prove the GitHub OIDC validator identity and open its session
        env:
          MIP_VALIDATE_ENVIRONMENT: ${{ inputs.client }}-validate
        run: >-
          python -m tools.clients.validation_session session
          --vars-json "$RUNNER_TEMP/mip-validate-vars.json"
          --secrets-json "$RUNNER_TEMP/mip-validate-secrets.json"
          --environment "$MIP_VALIDATE_ENVIRONMENT"
          --databrickscfg "$HOME/.databrickscfg"
          --github-env "$GITHUB_ENV"
      - name: Export simulated drill env
        # Every simulated drill receives non-routable Lakebase credentials; it
        # never inherits a long-lived credential merely to boot the local
        # drill backend.
        run: |
          {
            echo "LAKEBASE_HOST=invalid.host.example.com"
            echo "LAKEBASE_USER=mip-simulated-drill"
            echo "LAKEBASE_PASSWORD=drill-invalid-password"
          } >> "$GITHUB_ENV"
      # Each drill boots a private backend on :8001, so they run sequentially
      # (not matrix-parallel). `if: always()` lets later drills run even if an
      # earlier one fails, so one regression doesn't mask others.
      - name: Drill - genie (bogus GENIE_SPACE_ID)
        run: bash tools/kill_drill/run_drill.sh --target genie --await-seconds 90
      - name: Drill - token (PAT cleared + auth_type pinned)
        if: always()
        run: bash tools/kill_drill/run_drill.sh --target token --await-seconds 90
      - name: Drill - warehouse-sim (bogus DATABRICKS_WAREHOUSE_ID)
        if: always()
        run: bash tools/kill_drill/run_drill.sh --target warehouse-sim --await-seconds 90
      - name: Drill - lakebase-sim (unreachable LAKEBASE_HOST)
        if: always()
        run: bash tools/kill_drill/run_drill.sh --target lakebase-sim --await-seconds 90
      - name: Upload evidence logs
        # Off by default: an evidence log records the drill subshell's
        # DATABRICKS_*/GENIE_*/MIP_* names with their values (tokens
        # redacted), artifacts are not masked, and the repository is public.
        # The step log carries the same lines, masked.
        if: always() && env.E2E_LIVE_FAILURE_ARTIFACTS == '1'
        uses: actions/upload-artifact@v7
        with:
          name: kill-drill-evidence
          path: tools/kill_drill/evidence/
          if-no-files-found: warn
          retention-days: 30
      - name: Remove the session files
        if: always()
        run: rm -f "$HOME/.databrickscfg" "$RUNNER_TEMP/mip-validate-vars.json" "$RUNNER_TEMP/mip-validate-secrets.json"

  genie-fuzz-standard:
    name: Genie standard fuzz
    # Standard 15-example/family fuzz is part of the manual live release
    # signal. It runs after the broad live parity + Playwright gates so the
    # shared Genie Space is not rate-limited by concurrent prompt suites. The
    # heavier 200-example/family deep fuzz remains opt-in below.
    needs: playwright-e2e-live
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.client }}-validate
    permissions:
      contents: read
      id-token: write
    env:
      MIP_GENIE_FUZZ_EXAMPLES: '15'
    steps:
      - name: Refuse step debug logging
        if: ${{ runner.debug == '1' }}
        run: |
          echo "::error::nightly.yml refuses step debug logging: it prints expression operands, variables included, in clear."
          exit 1
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt --only-binary=:all:
      - name: Collect the validator's validation profile
        env:
          MIP_CLIENT_VAR__MIP_CLIENT: ${{ vars.MIP_CLIENT }}
          MIP_CLIENT_VAR__MIP_APP_NAME: ${{ vars.MIP_APP_NAME }}
          MIP_CLIENT_VAR__MIP_DEFAULT_CATALOG: ${{ vars.MIP_DEFAULT_CATALOG }}
          MIP_CLIENT_SECRET__MIP_CLIENT: ${{ secrets.MIP_CLIENT }}
          MIP_CLIENT_SECRET__MIP_APP_NAME: ${{ secrets.MIP_APP_NAME }}
          MIP_CLIENT_SECRET__MIP_DEFAULT_CATALOG: ${{ secrets.MIP_DEFAULT_CATALOG }}
          MIP_CLIENT_SECRET__DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          MIP_CLIENT_SECRET__MIP_IDENTITY_IDS_JSON: ${{ secrets.MIP_IDENTITY_IDS_JSON }}
          MIP_CLIENT_VARS_MISFILED: >-
            ${{ vars.DATABRICKS_HOST && 'DATABRICKS_HOST' || '' }}
            ${{ vars.MIP_IDENTITY_IDS_JSON && 'MIP_IDENTITY_IDS_JSON' || '' }}
        run: >-
          python -m tools.clients.workflow_contexts collect
          --vars-out "$RUNNER_TEMP/mip-validate-vars.json"
          --secrets-out "$RUNNER_TEMP/mip-validate-secrets.json"
      - name: Prove the GitHub OIDC validator identity and open its session
        env:
          MIP_VALIDATE_ENVIRONMENT: ${{ inputs.client }}-validate
        run: >-
          python -m tools.clients.validation_session session
          --vars-json "$RUNNER_TEMP/mip-validate-vars.json"
          --secrets-json "$RUNNER_TEMP/mip-validate-secrets.json"
          --environment "$MIP_VALIDATE_ENVIRONMENT"
          --databrickscfg "$HOME/.databrickscfg"
          --github-env "$GITHUB_ENV"
      - name: Run standard Genie fuzz
        run: pytest -q tests/integration/test_genie_fuzz.py -m integration
      - name: Upload fuzz failure artefacts
        # Off by default: a failure record may carry an exception's text, and
        # artifacts are neither masked nor private. The step log is masked.
        if: always() && env.E2E_LIVE_FAILURE_ARTIFACTS == '1'
        uses: actions/upload-artifact@v7
        with:
          name: genie-fuzz-standard-failures
          path: tests/integration/genie_fuzz_failures/
          if-no-files-found: ignore
          retention-days: 30
      - name: Remove the session files
        if: always()
        run: rm -f "$HOME/.databrickscfg" "$RUNNER_TEMP/mip-validate-vars.json" "$RUNNER_TEMP/mip-validate-secrets.json"

  genie-fuzz-deep:
    name: Genie deep fuzz (200 examples/family)
    needs: genie-fuzz-standard
    # Workflow-dispatch only: this burns ~90 min of real Genie quota (3
    # families x 200 examples x ~5s avg response + 4s pacing). Kept off the
    # default live gate so it never runs unexpectedly. A release engineer
    # fires it ahead of a major release, or on an incident re-run. The 45-min
    # timeout fits one family per run plus the coverage assertion; the deep
    # tests share the `_ADVERSARIAL_TEMPLATE_HITS` counter in-process, so a
    # single pytest invocation collects coverage for all three families.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_deep_genie_fuzz == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.client }}-validate
    permissions:
      contents: read
      id-token: write
    env:
      # 200 examples/family is the spec; _resolve_examples clamps to [1, 1000].
      MIP_GENIE_FUZZ_EXAMPLES: '200'
    steps:
      - name: Refuse step debug logging
        if: ${{ runner.debug == '1' }}
        run: |
          echo "::error::nightly.yml refuses step debug logging: it prints expression operands, variables included, in clear."
          exit 1
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt --only-binary=:all:
      - name: Collect the validator's validation profile
        env:
          MIP_CLIENT_VAR__MIP_CLIENT: ${{ vars.MIP_CLIENT }}
          MIP_CLIENT_VAR__MIP_APP_NAME: ${{ vars.MIP_APP_NAME }}
          MIP_CLIENT_VAR__MIP_DEFAULT_CATALOG: ${{ vars.MIP_DEFAULT_CATALOG }}
          MIP_CLIENT_SECRET__MIP_CLIENT: ${{ secrets.MIP_CLIENT }}
          MIP_CLIENT_SECRET__MIP_APP_NAME: ${{ secrets.MIP_APP_NAME }}
          MIP_CLIENT_SECRET__MIP_DEFAULT_CATALOG: ${{ secrets.MIP_DEFAULT_CATALOG }}
          MIP_CLIENT_SECRET__DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          MIP_CLIENT_SECRET__MIP_IDENTITY_IDS_JSON: ${{ secrets.MIP_IDENTITY_IDS_JSON }}
          MIP_CLIENT_VARS_MISFILED: >-
            ${{ vars.DATABRICKS_HOST && 'DATABRICKS_HOST' || '' }}
            ${{ vars.MIP_IDENTITY_IDS_JSON && 'MIP_IDENTITY_IDS_JSON' || '' }}
        run: >-
          python -m tools.clients.workflow_contexts collect
          --vars-out "$RUNNER_TEMP/mip-validate-vars.json"
          --secrets-out "$RUNNER_TEMP/mip-validate-secrets.json"
      - name: Prove the GitHub OIDC validator identity and open its session
        env:
          MIP_VALIDATE_ENVIRONMENT: ${{ inputs.client }}-validate
        run: >-
          python -m tools.clients.validation_session session
          --vars-json "$RUNNER_TEMP/mip-validate-vars.json"
          --secrets-json "$RUNNER_TEMP/mip-validate-secrets.json"
          --environment "$MIP_VALIDATE_ENVIRONMENT"
          --databrickscfg "$HOME/.databrickscfg"
          --github-env "$GITHUB_ENV"
      - name: Run deep Genie fuzz
        # `-m genie_fuzz_deep` selects only the 200-example variants plus the
        # template-coverage assertion. The standard 15-example tests stay in
        # the `integration` mark and are not re-run here.
        run: pytest -m genie_fuzz_deep tests/integration/test_genie_fuzz.py -q
      - name: Upload fuzz failure artefacts
        if: always() && env.E2E_LIVE_FAILURE_ARTIFACTS == '1'
        uses: actions/upload-artifact@v7
        with:
          name: genie-fuzz-failures
          path: tests/integration/genie_fuzz_failures/
          if-no-files-found: ignore
          retention-days: 30
      - name: Remove the session files
        if: always()
        run: rm -f "$HOME/.databrickscfg" "$RUNNER_TEMP/mip-validate-vars.json" "$RUNNER_TEMP/mip-validate-secrets.json"

  notify-on-failure:
    name: File issue on failure
    # A refused dispatch (check-dispatch, check-validate-environment) is not a
    # live failure and files no issue; a failed live job does.
    needs: [parity-live, playwright-e2e-live, kill-drill-simulated, genie-fuzz-standard]
    if: >-
      ${{
        always() && (
          needs.parity-live.result == 'failure' ||
          needs.playwright-e2e-live.result == 'failure' ||
          needs.kill-drill-simulated.result == 'failure' ||
          needs.genie-fuzz-standard.result == 'failure'
        )
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Create or update tracking issue
        uses: actions/github-script@v9
        env:
          MIP_DISPATCH_CLIENT: ${{ inputs.client }}
        with:
          script: |
            const client = process.env.MIP_DISPATCH_CLIENT;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `live validation (${client}): live-UC check failed on ${new Date().toISOString().slice(0, 10)}`;
            const body = [
              `Manual live-UC workflow failed for client ${client}. Run: ${runUrl}`,
              '',
              '**Likely causes (in order):**',
              `- The ${client}-validate environment's validation profile or the validator's federation policy changed.`,
              `- A reserved operator M2M secret in the ${client} environment was rotated or revoked.`,
              '- Serverless warehouse or Lakebase instance stopped.',
              '- A parity step failed, which means real SQL/Python or raw-share/gold predicate drift or a stale gold snapshot.',
              '- Genie space deleted or its trusted-assets list pruned.',
              '',
              '**Triage:** docs/runbook.md §3 (parity-red) and §8 (CI failure triage).',
            ].join('\n');

            const labels = ['ci-failure', 'live-validation'];
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: labels.join(','),
              per_page: 100,
            });

            const match = existing.find((issue) => issue.title === title && !issue.pull_request);
            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                body: `Another manual live-UC workflow failed. Run: ${runUrl}`,
              });
              core.notice(`Updated existing live-validation failure issue #${match.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels,
              });
              core.notice(`Created live-validation failure issue #${created.data.number}`);
            }
