name: nightly (live UC)

# Nightly workflow -- runs the real-UC integration + Playwright suites
# against the dev Databricks workspace at ~05:00 CT (10:00 UTC). This is
# the canary that catches:
#   - SQL<->Python parity drift (tests/integration/test_sql_python_parity.py)
#   - Genie space regression (tests/integration/test_genie_live.py)
#   - Lakebase schema/auth drift (tests/integration/test_lakebase_round_trip.py)
#   - End-to-end live product path (tests/e2e/real_data.spec.ts)
#
# All jobs require repo secrets (see .github/workflows/README.md). A
# manual `workflow_dispatch` trigger is wired so an engineer can re-run
# after a workspace outage without waiting for the next cron fire.
#
# On failure: a GitHub issue is created with the failing job name + a
# link to the run. Slack/PagerDuty integration is deliberately deferred
# until the user picks a notification channel.

on:
  schedule:
    # 10:00 UTC = 05:00 CT (CDT) / 04:00 CT (CST). Early-morning run
    # catches regressions before the workday starts.
    - cron: '0 10 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '22'

permissions:
  contents: read
  issues: write   # required for the auto-filed failure issue

jobs:
  parity-live:
    name: SQL<->Python + Lakebase + Genie live
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_WAREHOUSE_ID: ${{ secrets.DATABRICKS_WAREHOUSE_ID }}
      GENIE_SPACE_ID: ${{ secrets.GENIE_SPACE_ID }}
      LAKEBASE_HOST: ${{ secrets.LAKEBASE_HOST }}
      LAKEBASE_USER: ${{ secrets.LAKEBASE_USER }}
      LAKEBASE_PASSWORD: ${{ secrets.LAKEBASE_PASSWORD }}
      LAKEBASE_DATABASE_NAME: ${{ secrets.LAKEBASE_DATABASE_NAME }}
      LAKEBASE_INTEGRATION: '1'   # opt-in flag Slice 5 requires
      # Live-UC tests MUST NOT run against mock repos.
      MIP_MOCK_MODE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Fail fast if required secrets are missing
        # Catches the "secrets were rotated and nobody updated the repo"
        # class of failure explicitly instead of letting pytest emit a
        # SKIP that a human has to decode.
        run: |
          missing=""
          for v in DATABRICKS_HOST DATABRICKS_TOKEN DATABRICKS_WAREHOUSE_ID \
                   GENIE_SPACE_ID LAKEBASE_HOST LAKEBASE_USER LAKEBASE_PASSWORD; do
            if [ -z "${!v}" ]; then
              missing="$missing $v"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets:$missing"
            exit 1
          fi
      - name: Install Databricks CLI (v2)
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
          databricks --version
      - name: databricks bundle validate (dev target, real creds)
        # The real validate moved here from PR CI because it unavoidably
        # calls /api/2.0/preview/scim/v2/Me which requires a real token.
        # Newer CLI (v0.297+) always resolves a profile from
        # ~/.databrickscfg -- env-var-only auth returns the misleading
        # error "no DEFAULT profile configured." Seed a real DEFAULT
        # profile from the secrets block; the secrets values double-pipe
        # into both the env vars the Python SDK reads and the
        # .databrickscfg file the CLI reads.
        env:
          DATABRICKS_AUTH_TYPE: pat
          BUNDLE_VAR_sql_warehouse_id: ${{ secrets.DATABRICKS_WAREHOUSE_ID }}
          BUNDLE_VAR_genie_space_id: ${{ secrets.GENIE_SPACE_ID }}
          BUNDLE_VAR_lakebase_instance: mip-app-state
        run: |
          {
            echo "[DEFAULT]"
            echo "host  = ${DATABRICKS_HOST}"
            echo "token = ${DATABRICKS_TOKEN}"
          } > "$HOME/.databrickscfg"
          chmod 600 "$HOME/.databrickscfg"
          databricks bundle validate -t dev
      - name: SQL <-> Python parity
        run: pytest -q tests/integration/test_sql_python_parity.py
      - name: Lakeview widgets resolve (dashboards)
        # Resolves every widget in dashboards/*.lvdash.json against the
        # real warehouse: the SQL executes, every encoded column is in
        # the result schema, and row shape matches the chart type. This
        # is the strongest proxy for "open the dashboard in Lakeview UI
        # and eyeball it" that is possible from CI. Release-blocking
        # (no continue-on-error): a broken widget means executives see a
        # blank chart on the next login.
        run: pytest tests/integration/test_dashboard_widgets_resolve.py -q --tb=short
      - name: Lakebase round-trip
        # continue-on-error so a stale LAKEBASE_PASSWORD secret doesn't
        # block the downstream Genie regression + Playwright runs.
        # Failure is still surfaced by the auto-filed GitHub issue; the
        # job-level conclusion is "failure" when this step fails, which
        # is the right behavior for the tracking issue.
        continue-on-error: true
        run: pytest -q tests/integration/test_lakebase_round_trip.py
      - name: Genie live
        if: always()
        run: pytest -q tests/integration/test_genie_live.py
      - name: Genie regression + adversarial
        # 29 checks total: 22 live-gated Genie space queries (wired to the
        # same secrets as the step above) + 7 credential-free graders that
        # lint space instructions and adversarial prompt contracts. Runs
        # after `Genie live` so a broken space surfaces there first.
        # `if: always()` so a Lakebase outage doesn't stop Genie regression
        # from exercising the hardened space.
        if: always()
        run: pytest -q tests/integration/test_genie_regression.py

  playwright-e2e-live:
    name: Playwright (real-UC golden path)
    needs: parity-live
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_WAREHOUSE_ID: ${{ secrets.DATABRICKS_WAREHOUSE_ID }}
      GENIE_SPACE_ID: ${{ secrets.GENIE_SPACE_ID }}
      # Deliberately omit LAKEBASE_HOST / _USER / _PASSWORD here so the
      # backend's `_resolve_lakebase_connection_params` takes the SDK
      # workspace-identity path: it calls `/api/2.0/database/instances/
      # mip-app-state` to resolve the real `read_write_dns`, uses the
      # PAT-identity's `user_name` as the Postgres user, and mints a
      # fresh short-lived Postgres password via
      # `/api/2.0/database/credentials`. This mirrors the pattern in
      # jobs/lakebase_migrate.py and what the deployed App does at
      # startup — one auth story for every environment, and no stale
      # LAKEBASE_PASSWORD secret to rotate.
      LAKEBASE_INTEGRATION: '1'
      MIP_MOCK_MODE: 'false'
      E2E_LIVE: '1'
      # real_data.spec.ts uses this to flip the force-degraded flag.
      MIP_FORCE_DEGRADED_TOKEN: ${{ secrets.MIP_FORCE_DEGRADED_TOKEN }}
      # MIP_APP_URL / MIP_BEARER_TOKEN are populated at step-time by the
      # "Detect deployed-URL path" + "Mint workspace Bearer" steps below
      # when (and only when) all three deployed-path secrets are set. In
      # the meantime the localhost-on-runner path (playwright.config.ts
      # webServer block) remains the fallback so the nightly stays green
      # for devs without M2M admin creds.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f frontend/package-lock.json ]; then
            npm --prefix frontend ci
          else
            npm --prefix frontend install --no-audit --no-fund
          fi
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Detect deployed-URL path
        # Two paths exist for this job:
        #   deployed  -> mint an M2M Bearer, hit the real Databricks App
        #                through its OAuth proxy
        #   localhost -> boot uvicorn+vite on the runner (Playwright
        #                config's webServer block), same source code
        # We take the deployed path ONLY when all three secrets are set.
        # GitHub Actions doesn't allow `secrets.*` in `if:` expressions,
        # so we reduce the presence check to a single step output here.
        id: pathsel
        env:
          _CID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          _CSEC: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          _URL: ${{ secrets.MIP_APP_URL }}
        run: |
          if [ -n "$_CID" ] && [ -n "$_CSEC" ] && [ -n "$_URL" ]; then
            echo "use_deployed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Nightly Playwright will target deployed app via M2M OAuth."
          else
            echo "use_deployed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Nightly Playwright will fall back to localhost-on-runner (deployed-path secrets not all set)."
          fi
      - name: Mint workspace Bearer (M2M OAuth)
        # Runs ONLY when the deployed path is selected. A mint failure
        # here is a HARD failure for the job — see
        # docs/security/m2m-oauth-setup.md § "Credential-kill drill".
        # We deliberately do NOT fall through to localhost on mint
        # failure, because that would silently mask the very class of
        # regression this path is here to catch.
        if: steps.pathsel.outputs.use_deployed == 'true'
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: |
          # Token is short-lived (~1h) but a full Playwright run is
          # 5-10 min, so a single mint per job is enough. Redirect the
          # helper's stdout (the token itself) into a variable; stderr
          # lines go to the Actions log for operator triage.
          set -euo pipefail
          BEARER=$(python tools/oauth_m2m_mint.py)
          if [ -z "$BEARER" ]; then
            echo "::error::oauth_m2m_mint.py exited 0 but stdout was empty"
            exit 1
          fi
          # GitHub auto-masks the value because it's being written to
          # $GITHUB_ENV through a step input sourced from a secret-backed
          # env var. Belt-and-braces: explicitly add-mask it too.
          echo "::add-mask::$BEARER"
          echo "MIP_BEARER_TOKEN=$BEARER" >> "$GITHUB_ENV"
      - name: Wire MIP_APP_URL / MIP_API_URL for deployed path
        if: steps.pathsel.outputs.use_deployed == 'true'
        env:
          _URL: ${{ secrets.MIP_APP_URL }}
        run: |
          echo "MIP_APP_URL=$_URL" >> "$GITHUB_ENV"
          echo "MIP_API_URL=$_URL" >> "$GITHUB_ENV"
      - name: Run real-UC Playwright spec
        # Config + specs both live under `frontend/` so `@playwright/test`
        # imports resolve against frontend/node_modules. E2E_LIVE-gated
        # so this spec is nightly-only; the PR CI runs a --list parse
        # check. When MIP_APP_URL is set (deployed path), the config's
        # webServer block is disabled and real_data.spec.ts attaches the
        # MIP_BEARER_TOKEN as an Authorization header. When unset
        # (localhost fallback), the webServer boots uvicorn+vite on the
        # runner and the spec hits 127.0.0.1:5173.
        working-directory: frontend
        run: |
          npx playwright test \
            tests/e2e/real_data.spec.ts \
            --reporter=list --workers=1
      - name: Upload Playwright report + traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-live
          path: |
            frontend/playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

  kill-drill-simulated:
    name: Credential-kill drill (simulated targets)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Simulated drills (genie / token / warehouse-sim / lakebase-sim)
    # do NOT touch real infra: they manipulate env vars in a private
    # subshell, boot a drill backend on :8001, and assert the visible
    # degraded contract (/api/health flips, data endpoints 503 with
    # retryable=true, no silent mock fallback). A drill failure IS a
    # release blocker -- continue-on-error stays default (false).
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_WAREHOUSE_ID: ${{ secrets.DATABRICKS_WAREHOUSE_ID }}
      GENIE_SPACE_ID: ${{ secrets.GENIE_SPACE_ID }}
      LAKEBASE_HOST: ${{ secrets.LAKEBASE_HOST }}
      LAKEBASE_USER: ${{ secrets.LAKEBASE_USER }}
      LAKEBASE_PASSWORD: ${{ secrets.LAKEBASE_PASSWORD }}
      LAKEBASE_DATABASE_NAME: ${{ secrets.LAKEBASE_DATABASE_NAME }}
      MIP_MOCK_MODE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install jq + lsof (runner usually has both; belt & braces)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq lsof
      # Each drill boots a private backend on :8001, so they must run
      # sequentially (not matrix-parallel) to avoid port contention.
      # `if: always()` lets later drills run even if an earlier one
      # fails, so one regression doesn't mask others in the same PR.
      - name: Drill - genie (bogus GENIE_SPACE_ID)
        run: bash tools/kill_drill/run_drill.sh --target genie --await-seconds 90
      - name: Drill - token (PAT cleared + auth_type pinned)
        if: always()
        run: bash tools/kill_drill/run_drill.sh --target token --await-seconds 90
      - name: Drill - warehouse-sim (bogus DATABRICKS_WAREHOUSE_ID)
        if: always()
        run: bash tools/kill_drill/run_drill.sh --target warehouse-sim --await-seconds 90
      - name: Drill - lakebase-sim (unreachable LAKEBASE_HOST)
        if: always()
        run: bash tools/kill_drill/run_drill.sh --target lakebase-sim --await-seconds 90
      - name: Upload evidence logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kill-drill-evidence
          path: tools/kill_drill/evidence/
          if-no-files-found: warn
          retention-days: 30

  notify-on-failure:
    name: File issue on failure
    needs: [parity-live, playwright-e2e-live, kill-drill-simulated]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create or update tracking issue
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `nightly: live-UC check failed on ${new Date().toISOString().slice(0, 10)}`;
            const body = [
              `Nightly real-UC workflow failed. Run: ${runUrl}`,
              '',
              '**Likely causes (in order):**',
              '- Databricks workspace credentials rotated (check repo secrets).',
              '- Serverless warehouse or Lakebase instance stopped.',
              '- `fn_*` UDF redeployed without fixture update (see `docs/runbook.md` §3).',
              '- Genie space deleted or its trusted-assets list pruned.',
              '',
              '**Triage:** docs/runbook.md §3 (parity-red) and §8 (CI failure triage).',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['ci-failure', 'nightly'],
            });
