            ${{ secrets.MIP_ACCEPTED_EXPOSURE_JSON && 'MIP_ACCEPTED_EXPOSURE_JSON' || '' }}
            ${{ secrets.MIP_ADMIN_EMAILS && 'MIP_ADMIN_EMAILS' || '' }}
            ${{ secrets.MIP_ADMIN_GROUP_NAME && 'MIP_ADMIN_GROUP_NAME' || '' }}
            ${{ secrets.MIP_ADMIN_IDENTITIES && 'MIP_ADMIN_IDENTITIES' || '' }}
            ${{ secrets.MIP_AGENTIC_TIER && 'MIP_AGENTIC_TIER' || '' }}
            ${{ secrets.MIP_AGENT_PROXY_CLIENT_ID && 'MIP_AGENT_PROXY_CLIENT_ID' || '' }}
            ${{ secrets.MIP_AGENT_PROXY_SECRET_SCOPE && 'MIP_AGENT_PROXY_SECRET_SCOPE' || '' }}
            ${{ secrets.MIP_AGENT_RUNTIME_CLIENT_ID && 'MIP_AGENT_RUNTIME_CLIENT_ID' || '' }}
            ${{ secrets.MIP_AGENT_SUPERVISOR_NAME && 'MIP_AGENT_SUPERVISOR_NAME' || '' }}
            ${{ secrets.MIP_AI_GATEWAY_AGENT_EXPERIMENT_BASE && 'MIP_AI_GATEWAY_AGENT_EXPERIMENT_BASE' || '' }}
            ${{ secrets.MIP_AI_GATEWAY_PROOF_SIGNING_KEY && 'MIP_AI_GATEWAY_PROOF_SIGNING_KEY' || '' }}
            ${{ secrets.MIP_AI_GATEWAY_TABLE_PREFIX && 'MIP_AI_GATEWAY_TABLE_PREFIX' || '' }}
            ${{ secrets.MIP_AI_GATEWAY_VERIFIER_CLIENT_ID && 'MIP_AI_GATEWAY_VERIFIER_CLIENT_ID' || '' }}
            ${{ secrets.MIP_APPROVER_EMAILS && 'MIP_APPROVER_EMAILS' || '' }}
            ${{ secrets.MIP_APPROVER_GROUP_NAME && 'MIP_APPROVER_GROUP_NAME' || '' }}
            ${{ secrets.MIP_APPROVER_IDENTITIES && 'MIP_APPROVER_IDENTITIES' || '' }}
