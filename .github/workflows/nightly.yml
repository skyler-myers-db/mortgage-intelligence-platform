name: live validation (on demand)
run-name: nightly client=${{ inputs.client }} sha=${{ github.sha }}

# One client per dispatch (M1-PR8). Dispatch only, never scheduled: the Genie
# probes, the browser matrix and the App API writes are release and signoff
# gates, not a daily meter burn.
#
# Identity. No job authenticates as the deployer and no job holds a
# workspace PAT. The validator jobs, the only ones with `id-token: write`,
# run in the client's `<client>-validate` GitHub Environment and authenticate
# through GitHub OIDC as the client's `<prefix>-validator` service principal
# (no secret; its own federation subject `environment:<client>-validate`),
# which must not be in `admins` (python -m tools.clients.validation_session
# session proves it before any test runs). The browser job runs in
# `<client>`, where the credential sink writes the reserved operator
# identities' M2M secrets (a `-validate` environment never holds one), and
# requests no ID token, so the deployer's federation subject
# `environment:<client>` is unreachable: it exchanges those secrets for
# per-run App bearers, none in `admins`, and calls the App API.
#
# Authority. Every identity nightly uses is proven, before any test, not to
# be in the workspace `admins` group (tools/clients/validation_session.py);
# metastore admin, account admin and MODIFY or MANAGE grants are kept out by
# the owner's grants (docs/deployment.md, "Live validation per client", owner
# action 3), not checked here. nightly writes product rows only through the
# App API, and the validator, read-only, opens Genie conversations directly
# (the Genie suites). Through the App API it writes campaigns under a per-run
# marker, archived again at the end; outreach drafts and approvals of real
# leads, with their audit rows, which stay (an approval is a decision
# record: nothing is ever sent); Genie turns; and the other App actions the
# browser specs take (Genie feedback, Growth Agent runs and a watchlist with
# its notification drafts, never sent), with their audit rows, which stay.
# The App API mutation suites run only on an App whose app_env is dev or
# sandbox (install-class); a prod App skips them, and the gate's verdict says
# so. Lead outcomes, call dispositions, snoozes and loan-officer assignments
# are never written: on every install the suite test and the browser tests
# that write them are deselected (listed gaps), and
# tests/unit/test_nightly_workflow_writes.py scans every test nightly runs for
# those writes. What needs more runs in scripts/deploy.sh at
# deploy time, with an operator, or is a listed gap (docs/deployment.md, "Live
# validation per client"): the silver, gold and FRED refreshes (data phase);
# the verifier boundary and the Growth Agent evaluation (release phase,
# agentic tier); the delayed AI Gateway inference-table grant retry and the
# rolling exact-proof refresh (gaps); the real-infra kill drill (operator-run,
# tools/kill_drill/run_drill.sh).
#
# It catches:
#   - SQL<->Python parity drift (tests/integration/test_sql_python_parity.py)
#   - Genie space regression (tests/integration/test_genie_live.py)
#   - Lakebase read-path drift through the App (tests/integration/test_lakebase_round_trip.py)
#   - End-to-end live product path (tests/e2e/real_data.spec.ts)
#
# Release gate: tools/live_validation_gate.py --client <key> accepts a release
# only when a green run of this workflow on main, whose run-name names that
# client and the run's own commit, certifies runtime-equivalent code, is at
# most 14 days old, and its parity, Playwright and simulated-drill jobs all
# succeeded; the two app-sha --git-sha checks below are what make a green run
# certify its own commit.
#
# Every job that names an environment waits for its required reviewer (the
# review mode's), and the variables and secrets it reads are named one by one
# (tools/clients/validation_profile.py): no step holds a whole context.
# On failure: a GitHub issue is created with the client, the failing job and a
# link to the run.

on:
  workflow_dispatch:
    inputs:
      client:
        description: "The client key: the validator jobs run in <client>-validate, the browser job in <client> with no ID token"
        type: string
        required: true
      protections_unverified_ack:
        description: "Only if GITHUB_TOKEN cannot read <client>-validate's protection rules: the exact protections_unverified ack the check printed"
        type: string
        default: ""
      run_deep_genie_fuzz:
        description: "Run the 200-example/family deep Genie fuzz suite"
        type: boolean
        default: false

concurrency:
  # The client's deployment lane: deploy-dev.yml's deploy job holds the same
  # group, so nightly never validates while that client's deploy runs.
  group: mip-client-${{ inputs.client }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '22'

permissions:
  contents: read

jobs:
  check-dispatch:
    # deploy-dev.yml's check-dispatch refusals, held equal by
    # tests/unit/test_nightly_workflow_contract.py: no step debug logging, a
    # well-formed client key that names a client, and no profile name at
    # repository or organization level (GitHub merges those into every
    # environment's contexts, so one would fill a field the validate
    # environment omits). No environment, no checkout, no ID token.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refuse step debug logging
        if: ${{ runner.debug == '1' }}
        run: |
          echo "::error::nightly.yml refuses step debug logging: it prints expression operands, variables included, in clear."
          exit 1
      - name: Refuse a malformed client key
        env:
          MIP_DISPATCH_CLIENT: ${{ inputs.client }}
        run: |
          set -euo pipefail
          if [[ ! "$MIP_DISPATCH_CLIENT" =~ ^[a-z][a-z0-9-]{1,30}$ ]]; then
            echo "::error::client must be a client key: 2-31 lowercase letters, digits or '-', from a letter."
            exit 1
          fi
          case "$MIP_DISPATCH_CLIENT" in
            copilot|dev|github-pages) echo "::error::client must name a client's environment; ${MIP_DISPATCH_CLIENT} is not one."; exit 1 ;;
          esac
      - name: Refuse a profile name set at repository or organization level
        env:
          MIP_REPOSITORY_SCOPE_VARS: >-
            ${{ vars.APP_ENV && 'APP_ENV' || '' }}
            ${{ vars.DATABRICKS_ACCOUNT_CLIENT_ID && 'DATABRICKS_ACCOUNT_CLIENT_ID' || '' }}
            ${{ vars.DATABRICKS_ACCOUNT_CLIENT_SECRET && 'DATABRICKS_ACCOUNT_CLIENT_SECRET' || '' }}
            ${{ vars.DATABRICKS_ACCOUNT_HOST && 'DATABRICKS_ACCOUNT_HOST' || '' }}
            ${{ vars.DATABRICKS_ACCOUNT_ID && 'DATABRICKS_ACCOUNT_ID' || '' }}
            ${{ vars.DATABRICKS_ADMIN_CLIENT_ID && 'DATABRICKS_ADMIN_CLIENT_ID' || '' }}
            ${{ vars.DATABRICKS_ADMIN_CLIENT_SECRET && 'DATABRICKS_ADMIN_CLIENT_SECRET' || '' }}
            ${{ vars.DATABRICKS_AGENT_PROXY_CLIENT_ID && 'DATABRICKS_AGENT_PROXY_CLIENT_ID' || '' }}
            ${{ vars.DATABRICKS_AGENT_PROXY_CREDENTIAL_BUNDLE && 'DATABRICKS_AGENT_PROXY_CREDENTIAL_BUNDLE' || '' }}
            ${{ vars.DATABRICKS_AGENT_RUNTIME_CLIENT_ID && 'DATABRICKS_AGENT_RUNTIME_CLIENT_ID' || '' }}
            ${{ vars.DATABRICKS_AGENT_RUNTIME_CLIENT_SECRET && 'DATABRICKS_AGENT_RUNTIME_CLIENT_SECRET' || '' }}
            ${{ vars.DATABRICKS_CLIENT_ID && 'DATABRICKS_CLIENT_ID' || '' }}
            ${{ vars.DATABRICKS_CLIENT_SECRET && 'DATABRICKS_CLIENT_SECRET' || '' }}
            ${{ vars.DATABRICKS_HOST && 'DATABRICKS_HOST' || '' }}
            ${{ vars.DATABRICKS_OPERATOR2_CLIENT_ID && 'DATABRICKS_OPERATOR2_CLIENT_ID' || '' }}
            ${{ vars.DATABRICKS_OPERATOR2_CLIENT_SECRET && 'DATABRICKS_OPERATOR2_CLIENT_SECRET' || '' }}
            ${{ vars.DATABRICKS_RELEASE_PROBE_CLIENT_ID && 'DATABRICKS_RELEASE_PROBE_CLIENT_ID' || '' }}
            ${{ vars.DATABRICKS_RELEASE_PROBE_CLIENT_SECRET && 'DATABRICKS_RELEASE_PROBE_CLIENT_SECRET' || '' }}
            ${{ vars.DATABRICKS_VERIFIER_CLIENT_ID && 'DATABRICKS_VERIFIER_CLIENT_ID' || '' }}
            ${{ vars.DATABRICKS_VERIFIER_CLIENT_SECRET && 'DATABRICKS_VERIFIER_CLIENT_SECRET' || '' }}
            ${{ vars.LAKEBASE_DATABASE && 'LAKEBASE_DATABASE' || '' }}
            ${{ vars.LAKEBASE_INSTANCE_NAME && 'LAKEBASE_INSTANCE_NAME' || '' }}
            ${{ vars.MIP_ACCEPTED_EXPOSURE_JSON && 'MIP_ACCEPTED_EXPOSURE_JSON' || '' }}
            ${{ vars.MIP_ADMIN_EMAILS && 'MIP_ADMIN_EMAILS' || '' }}
