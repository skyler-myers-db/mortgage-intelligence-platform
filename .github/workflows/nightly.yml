name: live validation (on demand)

# On-demand live workflow -- refreshes the governed dev UC snapshot, then runs
# the real-UC integration + Playwright suites against the dev Databricks
# workspace. This is intentionally NOT scheduled: the Databricks refresh jobs,
# Genie probes, browser matrix, and Lakebase checks are release/signoff gates,
# not a daily meter burn for a product developed intermittently.
#
# It catches:
#   - SQL<->Python parity drift (tests/integration/test_sql_python_parity.py)
#   - Genie space regression (tests/integration/test_genie_live.py)
#   - Lakebase schema/auth drift (tests/integration/test_lakebase_round_trip.py)
#   - End-to-end live product path (tests/e2e/real_data.spec.ts)
#
# All jobs require repo secrets (see .github/workflows/README.md). A
# Run it manually before a customer-facing release, after deploying Databricks
# bundle/app changes, or when investigating a live workspace issue. Cheap
# credential-free CI remains in ci.yml on every PR/push.
#
# On failure: a GitHub issue is created with the failing job name + a
# link to the run. Slack/PagerDuty integration is deliberately deferred
# until the user picks a notification channel.

on:
  workflow_dispatch:
    inputs:
      run_real_drills:
        description: "Run the real-infra kill drills (stops + restarts warehouse/Lakebase)"
        type: boolean
        default: false
      run_deep_genie_fuzz:
        description: "Run the 200-example/family deep Genie fuzz suite"
        type: boolean
        default: false
      skip_admin_degraded_proof:
        description: "Explicitly skip the bounded admin degraded-banner proof and record it as a release caveat"
        type: boolean
        default: false

concurrency:
  group: live-validation-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '22'

permissions:
  contents: read
  issues: write   # required for the auto-filed failure issue

jobs:
  parity-live:
    name: SQL<->Python + Lakebase + Genie live
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      LAKEBASE_DATABASE: ${{ secrets.LAKEBASE_DATABASE || 'mip_app_state' }}
      LAKEBASE_INSTANCE_NAME: mip-app-state
      LAKEBASE_INTEGRATION: '1'   # opt-in flag Slice 5 requires
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: databricks/setup-cli@v1.0.0
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npm --prefix frontend ci
      - name: Verify Databricks CLI
        run: databricks --version
      - name: Prepare bundle sync inputs
        run: |
          MIP_ENABLE_DEMO_FIRST_PARTY_FEEDS=1 \
            python tools/render_sql.py --catalog "${MIP_DEFAULT_CATALOG:-mip}"
          npm --prefix frontend run build
      - name: Export live Databricks test env
        # Catches the "secrets were rotated and nobody updated the repo"
        # class of failure explicitly instead of letting pytest emit a
        # SKIP that a human has to decode. Lakebase intentionally uses the
        # Databricks database credential endpoint below instead of static
        # LAKEBASE_PASSWORD secrets, matching the deployed app/migrate path.
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_WAREHOUSE_ID: ${{ secrets.DATABRICKS_WAREHOUSE_ID }}
          GENIE_SPACE_ID: ${{ secrets.GENIE_SPACE_ID }}
        run: |
          missing=""
          for v in DATABRICKS_HOST DATABRICKS_TOKEN DATABRICKS_WAREHOUSE_ID \
                   GENIE_SPACE_ID; do
            if [ -z "${!v}" ]; then
              missing="$missing $v"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets:$missing"
            exit 1
          fi
          {
            echo "DATABRICKS_HOST=$DATABRICKS_HOST"
            echo "DATABRICKS_TOKEN=$DATABRICKS_TOKEN"
            echo "DATABRICKS_WAREHOUSE_ID=$DATABRICKS_WAREHOUSE_ID"
            echo "GENIE_SPACE_ID=$GENIE_SPACE_ID"
          } >> "$GITHUB_ENV"
      - name: databricks bundle validate (dev target, real creds)
        # The real validate moved here from PR CI because it unavoidably
        # calls /api/2.0/preview/scim/v2/Me which requires a real token.
        # Newer CLI (v0.297+) always resolves a profile from
        # ~/.databrickscfg -- env-var-only auth returns the misleading
        # error "no DEFAULT profile configured." Seed a real DEFAULT
        # profile from the secrets block; the secrets values double-pipe
        # into both the env vars the Python SDK reads and the
        # .databrickscfg file the CLI reads.
        env:
          DATABRICKS_AUTH_TYPE: pat
          BUNDLE_VAR_sql_warehouse_id: ${{ secrets.DATABRICKS_WAREHOUSE_ID }}
          BUNDLE_VAR_genie_space_id: ${{ secrets.GENIE_SPACE_ID }}
        run: |
          {
            echo "[DEFAULT]"
            echo "host  = ${DATABRICKS_HOST}"
            echo "token = ${DATABRICKS_TOKEN}"
            echo "auth_type = pat"
          } > "$HOME/.databrickscfg"
          chmod 600 "$HOME/.databrickscfg"
          databricks bundle validate -t dev --profile DEFAULT
      - name: Refresh live FRED market rates before validation
        # The parity gate compares gold borrower scoring against the latest
        # reviewed FRED MORTGAGE30US row. FRED publishes independently of repo
        # deploys, so this release gate refreshes rates before validating.
        env:
          DATABRICKS_AUTH_TYPE: pat
          BUNDLE_VAR_sql_warehouse_id: ${{ secrets.DATABRICKS_WAREHOUSE_ID }}
          BUNDLE_VAR_genie_space_id: ${{ secrets.GENIE_SPACE_ID }}
        run: databricks bundle run mip_fred_rates_ingest -t dev --profile DEFAULT
      - name: Refresh live Cotality silver features before validation
        # The raw-share parity reference reads Cotality directly, while app gold
        # reads mip.silver.*. Refresh silver here so raw-share expansions or
        # corrections do not create the same stale-snapshot failure shape.
        env:
          DATABRICKS_AUTH_TYPE: pat
          BUNDLE_VAR_sql_warehouse_id: ${{ secrets.DATABRICKS_WAREHOUSE_ID }}
          BUNDLE_VAR_genie_space_id: ${{ secrets.GENIE_SPACE_ID }}
        run: databricks bundle run mip_refresh_silver -t dev --profile DEFAULT
      - name: Refresh live gold scoring snapshot before validation
        # Rebuild borrower_360, lead_scores, segment_population, rollups, and
        # source_readiness from the just-refreshed silver/reference inputs.
        # Without this, weekly FRED/source-readiness changes can make live
        # validation fail until a human happens to run deploy.sh or the app's
        # Admin Operations refresh.
        env:
          DATABRICKS_AUTH_TYPE: pat
          BUNDLE_VAR_sql_warehouse_id: ${{ secrets.DATABRICKS_WAREHOUSE_ID }}
          BUNDLE_VAR_genie_space_id: ${{ secrets.GENIE_SPACE_ID }}
        run: databricks bundle run mip_refresh_scores -t dev --profile DEFAULT
      - name: SQL <-> Python parity
        run: pytest -q tests/integration/test_sql_python_parity.py
      - name: Lakeview widgets resolve (dashboards)
        # Resolves every widget in dashboards/*.lvdash.json against the
        # real warehouse: the SQL executes, every encoded column is in
        # the result schema, and row shape matches the chart type. This
        # is the strongest proxy for "open the dashboard in Lakeview UI
        # and eyeball it" that is possible from CI. Release-blocking
        # (no continue-on-error): a broken widget means executives see a
        # blank chart on the next login.
        run: pytest tests/integration/test_dashboard_widgets_resolve.py -q --tb=short
      - name: Executive metrics reconcile to canonical snapshot
        run: pytest tests/integration/test_executive_metric_reconciliation.py -q --tb=short
      - name: Module 0 segment and raw-share parity
        run: pytest tests/integration/test_segment_count_parity.py -q --tb=short
      - name: Module 0 gold data-truth invariants
        run: pytest tests/integration/test_gold_data_truth.py -q --tb=short
      - name: Module 0 geography rollup reconciliation
        run: pytest tests/integration/test_geo_rollup_reconciliation.py -q --tb=short
      - name: Module 0 source readiness completeness
        run: pytest tests/integration/test_source_readiness_live.py -q --tb=short
      - name: Borrower dossier parity
        run: pytest tests/integration/test_borrower_dossier_parity.py -q --tb=short
      - name: Borrower identity and silver normalization invariants
        run: |
          pytest -q --tb=short \
            tests/integration/test_borrower_id_uniqueness.py \
            tests/integration/test_silver_coercion.py \
            tests/integration/test_silver_zip_5_digit.py
      - name: Lakebase round-trip
        # Release-blocking: Lakebase stores governed cohorts, drafts,
        # approvals, and audit rows. Auth/schema drift here means the app can
        # look correct while losing durable workflow proof.
        run: pytest -q tests/integration/test_lakebase_round_trip.py
      - name: Genie live
        if: always()
        run: pytest -q tests/integration/test_genie_live.py
      - name: Genie regression + adversarial
        # 29 checks total: 22 live-gated Genie space queries (wired to the
        # same secrets as the step above) + 7 credential-free graders that
        # lint space instructions and adversarial prompt contracts. Runs
        # after `Genie live` so a broken space surfaces there first.
        # `if: always()` so a Lakebase outage doesn't stop Genie regression
        # from exercising the hardened space.
        if: always()
        run: pytest -q tests/integration/test_genie_regression.py

  playwright-e2e-live:
    name: Playwright (real-UC golden path)
    needs: parity-live
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Deliberately omit LAKEBASE_HOST / _USER / _PASSWORD here so the
      # backend's `_resolve_lakebase_connection_params` takes the SDK
      # workspace-identity path: it calls `/api/2.0/database/instances/
      # mip-app-state` to resolve the real `read_write_dns`, uses the
      # PAT-identity's `user_name` as the Postgres user, and mints a
      # fresh short-lived Postgres password via
      # `/api/2.0/database/credentials`. This mirrors the pattern in
      # jobs/lakebase_migrate.py and what the deployed App does at
      # startup — one auth story for every environment, and no stale
      # LAKEBASE_PASSWORD secret to rotate.
      LAKEBASE_INTEGRATION: '1'
      E2E_LIVE: '1'
      MIP_APP_NAME: mip-app
      # MIP_APP_URL / MIP_BEARER_TOKEN are populated at step-time by the
      # "Resolve deployed app URL" + "Set Playwright Bearer token" steps below.
      # This job is the deployed-app release gate, so missing Databricks
      # workspace credentials or missing M2M OAuth secrets fail fast instead
      # of silently falling back to localhost or an admin PAT.
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f frontend/package-lock.json ]; then
            npm --prefix frontend ci
          else
            npm --prefix frontend install --no-audit --no-fund
          fi
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Resolve deployed app URL
        # This job intentionally has one path:
        #   deployed -> hit the real Databricks App through its OAuth proxy.
        # Prefer the explicit MIP_APP_URL secret when present; otherwise
        # resolve `mip-app` through the Databricks Apps API so this gate does
        # not fail just because an easily-derived URL secret was omitted.
        env:
          _URL: ${{ secrets.MIP_APP_URL }}
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DATABRICKS_HOST:-}" ] || [ -z "${DATABRICKS_TOKEN:-}" ]; then
            echo "::error::Missing DATABRICKS_HOST or DATABRICKS_TOKEN; cannot resolve deployed app URL."
            exit 1
          fi
          if [ -n "$_URL" ]; then
            APP_URL="${_URL%/}"
          else
            APP_URL="$(python - <<'PY'
          import os
          from databricks.sdk import WorkspaceClient

          app_name = os.environ.get("MIP_APP_NAME", "mip-app")
          app = WorkspaceClient().apps.get(app_name)
          url = (app.url or "").rstrip("/")
          if not url:
              raise SystemExit(f"Databricks app {app_name!r} has no URL")
          print(url)
          PY
            )"
          fi
          echo "MIP_APP_URL=$APP_URL" >> "$GITHUB_ENV"
          echo "MIP_API_URL=$APP_URL" >> "$GITHUB_ENV"
          echo "::notice::Live Playwright will target deployed app at $APP_URL."
      - name: Set Playwright Bearer tokens
        # M2M OAuth is required for deployed app auth. The service principal
        # is intentionally non-admin; the smoke step below proves it can read
        # allowed lead surfaces while admin/audit endpoints fail closed. Do
        # not fall back to the admin PAT for the normal browser session.
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          ADMIN_BEARER: ${{ secrets.MIP_ADMIN_BEARER_TOKEN }}
          SKIP_ADMIN_DEGRADED_PROOF: ${{ inputs.skip_admin_degraded_proof }}
        run: |
          set -euo pipefail
          missing=""
          for v in DATABRICKS_CLIENT_ID DATABRICKS_CLIENT_SECRET; do
            if [ -z "${!v:-}" ]; then
              missing="$missing $v"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required M2M OAuth secret(s):$missing"
            exit 1
          fi
          BEARER=$(python tools/oauth_m2m_mint.py)
          if [ -z "$BEARER" ]; then
            echo "::error::M2M bearer token was empty"
            exit 1
          fi
          echo "::add-mask::$BEARER"
          if [ -n "${ADMIN_BEARER:-}" ]; then
            echo "::add-mask::$ADMIN_BEARER"
            echo "MIP_ADMIN_BEARER_TOKEN=$ADMIN_BEARER" >> "$GITHUB_ENV"
            echo "::notice::Using explicit app-admin Bearer for the bounded degraded-banner drill."
          else
            if [ "${SKIP_ADMIN_DEGRADED_PROOF:-false}" = "true" ]; then
              echo "::warning::MIP_ADMIN_BEARER_TOKEN is not set; bounded admin degraded-banner proof explicitly skipped by workflow input."
            else
              echo "::error::Missing MIP_ADMIN_BEARER_TOKEN. Set it for release validation, or rerun with skip_admin_degraded_proof=true and record the caveat."
              exit 1
            fi
          fi
          {
            echo "MIP_NON_ADMIN_BEARER_TOKEN=$BEARER"
            echo "MIP_BEARER_TOKEN=$BEARER"
          } >> "$GITHUB_ENV"
          echo "::notice::Using non-admin M2M OAuth Bearer for deployed Playwright."
      - name: Authenticated non-admin smoke (M2M)
        run: |
          python - <<'PY'
          from __future__ import annotations

          import os
          import urllib.error
          import urllib.request

          app_url = os.environ["MIP_APP_URL"].rstrip("/")
          token = os.environ["MIP_NON_ADMIN_BEARER_TOKEN"]

          def status(path: str) -> int:
              req = urllib.request.Request(
                  app_url + path,
                  headers={"Authorization": f"Bearer {token}"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:  # noqa: S310
                      return int(resp.status)
              except urllib.error.HTTPError as exc:
                  return int(exc.code)

          checks = {
              "/api/leads?limit=1": 200,
              "/api/audit/events?limit=1": 403,
              "/api/admin/rules": 403,
          }
          failed = []
          for path, expected in checks.items():
              actual = status(path)
              print(f"{path} -> {actual}")
              if actual != expected:
                  failed.append(f"{path}: expected {expected}, got {actual}")
          if failed:
              raise SystemExit("; ".join(failed))
          PY
      - name: Genie semantic eval scorecard (deployed app)
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_WAREHOUSE_ID: ${{ secrets.DATABRICKS_WAREHOUSE_ID }}
          GENIE_SPACE_ID: ${{ secrets.GENIE_SPACE_ID }}
        run: |
          python tools/wait_app_ready.py \
            --base "$MIP_APP_URL" \
            --token "$MIP_BEARER_TOKEN" \
            --timeout-s 600 \
            --interval-s 20 \
            --breakers warehouse,lakebase,genie \
            --genie-probe-question "Summarize the current Module 0 mortgage lead opportunity and cite the trusted assets."
          python tools/genie_eval.py \
            --base "$MIP_APP_URL" \
            --token "$MIP_BEARER_TOKEN" \
            --timeout 120 \
            --attempts 4 \
            --retry-backoff-s 20 \
            --pace-s 2
      - name: Run real-UC Playwright specs
        # Config + specs both live under `frontend/` so `@playwright/test`
        # imports resolve against frontend/node_modules. E2E_LIVE-gated
        # so this spec is live-validation-only; PR CI runs a --list parse
        # check. MIP_APP_URL is required for this deployed path, so the
        # config's webServer block is disabled and real_data.spec.ts
        # attaches MIP_BEARER_TOKEN as an Authorization header.
        working-directory: frontend
        run: |
          npx playwright test \
            tests/e2e/real_data.spec.ts \
            tests/e2e/growth_agent_live.spec.ts \
            tests/e2e/movement_closed_loop_regressions.spec.ts \
            tests/e2e/demo_visual.spec.ts \
            tests/e2e/accessibility.spec.ts \
            tests/e2e/responsive.spec.ts \
            tests/e2e/route_performance.spec.ts \
            --reporter=list --workers=1
      - name: Run mocked Genie proof layout canary
        # This spec route-fulfills Genie responses to stress proof-drawer
        # layout with dense trusted-SQL evidence. Keep it separate from the
        # real-UC live gate so it is never counted as live Genie proof.
        working-directory: frontend
        env:
          GENIE_PROOF_LAYOUT_MOCKED: '1'
        run: |
          npx playwright test \
            tests/e2e/genie_proof_layout.spec.ts \
            --reporter=list --workers=1
      - name: Run procurement accessibility and browser/device matrix
        # Separate from the golden path so the standard live suite stays
        # Chromium-focused, while this gate expands only the procurement
        # specs across Chromium, Firefox, WebKit, phone, and tablet projects.
        working-directory: frontend
        env:
          E2E_BROWSER_MATRIX: '1'
        run: |
          npx playwright test \
            tests/e2e/accessibility_procurement.spec.ts \
            tests/e2e/cross_browser_matrix.spec.ts \
            --reporter=list --workers=1
      - name: Upload Playwright report on failure
        # Live Playwright runs carry bearer-authenticated requests and real
        # borrower/audit surfaces. Do not upload DOM/video/trace artifacts by
        # default; enable only for a controlled, redacted operator run.
        if: failure() && env.E2E_LIVE_FAILURE_ARTIFACTS == '1'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-live
          path: frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 14

  kill-drill-simulated:
    name: Credential-kill drill (simulated targets)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Simulated drills (genie / token / warehouse-sim / lakebase-sim)
    # do NOT touch real infra: they manipulate env vars in a private
    # subshell, boot a drill backend on :8001, and assert the visible
    # degraded contract (/api/health flips, data endpoints 503 with
    # retryable=true, no silent mock fallback). A drill failure IS a
    # release blocker -- continue-on-error stays default (false).
    env:
      LAKEBASE_DATABASE: ${{ secrets.LAKEBASE_DATABASE || 'mip_app_state' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install jq + lsof (runner usually has both; belt & braces)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq lsof
      - name: Export simulated drill env
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_WAREHOUSE_ID: ${{ secrets.DATABRICKS_WAREHOUSE_ID }}
          GENIE_SPACE_ID: ${{ secrets.GENIE_SPACE_ID }}
          LAKEBASE_HOST: ${{ secrets.LAKEBASE_HOST }}
          LAKEBASE_USER: ${{ secrets.LAKEBASE_USER }}
          LAKEBASE_PASSWORD: ${{ secrets.LAKEBASE_PASSWORD }}
        run: |
          {
            echo "DATABRICKS_HOST=$DATABRICKS_HOST"
            echo "DATABRICKS_TOKEN=$DATABRICKS_TOKEN"
            echo "DATABRICKS_WAREHOUSE_ID=$DATABRICKS_WAREHOUSE_ID"
            echo "GENIE_SPACE_ID=$GENIE_SPACE_ID"
            echo "LAKEBASE_HOST=$LAKEBASE_HOST"
            echo "LAKEBASE_USER=$LAKEBASE_USER"
            echo "LAKEBASE_PASSWORD=$LAKEBASE_PASSWORD"
          } >> "$GITHUB_ENV"
      # Each drill boots a private backend on :8001, so they must run
      # sequentially (not matrix-parallel) to avoid port contention.
      # `if: always()` lets later drills run even if an earlier one
      # fails, so one regression doesn't mask others in the same PR.
      - name: Drill - genie (bogus GENIE_SPACE_ID)
        run: bash tools/kill_drill/run_drill.sh --target genie --await-seconds 90
      - name: Drill - token (PAT cleared + auth_type pinned)
        if: always()
        run: bash tools/kill_drill/run_drill.sh --target token --await-seconds 90
      - name: Drill - warehouse-sim (bogus DATABRICKS_WAREHOUSE_ID)
        if: always()
        run: bash tools/kill_drill/run_drill.sh --target warehouse-sim --await-seconds 90
      - name: Drill - lakebase-sim (unreachable LAKEBASE_HOST)
        if: always()
        run: bash tools/kill_drill/run_drill.sh --target lakebase-sim --await-seconds 90
      - name: Upload evidence logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kill-drill-evidence
          path: tools/kill_drill/evidence/
          if-no-files-found: warn
          retention-days: 30

  genie-fuzz-standard:
    name: Genie standard fuzz
    # Standard 15-example/family fuzz is part of the manual live release
    # signal. It runs after the broad live parity + Playwright gates so
    # the shared Genie Space is not rate-limited by concurrent prompt
    # suites. The heavier 200-example/family deep fuzz remains opt-in below.
    needs: playwright-e2e-live
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MIP_GENIE_FUZZ_EXAMPLES: '15'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Export Genie live env
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_WAREHOUSE_ID: ${{ secrets.DATABRICKS_WAREHOUSE_ID }}
          GENIE_SPACE_ID: ${{ secrets.GENIE_SPACE_ID }}
        run: |
          missing=""
          for v in DATABRICKS_HOST DATABRICKS_TOKEN GENIE_SPACE_ID; do
            if [ -z "${!v}" ]; then
              missing="$missing $v"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets:$missing"
            exit 1
          fi
          {
            echo "DATABRICKS_HOST=$DATABRICKS_HOST"
            echo "DATABRICKS_TOKEN=$DATABRICKS_TOKEN"
            echo "DATABRICKS_WAREHOUSE_ID=$DATABRICKS_WAREHOUSE_ID"
            echo "GENIE_SPACE_ID=$GENIE_SPACE_ID"
          } >> "$GITHUB_ENV"
      - name: Run standard Genie fuzz
        run: pytest -q tests/integration/test_genie_fuzz.py -m integration
      - name: Upload fuzz failure artefacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: genie-fuzz-standard-failures
          path: tests/integration/genie_fuzz_failures/
          if-no-files-found: ignore
          retention-days: 30

  kill-drill-real-infra:
    name: Credential-kill drill (REAL infra -- opt-in)
    # Opt-in rehearsal. Only runs on manual workflow_dispatch WITH the
    # run_real_drills input set to true. Stopping the real warehouse +
    # Lakebase is too disruptive to run by default.
    #
    # Run after live parity, Playwright, and the standard Genie fuzz so
    # stopping shared resources never invalidates the proofs it is meant to
    # complement. When this opt-in gate is requested, it is release-blocking.
    if: github.event_name == 'workflow_dispatch' && inputs.run_real_drills == true
    needs: [playwright-e2e-live, genie-fuzz-standard]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LAKEBASE_INSTANCE_NAME: mip-app-state
      # Explicit allow-flag. The run_drill.sh script refuses to stop
      # real infra unless this is set OR --i-really-mean-it is passed.
      # Scope it to this job only; do NOT promote to workflow-env.
      MIP_KILL_DRILL_ALLOW_REAL: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install jq + lsof
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq lsof
      - name: Export real-infra drill env
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_WAREHOUSE_ID: ${{ secrets.DATABRICKS_WAREHOUSE_ID }}
          MIP_APP_URL: ${{ secrets.MIP_APP_URL }}
        run: |
          missing=""
          for v in DATABRICKS_HOST DATABRICKS_TOKEN DATABRICKS_WAREHOUSE_ID MIP_APP_URL; do
            if [ -z "${!v}" ]; then
              missing="$missing $v"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets for real-infra drill:$missing"
            exit 1
          fi
          {
            echo "DATABRICKS_HOST=$DATABRICKS_HOST"
            echo "DATABRICKS_TOKEN=$DATABRICKS_TOKEN"
            echo "DATABRICKS_WAREHOUSE_ID=$DATABRICKS_WAREHOUSE_ID"
            echo "MIP_APP_URL=$MIP_APP_URL"
          } >> "$GITHUB_ENV"
      # Each real-infra drill must complete stop+restart before the next
      # starts so we don't overlap outages. Sequential, not matrix.
      - name: Drill - warehouse-real (SDK stop/start)
        run: |
          bash tools/kill_drill/run_drill.sh \
            --target warehouse-real \
            --i-really-mean-it \
            --app-url "$MIP_APP_URL" \
            --await-seconds 180
      - name: Drill - lakebase-real (SDK stop/start)
        if: always()
        run: |
          bash tools/kill_drill/run_drill.sh \
            --target lakebase-real \
            --i-really-mean-it \
            --app-url "$MIP_APP_URL" \
            --await-seconds 180
      - name: Upload real-infra evidence logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kill-drill-real-infra-evidence
          path: tools/kill_drill/evidence/
          if-no-files-found: warn
          retention-days: 90

  genie-fuzz-deep:
    name: Genie deep fuzz (200 examples/family)
    needs: genie-fuzz-standard
    # Workflow-dispatch only: this burns ~90 min of real Genie quota
    # (3 families × 200 examples × ~5s avg response + 4s pacing). Kept
    # off the default live gate so it never runs unexpectedly and never
    # eats into the primary live-UC budget. A release engineer fires it
    # from the Actions UI ahead of a major release, or on an incident
    # re-run. The 45-min timeout is deliberate: one family at
    # 200 × ~9s ≈ 30 min, so the budget fits one family per run plus
    # the coverage assertion. The deep tests share the
    # `_ADVERSARIAL_TEMPLATE_HITS` counter in-process, so a single
    # pytest invocation collects coverage for all three families.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_deep_genie_fuzz == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # 200 examples/family is the spec. An operator who wants a
      # smaller targeted rerun can override this via the Actions UI's
      # "Run workflow" dialog (after wiring up an input), or by forking
      # the workflow. The _resolve_examples helper clamps to [1, 1000].
      MIP_GENIE_FUZZ_EXAMPLES: '200'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Hypothesis is a `.[fuzz]` extra; install it explicitly here
          # in case requirements.txt drops the pin.
          pip install "hypothesis>=6.123,<7"
      - name: Export deep Genie live env
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_WAREHOUSE_ID: ${{ secrets.DATABRICKS_WAREHOUSE_ID }}
          GENIE_SPACE_ID: ${{ secrets.GENIE_SPACE_ID }}
        run: |
          missing=""
          for v in DATABRICKS_HOST DATABRICKS_TOKEN GENIE_SPACE_ID; do
            if [ -z "${!v}" ]; then
              missing="$missing $v"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets:$missing"
            exit 1
          fi
          {
            echo "DATABRICKS_HOST=$DATABRICKS_HOST"
            echo "DATABRICKS_TOKEN=$DATABRICKS_TOKEN"
            echo "DATABRICKS_WAREHOUSE_ID=$DATABRICKS_WAREHOUSE_ID"
            echo "GENIE_SPACE_ID=$GENIE_SPACE_ID"
          } >> "$GITHUB_ENV"
      - name: Run deep Genie fuzz
        # `-m genie_fuzz_deep` selects only the 200-example variants
        # plus the template-coverage assertion. The standard 15-example
        # tests stay in the `integration` mark and are not re-run here.
        run: pytest -m genie_fuzz_deep tests/integration/test_genie_fuzz.py -q
      - name: Upload fuzz failure artefacts
        # `if: always()` so the artefacts upload even when the fuzz
        # run fails -- those are exactly the runs whose JSONL payload
        # the operator needs to replay.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: genie-fuzz-failures
          path: tests/integration/genie_fuzz_failures/
          if-no-files-found: ignore
          retention-days: 30

  notify-on-failure:
    name: File issue on failure
    needs: [parity-live, playwright-e2e-live, kill-drill-simulated, genie-fuzz-standard, kill-drill-real-infra]
    if: >-
      ${{
        always() && (
          needs.parity-live.result == 'failure' ||
          needs.playwright-e2e-live.result == 'failure' ||
          needs.kill-drill-simulated.result == 'failure' ||
          needs.genie-fuzz-standard.result == 'failure' ||
          needs.kill-drill-real-infra.result == 'failure'
        )
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Create or update tracking issue
        uses: actions/github-script@v9
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `live validation: live-UC check failed on ${new Date().toISOString().slice(0, 10)}`;
            const body = [
              `Manual live-UC workflow failed. Run: ${runUrl}`,
              '',
              '**Likely causes (in order):**',
              '- The new pre-validation refresh step failed (`mip_fred_rates_ingest`, `mip_refresh_silver`, or `mip_refresh_scores`). Inspect those logs first.',
              '- Databricks workspace credentials rotated (check repo secrets).',
              '- Serverless warehouse or Lakebase instance stopped.',
              '- A parity step failed after refresh, which now means real SQL/Python or raw-share/gold predicate drift.',
              '- Genie space deleted or its trusted-assets list pruned.',
              '',
              '**Triage:** docs/runbook.md §3 (parity-red) and §8 (CI failure triage).',
            ].join('\n');

            const labels = ['ci-failure', 'live-validation'];
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: labels.join(','),
              per_page: 100,
            });

            const match = existing.find((issue) => issue.title === title && !issue.pull_request);
            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                body: `Another manual live-UC workflow failed. Run: ${runUrl}`,
              });
              core.notice(`Updated existing live-validation failure issue #${match.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels,
              });
              core.notice(`Created live-validation failure issue #${created.data.number}`);
            }
