            ${{ vars.MIP_REVIEW_MODE && 'MIP_REVIEW_MODE' || '' }}
            ${{ vars.MIP_RUNTIME_SECRET_SCOPE && 'MIP_RUNTIME_SECRET_SCOPE' || '' }}
            ${{ vars.MIP_SCHEDULED_REFRESH && 'MIP_SCHEDULED_REFRESH' || '' }}
