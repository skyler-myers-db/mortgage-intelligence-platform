name: nightly (live UC)

# Nightly workflow -- runs the real-UC integration + Playwright suites
# against the dev Databricks workspace at ~05:00 CT (10:00 UTC). This is
# the canary that catches:
#   - SQL<->Python parity drift (tests/integration/test_sql_python_parity.py)
#   - Genie space regression (tests/integration/test_genie_live.py)
#   - Lakebase schema/auth drift (tests/integration/test_lakebase_round_trip.py)
#   - End-to-end live product path (tests/e2e/real_data.spec.ts)
#
# All jobs require repo secrets (see .github/workflows/README.md). A
# manual `workflow_dispatch` trigger is wired so an engineer can re-run
# after a workspace outage without waiting for the next cron fire.
#
# On failure: a GitHub issue is created with the failing job name + a
# link to the run. Slack/PagerDuty integration is deliberately deferred
# until the user picks a notification channel.

on:
  schedule:
    # 10:00 UTC = 05:00 CT (CDT) / 04:00 CT (CST). Early-morning run
    # catches regressions before the workday starts.
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      run_real_drills:
        description: "Run the real-infra kill drills (stops + restarts warehouse/Lakebase)"
        type: boolean
        default: false

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '22'

permissions:
  contents: read
  issues: write   # required for the auto-filed failure issue

jobs:
  parity-live:
    name: SQL<->Python + Lakebase + Genie live
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_WAREHOUSE_ID: ${{ secrets.DATABRICKS_WAREHOUSE_ID }}
      GENIE_SPACE_ID: ${{ secrets.GENIE_SPACE_ID }}
      LAKEBASE_HOST: ${{ secrets.LAKEBASE_HOST }}
      LAKEBASE_USER: ${{ secrets.LAKEBASE_USER }}
      LAKEBASE_PASSWORD: ${{ secrets.LAKEBASE_PASSWORD }}
      LAKEBASE_DATABASE: ${{ secrets.LAKEBASE_DATABASE }}
      LAKEBASE_INTEGRATION: '1'   # opt-in flag Slice 5 requires
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Fail fast if required secrets are missing
        # Catches the "secrets were rotated and nobody updated the repo"
        # class of failure explicitly instead of letting pytest emit a
        # SKIP that a human has to decode.
        run: |
          missing=""
          for v in DATABRICKS_HOST DATABRICKS_TOKEN DATABRICKS_WAREHOUSE_ID \
                   GENIE_SPACE_ID LAKEBASE_HOST LAKEBASE_USER LAKEBASE_PASSWORD; do
            if [ -z "${!v}" ]; then
              missing="$missing $v"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets:$missing"
            exit 1
          fi
      - name: Install Databricks CLI (v2)
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
          databricks --version
      - name: databricks bundle validate (dev target, real creds)
        # The real validate moved here from PR CI because it unavoidably
        # calls /api/2.0/preview/scim/v2/Me which requires a real token.
        # Newer CLI (v0.297+) always resolves a profile from
        # ~/.databrickscfg -- env-var-only auth returns the misleading
        # error "no DEFAULT profile configured." Seed a real DEFAULT
        # profile from the secrets block; the secrets values double-pipe
        # into both the env vars the Python SDK reads and the
        # .databrickscfg file the CLI reads.
        env:
          DATABRICKS_AUTH_TYPE: pat
          BUNDLE_VAR_sql_warehouse_id: ${{ secrets.DATABRICKS_WAREHOUSE_ID }}
          BUNDLE_VAR_genie_space_id: ${{ secrets.GENIE_SPACE_ID }}
          BUNDLE_VAR_lakebase_instance: mip-app-state
        run: |
          {
            echo "[DEFAULT]"
            echo "host  = ${DATABRICKS_HOST}"
            echo "token = ${DATABRICKS_TOKEN}"
          } > "$HOME/.databrickscfg"
          chmod 600 "$HOME/.databrickscfg"
          databricks bundle validate -t dev
      - name: SQL <-> Python parity
        run: pytest -q tests/integration/test_sql_python_parity.py
      - name: Lakeview widgets resolve (dashboards)
        # Resolves every widget in dashboards/*.lvdash.json against the
        # real warehouse: the SQL executes, every encoded column is in
        # the result schema, and row shape matches the chart type. This
        # is the strongest proxy for "open the dashboard in Lakeview UI
        # and eyeball it" that is possible from CI. Release-blocking
        # (no continue-on-error): a broken widget means executives see a
        # blank chart on the next login.
        run: pytest tests/integration/test_dashboard_widgets_resolve.py -q --tb=short
      - name: Executive metrics reconcile to canonical snapshot
        run: pytest tests/integration/test_executive_metric_reconciliation.py -q --tb=short
      - name: Module 0 segment and raw-share parity
        run: pytest tests/integration/test_segment_count_parity.py -q --tb=short
      - name: Module 0 gold data-truth invariants
        run: pytest tests/integration/test_gold_data_truth.py -q --tb=short
      - name: Module 0 geography rollup reconciliation
        run: pytest tests/integration/test_geo_rollup_reconciliation.py -q --tb=short
      - name: Module 0 source readiness completeness
        run: pytest tests/integration/test_source_readiness_live.py -q --tb=short
      - name: Borrower dossier parity
        run: pytest tests/integration/test_borrower_dossier_parity.py -q --tb=short
      - name: Borrower identity and silver normalization invariants
        run: |
          pytest -q --tb=short \
            tests/integration/test_borrower_id_uniqueness.py \
            tests/integration/test_silver_coercion.py \
            tests/integration/test_silver_zip_5_digit.py
      - name: Lakebase round-trip
        # Release-blocking: Lakebase stores governed cohorts, drafts,
        # approvals, and audit rows. Auth/schema drift here means the app can
        # look correct while losing durable workflow proof.
        run: pytest -q tests/integration/test_lakebase_round_trip.py
      - name: Genie live
        if: always()
        run: pytest -q tests/integration/test_genie_live.py
      - name: Genie regression + adversarial
        # 29 checks total: 22 live-gated Genie space queries (wired to the
        # same secrets as the step above) + 7 credential-free graders that
        # lint space instructions and adversarial prompt contracts. Runs
        # after `Genie live` so a broken space surfaces there first.
        # `if: always()` so a Lakebase outage doesn't stop Genie regression
        # from exercising the hardened space.
        if: always()
        run: pytest -q tests/integration/test_genie_regression.py

  playwright-e2e-live:
    name: Playwright (real-UC golden path)
    needs: parity-live
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_WAREHOUSE_ID: ${{ secrets.DATABRICKS_WAREHOUSE_ID }}
      GENIE_SPACE_ID: ${{ secrets.GENIE_SPACE_ID }}
      # Deliberately omit LAKEBASE_HOST / _USER / _PASSWORD here so the
      # backend's `_resolve_lakebase_connection_params` takes the SDK
      # workspace-identity path: it calls `/api/2.0/database/instances/
      # mip-app-state` to resolve the real `read_write_dns`, uses the
      # PAT-identity's `user_name` as the Postgres user, and mints a
      # fresh short-lived Postgres password via
      # `/api/2.0/database/credentials`. This mirrors the pattern in
      # jobs/lakebase_migrate.py and what the deployed App does at
      # startup — one auth story for every environment, and no stale
      # LAKEBASE_PASSWORD secret to rotate.
      LAKEBASE_INTEGRATION: '1'
      E2E_LIVE: '1'
      # real_data.spec.ts uses this to flip the force-degraded flag.
      MIP_FORCE_DEGRADED_TOKEN: ${{ secrets.MIP_FORCE_DEGRADED_TOKEN }}
      # MIP_APP_URL / MIP_BEARER_TOKEN are populated at step-time by the
      # "Detect deployed-URL path" + "Mint workspace Bearer" steps below.
      # This job is the deployed-app release gate, so missing deployed-path
      # secrets fail fast instead of silently falling back to localhost.
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f frontend/package-lock.json ]; then
            npm --prefix frontend ci
          else
            npm --prefix frontend install --no-audit --no-fund
          fi
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Detect deployed-URL path
        # This job intentionally has one path:
        #   deployed -> mint an M2M Bearer, hit the real Databricks App
        #               through its OAuth proxy.
        # Missing M2M/app-url secrets are a release-gate failure.
        # GitHub Actions doesn't allow `secrets.*` in `if:` expressions,
        # so we reduce the presence check to a single step output here.
        id: pathsel
        env:
          _CID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          _CSEC: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          _URL: ${{ secrets.MIP_APP_URL }}
        run: |
          if [ -n "$_CID" ] && [ -n "$_CSEC" ] && [ -n "$_URL" ]; then
            echo "use_deployed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Nightly Playwright will target deployed app via M2M OAuth."
          else
            echo "::error::Missing deployed-path secrets: DATABRICKS_CLIENT_ID, DATABRICKS_CLIENT_SECRET, and MIP_APP_URL are all required."
            exit 1
          fi
      - name: Mint workspace Bearer (M2M OAuth)
        # Runs ONLY when the deployed path is selected. A mint failure
        # here is a HARD failure for the job — see
        # docs/security/m2m-oauth-setup.md § "Credential-kill drill".
        # We deliberately do NOT fall through to localhost on mint
        # failure, because that would silently mask the very class of
        # regression this path is here to catch.
        if: steps.pathsel.outputs.use_deployed == 'true'
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: |
          # Token is short-lived (~1h) but a full Playwright run is
          # 5-10 min, so a single mint per job is enough. Redirect the
          # helper's stdout (the token itself) into a variable; stderr
          # lines go to the Actions log for operator triage.
          set -euo pipefail
          BEARER=$(python tools/oauth_m2m_mint.py)
          if [ -z "$BEARER" ]; then
            echo "::error::oauth_m2m_mint.py exited 0 but stdout was empty"
            exit 1
          fi
          # GitHub auto-masks the value because it's being written to
          # $GITHUB_ENV through a step input sourced from a secret-backed
          # env var. Belt-and-braces: explicitly add-mask it too.
          echo "::add-mask::$BEARER"
          echo "MIP_BEARER_TOKEN=$BEARER" >> "$GITHUB_ENV"
      - name: Wire MIP_APP_URL / MIP_API_URL for deployed path
        if: steps.pathsel.outputs.use_deployed == 'true'
        env:
          _URL: ${{ secrets.MIP_APP_URL }}
        run: |
          echo "MIP_APP_URL=$_URL" >> "$GITHUB_ENV"
          echo "MIP_API_URL=$_URL" >> "$GITHUB_ENV"
      - name: Genie semantic eval scorecard (deployed app)
        if: steps.pathsel.outputs.use_deployed == 'true'
        run: python tools/genie_eval.py --base "$MIP_APP_URL" --token "$MIP_BEARER_TOKEN" --timeout 120
      - name: Run real-UC Playwright specs
        # Config + specs both live under `frontend/` so `@playwright/test`
        # imports resolve against frontend/node_modules. E2E_LIVE-gated
        # so this spec is nightly-only; the PR CI runs a --list parse
        # check. MIP_APP_URL is required for this deployed path, so the
        # config's webServer block is disabled and real_data.spec.ts
        # attaches MIP_BEARER_TOKEN as an Authorization header.
        working-directory: frontend
        run: |
          npx playwright test \
            tests/e2e/real_data.spec.ts \
            tests/e2e/demo_visual.spec.ts \
            tests/e2e/accessibility.spec.ts \
            tests/e2e/responsive.spec.ts \
            tests/e2e/genie_proof_layout.spec.ts \
            tests/e2e/route_performance.spec.ts \
            --reporter=list --workers=1
      - name: Run procurement accessibility and browser/device matrix
        # Separate from the golden path so the standard live suite stays
        # Chromium-focused, while this gate expands only the procurement
        # specs across Chromium, Firefox, WebKit, phone, and tablet projects.
        working-directory: frontend
        env:
          E2E_BROWSER_MATRIX: '1'
        run: |
          npx playwright test \
            tests/e2e/accessibility_procurement.spec.ts \
            tests/e2e/cross_browser_matrix.spec.ts \
            --reporter=list --workers=1
      - name: Upload Playwright report on failure
        # Live Playwright runs carry bearer-authenticated requests and real
        # borrower/audit surfaces. Do not upload DOM/video/trace artifacts by
        # default; enable only for a controlled, redacted operator run.
        if: failure() && env.E2E_LIVE_FAILURE_ARTIFACTS == '1'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-live
          path: frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 14

  kill-drill-simulated:
    name: Credential-kill drill (simulated targets)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Simulated drills (genie / token / warehouse-sim / lakebase-sim)
    # do NOT touch real infra: they manipulate env vars in a private
    # subshell, boot a drill backend on :8001, and assert the visible
    # degraded contract (/api/health flips, data endpoints 503 with
    # retryable=true, no silent mock fallback). A drill failure IS a
    # release blocker -- continue-on-error stays default (false).
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_WAREHOUSE_ID: ${{ secrets.DATABRICKS_WAREHOUSE_ID }}
      GENIE_SPACE_ID: ${{ secrets.GENIE_SPACE_ID }}
      LAKEBASE_HOST: ${{ secrets.LAKEBASE_HOST }}
      LAKEBASE_USER: ${{ secrets.LAKEBASE_USER }}
      LAKEBASE_PASSWORD: ${{ secrets.LAKEBASE_PASSWORD }}
      LAKEBASE_DATABASE: ${{ secrets.LAKEBASE_DATABASE }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install jq + lsof (runner usually has both; belt & braces)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq lsof
      # Each drill boots a private backend on :8001, so they must run
      # sequentially (not matrix-parallel) to avoid port contention.
      # `if: always()` lets later drills run even if an earlier one
      # fails, so one regression doesn't mask others in the same PR.
      - name: Drill - genie (bogus GENIE_SPACE_ID)
        run: bash tools/kill_drill/run_drill.sh --target genie --await-seconds 90
      - name: Drill - token (PAT cleared + auth_type pinned)
        if: always()
        run: bash tools/kill_drill/run_drill.sh --target token --await-seconds 90
      - name: Drill - warehouse-sim (bogus DATABRICKS_WAREHOUSE_ID)
        if: always()
        run: bash tools/kill_drill/run_drill.sh --target warehouse-sim --await-seconds 90
      - name: Drill - lakebase-sim (unreachable LAKEBASE_HOST)
        if: always()
        run: bash tools/kill_drill/run_drill.sh --target lakebase-sim --await-seconds 90
      - name: Upload evidence logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kill-drill-evidence
          path: tools/kill_drill/evidence/
          if-no-files-found: warn
          retention-days: 30

  genie-fuzz-standard:
    name: Genie standard fuzz (scheduled)
    # Standard 15-example/family fuzz is part of the scheduled nightly
    # safety signal. It runs in its own job so the broad live parity gate
    # keeps its timeout budget. The heavier 200-example/family deep fuzz
    # remains workflow-dispatch only below.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_WAREHOUSE_ID: ${{ secrets.DATABRICKS_WAREHOUSE_ID }}
      GENIE_SPACE_ID: ${{ secrets.GENIE_SPACE_ID }}
      MIP_GENIE_FUZZ_EXAMPLES: '15'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Fail fast if required secrets are missing
        run: |
          missing=""
          for v in DATABRICKS_HOST DATABRICKS_TOKEN GENIE_SPACE_ID; do
            if [ -z "${!v}" ]; then
              missing="$missing $v"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets:$missing"
            exit 1
          fi
      - name: Run standard Genie fuzz
        run: pytest -q tests/integration/test_genie_fuzz.py -m integration
      - name: Upload fuzz failure artefacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: genie-fuzz-standard-failures
          path: tests/integration/genie_fuzz_failures/
          if-no-files-found: ignore
          retention-days: 30

  kill-drill-real-infra:
    name: Credential-kill drill (REAL infra -- opt-in)
    # Opt-in rehearsal. Only runs on manual workflow_dispatch WITH the
    # run_real_drills input set to true. NEVER runs on the nightly cron
    # -- stopping the real warehouse + Lakebase is too disruptive to be
    # a scheduled event. Rehearse before rehearsals, not daily.
    #
    # continue-on-error is true because this is a rehearsal, not a
    # release gate: a red drill signals a real regression that an
    # operator must follow up on, but it should not block the other
    # nightly jobs from reporting green.
    if: github.event_name == 'workflow_dispatch' && inputs.run_real_drills == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_WAREHOUSE_ID: ${{ secrets.DATABRICKS_WAREHOUSE_ID }}
      LAKEBASE_INSTANCE_NAME: mip-app-state
      # Explicit allow-flag. The run_drill.sh script refuses to stop
      # real infra unless this is set OR --i-really-mean-it is passed.
      # Scope it to this job only; do NOT promote to workflow-env.
      MIP_KILL_DRILL_ALLOW_REAL: '1'
      MIP_APP_URL: ${{ secrets.MIP_APP_URL }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install jq + lsof
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq lsof
      - name: Fail fast on missing inputs
        run: |
          missing=""
          for v in DATABRICKS_HOST DATABRICKS_TOKEN DATABRICKS_WAREHOUSE_ID MIP_APP_URL; do
            if [ -z "${!v}" ]; then
              missing="$missing $v"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets for real-infra drill:$missing"
            exit 1
          fi
      # Each real-infra drill must complete stop+restart before the next
      # starts so we don't overlap outages. Sequential, not matrix.
      - name: Drill - warehouse-real (SDK stop/start)
        run: |
          bash tools/kill_drill/run_drill.sh \
            --target warehouse-real \
            --i-really-mean-it \
            --app-url "$MIP_APP_URL" \
            --await-seconds 180
      - name: Drill - lakebase-real (SDK stop/start)
        if: always()
        run: |
          bash tools/kill_drill/run_drill.sh \
            --target lakebase-real \
            --i-really-mean-it \
            --app-url "$MIP_APP_URL" \
            --await-seconds 180
      - name: Upload real-infra evidence logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kill-drill-real-infra-evidence
          path: tools/kill_drill/evidence/
          if-no-files-found: warn
          retention-days: 90

  genie-fuzz-deep:
    name: Genie deep fuzz (200 examples/family)
    # Workflow-dispatch only: this burns ~90 min of real Genie quota
    # (3 families × 200 examples × ~5s avg response + 4s pacing). Kept
    # off the standard nightly cron so it never runs unexpectedly and
    # never eats into the primary live-UC budget. Release-engineer
    # fires it from the Actions UI ahead of a major release, or on an
    # incident re-run. The 45-min timeout is deliberate: one family at
    # 200 × ~9s ≈ 30 min, so the budget fits one family per run plus
    # the coverage assertion. The deep tests share the
    # `_ADVERSARIAL_TEMPLATE_HITS` counter in-process, so a single
    # pytest invocation collects coverage for all three families.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_WAREHOUSE_ID: ${{ secrets.DATABRICKS_WAREHOUSE_ID }}
      GENIE_SPACE_ID: ${{ secrets.GENIE_SPACE_ID }}
      # 200 examples/family is the spec. An operator who wants a
      # smaller targeted rerun can override this via the Actions UI's
      # "Run workflow" dialog (after wiring up an input), or by forking
      # the workflow. The _resolve_examples helper clamps to [1, 1000].
      MIP_GENIE_FUZZ_EXAMPLES: '200'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Hypothesis is a `.[fuzz]` extra; install it explicitly here
          # in case requirements.txt drops the pin.
          pip install "hypothesis>=6.123,<7"
      - name: Fail fast if required secrets are missing
        run: |
          missing=""
          for v in DATABRICKS_HOST DATABRICKS_TOKEN GENIE_SPACE_ID; do
            if [ -z "${!v}" ]; then
              missing="$missing $v"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets:$missing"
            exit 1
          fi
      - name: Run deep Genie fuzz
        # `-m genie_fuzz_deep` selects only the 200-example variants
        # plus the template-coverage assertion. The standard 15-example
        # tests stay in the `integration` mark and are not re-run here.
        run: pytest -m genie_fuzz_deep tests/integration/test_genie_fuzz.py -q
      - name: Upload fuzz failure artefacts
        # `if: always()` so the artefacts upload even when the fuzz
        # run fails -- those are exactly the runs whose JSONL payload
        # the operator needs to replay.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: genie-fuzz-failures
          path: tests/integration/genie_fuzz_failures/
          if-no-files-found: ignore
          retention-days: 30

  notify-on-failure:
    name: File issue on failure
    needs: [parity-live, playwright-e2e-live, kill-drill-simulated, genie-fuzz-standard]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Create or update tracking issue
        uses: actions/github-script@v9
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `nightly: live-UC check failed on ${new Date().toISOString().slice(0, 10)}`;
            const body = [
              `Nightly real-UC workflow failed. Run: ${runUrl}`,
              '',
              '**Likely causes (in order):**',
              '- Databricks workspace credentials rotated (check repo secrets).',
              '- Serverless warehouse or Lakebase instance stopped.',
              '- `fn_*` UDF redeployed without fixture update (see `docs/runbook.md` §3).',
              '- Genie space deleted or its trusted-assets list pruned.',
              '',
              '**Triage:** docs/runbook.md §3 (parity-red) and §8 (CI failure triage).',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['ci-failure', 'nightly'],
            });
