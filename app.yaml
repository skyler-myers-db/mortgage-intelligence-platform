# Databricks App runtime entrypoint for Module 0.
#
# Command: uvicorn (via backend.runtime) honouring DATABRICKS_APP_PORT.
# Build:   the Apps build step runs `npm --prefix frontend ci && npm --prefix
#          frontend run build` (declared at the `build` key below) so the
#          React bundle lands at `frontend/dist/` and the FastAPI SPA
#          fallback at `backend/main.py` serves it at `/`.
# Env:     workspace identity + resource bindings (see databricks.yml
#          `resources.apps.mip_app.resources`) are surfaced here as env
#          vars. Backend reads them via backend/config/settings.py +
#          backend/services/{databricks_sql,lakebase,genie_client}.py.

# `backend.runtime` delegates to `uvicorn backend.main:app`, picking up
# DATABRICKS_APP_PORT / UVICORN_PORT from env. Exposing backend.main:app
# here makes the string-contract test explicit about what's served.
command:
  - python
  - -m
  - backend.runtime  # invokes uvicorn.run("backend.main:app", ...)

build: npm --prefix frontend ci && npm --prefix frontend run build

env:
  - name: APP_ENV
    value: sandbox

  # --------------------------------------------------------------------
  # Resource-derived env vars. `valueFrom` points at the resource name
  # declared in databricks.yml under resources.apps.mip_app.resources.
  # Databricks Apps resolves each ref at deploy time and injects the
  # corresponding value into the app's process env.
  # --------------------------------------------------------------------

  # Workspace host is auto-populated by the Databricks Apps runtime as
  # DATABRICKS_HOST. Do NOT set it here — hardcoding binds this bundle
  # to a specific workspace and breaks portability across targets
  # (raised by Copilot 2026-04-22). Backend reads the runtime value
  # via pydantic-settings + os.environ in backend/config/settings.py.

  # SQL warehouse id is surfaced from the `sql_warehouse` resource
  # binding. Our backend reads DATABRICKS_WAREHOUSE_ID (not the SDK's
  # stock DATABRICKS_SQL_WAREHOUSE_ID); we do BOTH so any tool
  # downstream that expects either name resolves.
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql_warehouse

  # Genie space id. The resource binding's value is the space_id.
  - name: GENIE_SPACE_ID
    valueFrom: genie_space

  # Lakebase DSN fragments. When the `database` resource is bound,
  # the runtime surfaces the host, user, and password through the
  # binding name. Backend composes the DSN from these four parts.
  # The resource binding exposes a single aggregated value that
  # psycopg-style clients can consume via the PGHOST env var name;
  # we also set LAKEBASE_* aliases that backend/services/lakebase.py
  # reads directly.
  - name: PGHOST
    valueFrom: database
  - name: LAKEBASE_HOST
    valueFrom: database

  # Product overrides. Pin the canonical catalog + schema so the
  # runtime does not inherit a stale name from an older workspace env.
  - name: MIP_DEFAULT_CATALOG
    value: mip
  - name: MIP_DEFAULT_SCHEMA
    value: gold

# Note: there is no MIP_MOCK_MODE runtime toggle (CLAUDE.md §8). The app
# runs against the live Unity Catalog / Lakebase path in every
# environment and fails visibly at process startup if any required
# credential is unavailable (backend/config/settings.py).
