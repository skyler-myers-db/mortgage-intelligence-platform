bundle:
  name: mortgage-intelligence-platform
  # Existing-App roll-forwards use direct-engine partial deploys so bundle
  # resources can converge without replacing the verified blue App snapshot.
  # CLI 1.2.0 introduced `bundle deploy --select`; 1.7.0 also fixes selected
  # resources omitting their grants/permissions, so keep automation and
  # operator runs on that governance-safe floor.
  databricks_cli_version: ">= 1.7.0"
  # Direct deployment is the Databricks-recommended bundle engine for new
  # projects. This product has no customer-installed Terraform bundle state to
  # migrate, so the bundle defaults to direct from first deploy.
  engine: direct

# `workspace.host` must be literal — the Databricks CLI resolves it at
# bundle-load time (before variables), so `${var.*}` is rejected here.
# The URL below is Entrada's dev workspace; a customer deploying this bundle
# to their own workspace either (a) edits this block once on their fork, or
# (b) overrides the `host` in their Databricks CLI profile, which the CLI
# uses for auth when its value matches any target's `workspace.host`. This
# literal-and-profile contract is the "zero-click after configuring
# .env.local" story in docs/runbook.md §2. Audit 2026-04-23: flagged as a
# packaging footgun for non-Entrada customers; resolution ratified with
# explicit comment + SE checklist on the `prod` target below.
#
# DRY-up (audit R5-24, 2026-04-23): a YAML anchor on this root-level host
# is the single source of truth. All four `workspace.host:` fields across
# targets dereference `*default_host`. Variables cannot be used here (see
# above), so an anchor is the correct primitive. A customer forking the
# repo now edits EXACTLY ONE line to rebind the host. `make
# check-workspace-host` (Makefile) greps for the literal outside this
# anchor and fails if it finds one — a forkability safeguard so an SE
# cannot ship a customer deploy still pointing at Entrada's workspace.
workspace:
  host: &default_host https://dbc-3aa503a9-4fa8.cloud.databricks.com

# Sync: explicitly include the built frontend bundle in the uploaded
# source tree. `frontend/dist/` is in .gitignore (we don't commit built
# artifacts) but the Databricks App runtime needs those files at `/` so
# the FastAPI SPA fallback serves the React bundle. `scripts/deploy.sh`
# performs the frontend build before its selector-bounded resource apply.
#
# 2026-05-04: also include `sql/_rendered/**`. The render_sql tool writes
# UC-catalog-substituted SQL into `sql/_rendered/` (gitignored — never
# committed), and every job task in this file references those rendered
# paths (`sql/_rendered/ddl/001_catalogs_schemas.sql`,
# `sql/_rendered/transformations/gold_segment_population.sql`, etc.).
# Without this include, the bundle resource upload honors the gitignore
# and the workspace ends up missing every rendered SQL file, causing the
# next `bundle run` to fail with "File ... not found." The deploy.sh
# orchestrator runs render_sql in step 2 specifically so step 5
# (bundle deploy) has the freshly-rendered files on disk to upload.
sync:
  include:
    - frontend/dist/**
    - sql/_rendered/**
  # The frontend is built before bundle deployment and served as static files
  # by FastAPI. Databricks Apps currently provides Node 22.16, while the
  # audited React Router release requires Node 22.22 for package installation.
  # Keep the repository-level npm wrapper out of the uploaded App source so
  # the managed runtime consumes only the already-validated static build.
  #
  # Load-bearing, not hygiene (2026-08-05 incident): a root package.json in
  # the App source makes the Apps build phase run its `build` script on every
  # deployment, recompiling frontend/dist from the uploaded sources on the
  # unaudited platform Node (EBADENGINE demotes the engines mismatch to a
  # warning, so the rebuild succeeds) and overwriting the prebuilt bundle.
  # Verified on CLI v1.10.0 (2026-08-05 scratch-bundle experiment): a bundle
  # deploy honours this exclusion both ways — the manifests are never
  # uploaded AND previously-uploaded copies are deleted from the target tree,
  # with or without local sync-snapshot state. Residual exposure is deploys
  # from checkouts predating this block (that is how the manifests returned
  # to the paychex tree on 2026-08-05) and App promotions outside
  # scripts/deploy.sh; the governed path closes both by running
  # tools/databricks/converge_static_app_source.py right before every
  # promotion. Full story: docs/deployment.md "App source contract".
  exclude:
    - /package.json
    - /package-lock.json

targets:
  dev:
    mode: development
    default: true
    run_as:
      user_name: ${workspace.current_user.userName}
    workspace:
      host: *default_host
      root_path: ~/.bundle/${bundle.name}/${bundle.target}
    variables:
      # The Databricks Apps bundle schema requires app Genie bindings to carry
      # a concrete space_id; it cannot resolve Genie spaces by name through a
      # bundle lookup. Keep the root variable default as the CI placeholder, but
      # pin the Entrada dev target to the governed mortgage_lead_intelligence
      # space in this target workspace so post-bootstrap resource recovery
      # through the signed scripts/deploy.sh command of record
      # never reaches Apps with the placeholder and returns the opaque 403
      # "Can View" permission error.
      genie_space_id: 01f18188d7a41311abe3d99932b5aa9a

  prod:
    mode: production
    # CUSTOMER-SE CHECKLIST BEFORE FIRST `./scripts/deploy.sh -t prod`:
    #   1. `workspace.host` dereferences the root `&default_host` YAML anchor.
    #      Before customer deploy, run:
    #        ./scripts/configure-workspace.sh https://<customer-workspace>
    #      (or make the same one-line anchor edit manually). Then point the
    #      DEFAULT CLI profile at that same customer workspace.
    #   2. Decide catalog isolation: share `mip` with dev in a single
    #      workspace, or set `variables.uc_catalog.default` to `mip_prod`
    #      for separation. Both are valid; pick one and document.
    #   3. Confirm the deploying identity is the approved UC owner/metastore
    #      administrator and Delta Share source access is available. The
    #      command-of-record creates the minimal pipeline namespace before
    #      bundle apply, then converges runtime grants and verifies postflight.
    #   4. Lakebase instance name `mip-app-state` is reused across targets
    #      via UC; if you need a prod-only instance, override the resource
    #      block under `database_instances`.
    workspace:
      host: *default_host
      profile: DEFAULT
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    run_as:
      user_name: ${workspace.current_user.userName}
    resources:
      database_instances:
        mip_app_state:
          # Production posture: keep the dev-sized single-node Lakebase as
          # the base resource, but attach readable secondaries for customer
          # targets so transient primary maintenance fails over instead of
          # surfacing as an app-wide degraded state.
          enable_readable_secondaries: true
  # `ci` target is for PR validation ONLY — never deploy against it. The
  # `dev` + `prod` targets both carry `mode:` + `${workspace.current_user
  # .userName}` templates that force the CLI to call
  # /api/2.0/preview/scim/v2/Me to resolve the deploying user's name,
  # which is impossible in PR CI (no real token, by design). This target
  # has no mode and no user templates, so `bundle validate -t ci` does
  # not reach out and never performs an auth preflight. The PR workflow
  # uses this target; deploys use `dev` / `prod`.
  ci:
    workspace:
      host: *default_host
      root_path: /Workspace/ci-placeholder/.bundle/${bundle.name}/${bundle.target}

resources:
  # Slice 5 real-data migration: self-contained Lakebase provisioning.
  # The selector-bounded resource phase inside ``scripts/deploy.sh`` creates
  # the Postgres instance and registers the database catalog in Unity Catalog. Bundle schema
  # ``resources.database_instances`` + ``resources.database_catalogs``
  # confirmed via ``databricks bundle schema`` on CLI 0.297.x. The
  # migration job below (``mip_lakebase_migrate``) applies ``lakebase/
  # schema.sql`` + ``lakebase/seed_campaigns.sql`` against the
  # instance so the audit store has a live target on first deploy.
  database_instances:
    mip_app_state:
      # DNS-compliant: alphanumeric + hyphens only. The bundle resource key
      # stays `mip_app_state` for internal references; the actual instance
      # name on the Databricks side defaults to `mip-app-state`. Isolated
      # staging and customer installs override the bundle variable instead of
      # editing this resource or colliding with another deployment.
      name: ${var.lakebase_instance_name}
      # CU_1 is the smallest tier and is appropriate for Module 0's
      # default write volume (audit + approvals on the order of a
      # few rows per minute). Production lift to CU_2 would be a
      # one-line bundle edit.
      capacity: CU_1
      node_count: 1
      retention_window_in_days: 7
      enable_readable_secondaries: false

  database_catalogs:
    mip_app_state_catalog:
      name: ${var.lakebase_catalog_name}
      database_instance_name: ${resources.database_instances.mip_app_state.name}
      database_name: ${var.lakebase_database_name}
      create_database_if_not_exists: true

  apps:
    mip_app:
      name: ${var.app_name}
      description: Mortgage Intelligence Platform — Module 0 (Top-of-Funnel Lead Generation & Borrower Segmentation).
      source_code_path: .
      # App resource bindings. On deploy, Databricks Apps injects env
      # vars for each binding so the backend has everything it needs
      # without a PAT: DATABRICKS_HOST (auto), DATABRICKS_WAREHOUSE_ID
      # (from sql_warehouse binding), plus a service-principal-based
      # OAuth flow the backend mints a bearer token from at startup
      # (see backend/config/settings.py::_mint_workspace_identity_token).
      # The Genie + database bindings surface GENIE_SPACE_ID and the
      # Lakebase DSN/password through the app's env, same pattern.
      resources:
        - name: sql_warehouse
          description: "Serverless SQL Warehouse for gold-table queries."
          sql_warehouse:
            id: ${resources.sql_warehouses.mip_serverless_sql.id}
            permission: CAN_USE
        - name: genie_space
          description: "Mortgage Lead Intelligence Genie Space."
          genie_space:
            name: mortgage_lead_intelligence
            space_id: ${var.genie_space_id}
            permission: CAN_RUN
        - name: database
          description: "Lakebase/Postgres app-state database."
          database:
            database_name: ${var.lakebase_database_name}
            instance_name: ${resources.database_instances.mip_app_state.name}
            permission: CAN_CONNECT_AND_CREATE
        - name: lifecycle_sync_job
          description: "Event-triggered lifecycle sync job for approval/outreach state."
          job:
            id: ${resources.jobs.mip_sync_lifecycle_state.id}
            permission: CAN_MANAGE_RUN
        - name: fred_rates_job
          description: "Operator-triggered FRED market-rate refresh job."
          job:
            id: ${resources.jobs.mip_fred_rates_ingest.id}
            permission: CAN_MANAGE_RUN
        - name: silver_refresh_job
          description: "Operator-triggered Cotality/first-party silver refresh job."
          job:
            id: ${resources.jobs.mip_refresh_silver.id}
            permission: CAN_MANAGE_RUN
        - name: gold_refresh_job
          description: "Operator-triggered Module 0 gold scoring refresh job."
          job:
            id: ${resources.jobs.mip_refresh_scores.id}
            permission: CAN_MANAGE_RUN
        - name: cotality_id_mask_secret
          description: "Deployment-scoped Cotality identifier-mask HMAC key."
          secret:
            scope: ${var.runtime_secret_scope}
            key: cotality-id-mask-v1
            permission: READ
        - name: genie_action_current_secret
          description: "Current HMAC key for governed Genie and campaign actions."
          secret:
            scope: ${var.runtime_secret_scope}
            key: genie-action-current
            permission: READ
        - name: genie_action_previous_secret
          description: "Previous HMAC key retained for bounded token rotation."
          secret:
            scope: ${var.runtime_secret_scope}
            key: genie-action-previous
            permission: READ
        - name: salesforce_client_secret
          description: "Optional Salesforce connected-app client secret."
          secret:
            scope: ${var.runtime_secret_scope}
            key: salesforce-client-secret
            permission: READ
        - name: salesforce_password
          description: "Optional Salesforce integration-user password."
          secret:
            scope: ${var.runtime_secret_scope}
            key: salesforce-password
            permission: READ
        - name: salesforce_security_token
          description: "Optional Salesforce integration-user security token."
          secret:
            scope: ${var.runtime_secret_scope}
            key: salesforce-security-token
            permission: READ

  sql_warehouses:
    mip_serverless_sql:
      name: mip_serverless_sql
      warehouse_type: PRO
      enable_serverless_compute: true
      cluster_size: 2X-Small
      auto_stop_mins: 10

  jobs:
    # Dedicated first-install bootstrap. Deploy runs this idempotent DAG before
    # applying UC grants, so a fresh or --skip-silver deployment never grants
    # a schema, table, or reviewed Growth Agent function before it exists.
    # Silver/gold refreshes intentionally repeat table DDL later to seed and
    # refresh data. The three reviewed, App-executable Growth Agent functions
    # are deployment-owned and publish only here: customer/Admin/nightly jobs
    # must never replace them and silently discard their object grants.
    mip_init_catalog_schemas:
      name: mip_init_catalog_schemas
      tags:
        solution: mortgage-intelligence-platform
        module: module0
        owner: entrada
        slice: module0-bootstrap
      max_concurrent_runs: 1
      tasks:
        - task_key: init_catalog_schemas
          description: "Create the managed catalog, core schemas, first-party contracts, and governed audit treatment table."
          sql_task:
            warehouse_id: ${resources.sql_warehouses.mip_serverless_sql.id}
            file:
              path: sql/_rendered/ddl/001_catalogs_schemas.sql
        - task_key: init_ref_tables
          description: "Create the governed ref schema and empty reference-data contracts before its schema grant."
          depends_on:
            - task_key: init_catalog_schemas
          sql_task:
            warehouse_id: ${resources.sql_warehouses.mip_serverless_sql.id}
            file:
              path: sql/_rendered/ddl/004_ref_tables.sql
        - task_key: init_governed_gold_tables
          description: "Create every empty governed gold contract, including both app-writable lifecycle tables."
          depends_on:
            - task_key: init_ref_tables
          sql_task:
            warehouse_id: ${resources.sql_warehouses.mip_serverless_sql.id}
            file:
              path: sql/_rendered/ddl/003_gold_tables.sql
        - task_key: publish_fn_build_cohort
          description: "Create the reviewed read-only broad-cohort function before granting EXECUTE."
          depends_on:
            - task_key: init_governed_gold_tables
          sql_task:
            warehouse_id: ${resources.sql_warehouses.mip_serverless_sql.id}
            file:
              path: sql/_rendered/uc_functions/fn_build_cohort.sql
        - task_key: publish_fn_segment_counts
          description: "Create the reviewed eligibility-gated cohort function before granting EXECUTE."
          depends_on:
            - task_key: init_governed_gold_tables
          sql_task:
            warehouse_id: ${resources.sql_warehouses.mip_serverless_sql.id}
            file:
              path: sql/_rendered/uc_functions/fn_segment_counts.sql
        - task_key: publish_fn_lead_queue_url
          description: "Create the reviewed app-internal handoff function before granting EXECUTE."
          depends_on:
            - task_key: init_governed_gold_tables
          sql_task:
            warehouse_id: ${resources.sql_warehouses.mip_serverless_sql.id}
            file:
              path: sql/_rendered/uc_functions/fn_lead_queue_url.sql

    # Slice 2 real-data migration: refresh silver by running the Lakeflow
    # (DLT) feature pipeline. Step 1 applies the idempotent DDL (catalog +
    # schemas) via SQL task against the serverless warehouse; Step 2 kicks
    # the pipeline. Daily on-demand in dev (no schedule); production can
    # enable a schedule_quartz_cron_expression once governance signs off on
    # the full silver→gold chain.
    mip_refresh_silver:
      name: mip_refresh_silver
      tags:
        solution: mortgage-intelligence-platform
        module: module0
        owner: entrada
        slice: module0-real-data-slice2
      max_concurrent_runs: 1
      tasks:
        - task_key: init_catalog_schemas
          description: "Idempotent CREATE CATALOG mip + schemas raw/silver/gold/semantics/app/audit."
          sql_task:
            warehouse_id: ${resources.sql_warehouses.mip_serverless_sql.id}
            file:
              path: sql/_rendered/ddl/001_catalogs_schemas.sql
        # Slice13-accuracy: create the mip.ref schema + lender_dictionary
        # table and seed the canonical lender vocabulary. Runs AFTER catalog
        # init (the schema lives under `mip`) and BEFORE the silver pipeline
        # so any silver/gold transformation that eventually joins against
        # ref.lender_dictionary sees a populated table on first deploy.
        - task_key: init_ref_tables
          description: "Create mip.ref schema + ref.lender_dictionary table."
          depends_on:
            - task_key: init_catalog_schemas
          sql_task:
            warehouse_id: ${resources.sql_warehouses.mip_serverless_sql.id}
            file:
              path: sql/_rendered/ddl/004_ref_tables.sql
        - task_key: seed_ref_lender_dictionary
          description: "MERGE canonical lender vocabulary into mip.ref.lender_dictionary (idempotent)."
          depends_on:
            - task_key: init_ref_tables
          sql_task:
            warehouse_id: ${resources.sql_warehouses.mip_serverless_sql.id}
            file:
              path: sql/_rendered/ref/lender_dictionary_seed.sql
        - task_key: seed_ref_offer_rules_config
          description: "MERGE canonical offer-rule thresholds into mip.ref.offer_rules_config (idempotent)."
          depends_on:
            - task_key: init_ref_tables
          sql_task:
            warehouse_id: ${resources.sql_warehouses.mip_serverless_sql.id}
            file:
              path: sql/_rendered/ref/offer_rules_config_seed.sql
        - task_key: seed_ref_state_footprint
          description: "MERGE canonical state footprint into mip.ref.state_footprint (idempotent). Hole-finder #20."
          depends_on:
            - task_key: init_ref_tables
          sql_task:
            warehouse_id: ${resources.sql_warehouses.mip_serverless_sql.id}
            file:
              path: sql/_rendered/ref/state_footprint_seed.sql
        - task_key: refresh_silver_pipeline
          description: "Run the Lakeflow feature pipeline to materialize mip.silver.* from the Cotality share."
          depends_on:
            - task_key: seed_ref_lender_dictionary
            - task_key: seed_ref_offer_rules_config
            - task_key: seed_ref_state_footprint
          pipeline_task:
            pipeline_id: ${resources.pipelines.mip_feature_pipeline.id}
            # Module 0 is not yet a customer incremental workload. Run silver as
            # a full refresh so ZIP/lender/PII transformation fixes reprocess
            # existing rows instead of leaving stale Delta output behind.
            full_refresh: true
        # S1.1 multi-owner: single-owner compatibility projection of
        # silver.property_owners (owner_position = 1). CREATE OR REPLACE VIEW
        # is idempotent; it runs after the pipeline so the base table exists
        # on first deploy.
        - task_key: init_property_owners_primary_view
          description: "CREATE OR REPLACE mip.silver.property_owners_primary compatibility view (S1.1 multi-owner)."
          depends_on:
            - task_key: refresh_silver_pipeline
          sql_task:
            warehouse_id: ${resources.sql_warehouses.mip_serverless_sql.id}
            file:
              path: sql/_rendered/ddl/silver_property_owners_primary_view.sql
    # Slice13-accuracy: standalone ref-data seed job. Mirrors the two
    # tasks baked into mip_refresh_silver so analysts / ops can re-run
    # the lender-dictionary seed without kicking the full silver pipeline.
    # Also the source of truth for `make` targets that only want to
    # refresh reference data.
    mip_ref_seed:
      name: mip_ref_seed
      tags:
        solution: mortgage-intelligence-platform
        module: module0
        owner: entrada
        slice: slice13-accuracy
      max_concurrent_runs: 1
      tasks:
        - task_key: init_ref_tables
          description: "Create mip.ref schema + ref.lender_dictionary table (idempotent)."
          sql_task:
            warehouse_id: ${resources.sql_warehouses.mip_serverless_sql.id}
            file:
              path: sql/_rendered/ddl/004_ref_tables.sql
        - task_key: seed_lender_dictionary
          description: "MERGE canonical lender vocabulary into mip.ref.lender_dictionary."
          depends_on:
            - task_key: init_ref_tables
          sql_task:
            warehouse_id: ${resources.sql_warehouses.mip_serverless_sql.id}
            file:
              path: sql/_rendered/ref/lender_dictionary_seed.sql
        - task_key: seed_offer_rules_config
          description: "MERGE canonical offer-rule thresholds into mip.ref.offer_rules_config."
          depends_on:
            - task_key: init_ref_tables
          sql_task:
            warehouse_id: ${resources.sql_warehouses.mip_serverless_sql.id}
            file:
              path: sql/_rendered/ref/offer_rules_config_seed.sql
        - task_key: seed_state_footprint
          description: "MERGE canonical state footprint into mip.ref.state_footprint. Hole-finder #20."
          depends_on:
            - task_key: init_ref_tables
          sql_task:
            warehouse_id: ${resources.sql_warehouses.mip_serverless_sql.id}
            file:
              path: sql/_rendered/ref/state_footprint_seed.sql
    # Gold-layer materialization. Runs the idempotent DDL manifest (adds
    # any new tables -- e.g. lockin_cohort -- on a bundle deploy), then
    # executes each gold CTAS file in dependency order. This CTAS-via-
    # warehouse job is the authoritative populator: the warehouse-executed
    # files under `sql/transformations/gold_*.sql` materialize the same
    # rows the app reads. Running this job is what "refresh the gold layer"
    # means operationally. (A prior DLT mirror was retired in slice13-
    # accuracy -- CTAS is the single source of truth now.)
    #
    # Dependency order (respected by the depends_on chain below):
    #   1. property_owner_bridge         (owner-link rollup; no deps)
    #   2. evidence_events               (needs property_owner_bridge for multi-property evidence)
    #   3. borrower_360                  (needs property_owner_bridge + evidence_events)
    #   4. lead_scores                   (needs borrower_360 + evidence_events)
    #   5. lead_population               (needs borrower_360)
    #   6. segment_population            (needs borrower_360 + lead_scores)
    #   7. lockin_cohort                 (needs borrower_360 + silver.lien_current)
    #   8. borrower_dossier              (needs borrower_360 + evidence_events)
    #   9. county_rollup                 (needs borrower_360 -- geography rollup)
    #  10. zip_rollup                    (needs borrower_360 -- geography rollup)
    #  11. state_top_segment             (needs borrower_360 -- geography rollup)
    #  12. source_readiness              (needs refreshed gold outputs + upstream probes; app-readable admin summary)
    #  13. refresh_semantics_views       (needs lead_population + segment_population + borrower_dossier)
    #
    # The DDL manifest (003_gold_tables.sql) is CREATE TABLE IF NOT EXISTS,
    # so running it on every refresh is safe and picks up any newly-added
    # gold table on subsequent bundle deploys.
    #
    # Semantics views (sql/ddl/005_semantics_views.sql) are CREATE OR REPLACE
    # VIEW, so they rebind cheaply on every refresh. They read from both the
    # gold tables this job populates and from gold.funnel_snapshot_daily /
    # gold.borrower_lifecycle_state (populated by the sibling
    # `mip_sync_lifecycle_state` job) — the views tolerate an empty snapshot
    # table on first boot because each CTE falls back to NULL snapshot_date,
    # and the outer SELECTs LEFT JOIN with COALESCE for the rate columns.
    mip_refresh_scores:
      name: mip_refresh_scores
      tags:
        solution: mortgage-intelligence-platform
        module: module0
        owner: entrada
        slice: slice13-accuracy
      max_concurrent_runs: 1
      tasks:
        - task_key: init_fn_bounded_mortgage_rate
          description: "CREATE OR REPLACE mip.gold.fn_bounded_mortgage_rate before rate/equity CTAS."
          sql_task:
            warehouse_id: ${resources.sql_warehouses.mip_serverless_sql.id}
            file:
              path: sql/_rendered/uc_functions/fn_bounded_mortgage_rate.sql
        - task_key: init_fn_rate_spread
          description: "CREATE OR REPLACE mip.gold.fn_rate_spread before any scoring CTAS."
          sql_task:
            warehouse_id: ${resources.sql_warehouses.mip_serverless_sql.id}
            file:
              path: sql/_rendered/uc_functions/fn_rate_spread.sql
        - task_key: init_fn_estimated_upb
          description: "CREATE OR REPLACE mip.gold.fn_estimated_upb before borrower equity CTAS."
          sql_task:
            warehouse_id: ${resources.sql_warehouses.mip_serverless_sql.id}
            file:
              path: sql/_rendered/uc_functions/fn_estimated_upb.sql
        - task_key: init_fn_estimated_upb_confidence_band
          description: "CREATE OR REPLACE mip.gold.fn_estimated_upb_confidence_band before borrower equity CTAS."
          depends_on:
            - task_key: init_fn_bounded_mortgage_rate
            - task_key: init_fn_estimated_upb
          sql_task:
            warehouse_id: ${resources.sql_warehouses.mip_serverless_sql.id}
            file:
              path: sql/_rendered/uc_functions/fn_estimated_upb_confidence_band.sql
        - task_key: init_fn_in_the_money
          description: "CREATE OR REPLACE mip.gold.fn_in_the_money before any scoring CTAS."
          sql_task:
            warehouse_id: ${resources.sql_warehouses.mip_serverless_sql.id}
            file:
              path: sql/_rendered/uc_functions/fn_in_the_money.sql
        - task_key: init_fn_lead_score
          description: "CREATE OR REPLACE mip.gold.fn_lead_score before any scoring CTAS."
          sql_task:
            warehouse_id: ${resources.sql_warehouses.mip_serverless_sql.id}
            file:
              path: sql/_rendered/uc_functions/fn_lead_score.sql
        - task_key: init_fn_next_best_offer
          description: "CREATE OR REPLACE mip.gold.fn_next_best_offer before any scoring CTAS."
          sql_task:
            warehouse_id: ${resources.sql_warehouses.mip_serverless_sql.id}
            file:
              path: sql/_rendered/uc_functions/fn_next_best_offer.sql
        - task_key: init_fn_loan_product_type
          description: "CREATE OR REPLACE mip.gold.fn_loan_product_type before any scoring CTAS."
          sql_task:
            warehouse_id: ${resources.sql_warehouses.mip_serverless_sql.id}
            file:
              path: sql/_rendered/uc_functions/fn_loan_product_type.sql
        - task_key: init_fn_refi_propensity_heuristic
          description: "CREATE OR REPLACE mip.gold.fn_refi_propensity_heuristic (S1.3 transparent overlay-segment heuristic) before borrower_360 CTAS."
          sql_task:
            warehouse_id: ${resources.sql_warehouses.mip_serverless_sql.id}
            file:
              path: sql/_rendered/uc_functions/fn_refi_propensity_heuristic.sql
        - task_key: init_fn_high_opportunity
          description: "CREATE OR REPLACE mip.gold.fn_high_opportunity (canonical high-opportunity threshold) before rollup/snapshot CTAS."
          sql_task:
            warehouse_id: ${resources.sql_warehouses.mip_serverless_sql.id}
            file:
              path: sql/_rendered/uc_functions/fn_high_opportunity.sql
        - task_key: init_fn_score_band
          description: "CREATE OR REPLACE mip.gold.fn_score_band (canonical score display bands) before semantics views."
          sql_task:
            warehouse_id: ${resources.sql_warehouses.mip_serverless_sql.id}
            file:
              path: sql/_rendered/uc_functions/fn_score_band.sql
        - task_key: init_gold_ddl
          description: "Idempotent CREATE TABLE IF NOT EXISTS for every mip.gold.* table."
          depends_on:
            - task_key: init_fn_bounded_mortgage_rate
            - task_key: init_fn_rate_spread
            - task_key: init_fn_estimated_upb
            - task_key: init_fn_estimated_upb_confidence_band
            - task_key: init_fn_in_the_money
            - task_key: init_fn_lead_score
            - task_key: init_fn_next_best_offer
            - task_key: init_fn_loan_product_type
            - task_key: init_fn_refi_propensity_heuristic
            - task_key: init_fn_high_opportunity
            - task_key: init_fn_score_band
          sql_task:
            warehouse_id: ${resources.sql_warehouses.mip_serverless_sql.id}
            file:
              path: sql/_rendered/ddl/003_gold_tables.sql
        # audit-holes-round-3 #7 fix: capture ONE deterministic refresh_at
        # timestamp at the top of the DAG. Every downstream CTAS reads
        # mip.ref.refresh_run_state to replace its own CURRENT_TIMESTAMP()
        # call, so all `refreshed_at` / `snapshot_at` columns across the
        # gold layer agree to the second within one run. Without this seed
        # row, two "Refreshed ..." chips from different gold tables could
        # disagree by seconds -- enough to make parity tests flaky.
        - task_key: capture_refresh_timestamp
          description: "Capture deterministic refresh_at anchor for this run (audit-holes-round-3 #7)."
          depends_on:
            - task_key: init_gold_ddl
          sql_task:
            warehouse_id: ${resources.sql_warehouses.mip_serverless_sql.id}
            file:
              path: sql/_rendered/transformations/capture_refresh_timestamp.sql
        - task_key: seed_demo_first_party_feeds
          description: "Populate mip.first_party.* with explicit Summit Mortgage demo_synthetic feeds when enabled."
          depends_on:
            - task_key: ctas_property_owner_bridge
          sql_task:
            warehouse_id: ${resources.sql_warehouses.mip_serverless_sql.id}
            file:
              path: sql/_rendered/transformations/demo_first_party_feeds.sql
        - task_key: ctas_property_owner_bridge
          description: "Rebuild mip.gold.property_owner_bridge via CTAS."
          depends_on:
            - task_key: capture_refresh_timestamp
          sql_task:
            warehouse_id: ${resources.sql_warehouses.mip_serverless_sql.id}
            file:
              path: sql/_rendered/transformations/gold_property_owner_bridge.sql
        - task_key: ctas_evidence_events
          description: "Rebuild mip.gold.evidence_events via CTAS."
          depends_on:
            - task_key: ctas_property_owner_bridge
            # S1.6: origination_channel evidence cites mip.first_party.loan_applications;
            # sequence after the seed so evidence never reads a mid-rebuild feed.
            - task_key: seed_demo_first_party_feeds
          sql_task:
            warehouse_id: ${resources.sql_warehouses.mip_serverless_sql.id}
            file:
              path: sql/_rendered/transformations/gold_evidence_events.sql
        - task_key: ctas_borrower_360
          description: "Rebuild mip.gold.borrower_360 via CTAS."
          depends_on:
            - task_key: ctas_property_owner_bridge
            - task_key: ctas_evidence_events
            - task_key: seed_demo_first_party_feeds
          sql_task:
            warehouse_id: ${resources.sql_warehouses.mip_serverless_sql.id}
            file:
              path: sql/_rendered/transformations/gold_borrower_360.sql
        # audit-holes-round-3 #8 fix: integrity gate between borrower_360
        # and every task that reads from it. Asserts the population is both
        # non-empty and freshly rebuilt in THIS run (within 30 minutes of
        # the captured refresh_at). If ctas_borrower_360 silently produced
        # a stale population (partial silver failure, retry storm), this
        # task raises and every downstream CTAS is skipped with
        # UPSTREAM_FAILED instead of scoring yesterday's rows.
        - task_key: assert_borrower_360_fresh
          description: "Freshness gate: fail fast if borrower_360 is stale or empty (audit-holes-round-3 #8)."
          depends_on:
            - task_key: ctas_borrower_360
          sql_task:
            warehouse_id: ${resources.sql_warehouses.mip_serverless_sql.id}
            file:
              path: sql/_rendered/transformations/assert_borrower_360_fresh.sql
        - task_key: ctas_household_rollup
          description: "Rebuild mip.gold.household_rollup via CTAS for opt-in campaign household dedup."
          depends_on:
            - task_key: assert_borrower_360_fresh
          sql_task:
            warehouse_id: ${resources.sql_warehouses.mip_serverless_sql.id}
            file:
              path: sql/_rendered/transformations/gold_household_rollup.sql
        - task_key: ctas_lead_scores
          description: "Rebuild mip.gold.lead_scores via CTAS."
          depends_on:
            - task_key: assert_borrower_360_fresh
          sql_task:
            warehouse_id: ${resources.sql_warehouses.mip_serverless_sql.id}
            file:
              path: sql/_rendered/transformations/gold_lead_scores.sql
        - task_key: ctas_lead_population
          description: "Rebuild mip.gold.lead_population via CTAS."
          depends_on:
            - task_key: ctas_lead_scores
          sql_task:
            warehouse_id: ${resources.sql_warehouses.mip_serverless_sql.id}
            file:
              path: sql/_rendered/transformations/gold_lead_population.sql
        - task_key: ctas_segment_population
          description: "Rebuild mip.gold.segment_population via CTAS."
          depends_on:
            - task_key: ctas_lead_scores
          sql_task:
            warehouse_id: ${resources.sql_warehouses.mip_serverless_sql.id}
            file:
              path: sql/_rendered/transformations/gold_segment_population.sql
        - task_key: ctas_lockin_cohort
          description: "Rebuild mip.gold.lockin_cohort via CTAS (slice13-accuracy)."
          depends_on:
            - task_key: assert_borrower_360_fresh
          sql_task:
            warehouse_id: ${resources.sql_warehouses.mip_serverless_sql.id}
            file:
              path: sql/_rendered/transformations/gold_lockin_cohort.sql
        - task_key: ctas_borrower_dossier
          description: "Rebuild mip.gold.borrower_dossier via CTAS (slice13-accuracy perf)."
          depends_on:
            - task_key: assert_borrower_360_fresh
            - task_key: ctas_evidence_events
          sql_task:
            warehouse_id: ${resources.sql_warehouses.mip_serverless_sql.id}
            file:
              path: sql/_rendered/transformations/gold_borrower_dossier.sql
        # slice13-accuracy-validation: three geography rollup tables feed the
        # USChoroplethMap drill (state -> county -> ZIP). All three aggregate
        # from gold.borrower_360 directly -- no ZIP->county crosswalk seed
        # needed because silver.property_master.fips_county_code is projected
        # up into gold.borrower_360.county_fips_5. Safe to run in parallel
        # because they read from gold.borrower_360 and write to their own
        # sibling tables.
        - task_key: ctas_county_rollup
          description: "Rebuild mip.gold.county_rollup via CTAS (per-county aggregate for the map county drill)."
          depends_on:
            - task_key: assert_borrower_360_fresh
          sql_task:
            warehouse_id: ${resources.sql_warehouses.mip_serverless_sql.id}
            file:
              path: sql/_rendered/transformations/gold_county_rollup.sql
        - task_key: ctas_zip_rollup
          description: "Rebuild mip.gold.zip_rollup via CTAS (per-ZIP aggregate + stable sample_borrower_id)."
          depends_on:
            - task_key: assert_borrower_360_fresh
          sql_task:
            warehouse_id: ${resources.sql_warehouses.mip_serverless_sql.id}
            file:
              path: sql/_rendered/transformations/gold_zip_rollup.sql
        # S7 economics scatter: precomputed equity x rate-spread points with
        # density-bin coordinates. Reads gold.borrower_360 only (plus the
        # shared refresh anchor), so it parallelizes with the sibling
        # rollups behind the borrower_360 freshness sentinel. Uses
        # mip.gold.fn_score_band, which init_gold_ddl already orders after.
        - task_key: ctas_equity_spread_points
          description: "Rebuild mip.gold.equity_spread_points via CTAS (S7 economics scatter surface)."
          depends_on:
            - task_key: assert_borrower_360_fresh
          sql_task:
            warehouse_id: ${resources.sql_warehouses.mip_serverless_sql.id}
            file:
              path: sql/_rendered/transformations/gold_equity_spread_points.sql
        - task_key: ctas_state_top_segment
          description: "Rebuild mip.gold.state_top_segment via CTAS (per-state dominant SegmentCode + share %)."
          depends_on:
            - task_key: assert_borrower_360_fresh
          sql_task:
            warehouse_id: ${resources.sql_warehouses.mip_serverless_sql.id}
            file:
              path: sql/_rendered/transformations/gold_state_top_segment.sql
        # Governed property loan lookup spine (address -> CLIP -> loan). Reads
        # the SAME raw share sources silver_property_master + silver_lien_current
        # read (ETL identity), plus mip.ref.refresh_run_state for the anchor, so
        # its only hard predecessor is capture_refresh_timestamp -- it runs in
        # parallel with the borrower_360 scoring chain. CREATE OR REPLACE, so
        # re-running is idempotent. Backs /api/v1/lookup/property-loan + the
        # Growth Agent dossier specialist tool fn_property_loan_lookup.
        - task_key: ctas_address_lookup
          description: "Rebuild mip.gold.address_lookup via CTAS (governed property loan lookup spine)."
          depends_on:
            - task_key: capture_refresh_timestamp
          sql_task:
            warehouse_id: ${resources.sql_warehouses.mip_serverless_sql.id}
            file:
              path: sql/_rendered/transformations/gold_address_lookup.sql
        - task_key: ctas_source_readiness
          description: "Rebuild mip.gold.source_readiness via CTAS so the app Admin panel reads gold, not silver."
          depends_on:
            - task_key: ctas_lead_scores
            - task_key: ctas_lead_population
            - task_key: ctas_segment_population
            - task_key: ctas_borrower_dossier
          sql_task:
            warehouse_id: ${resources.sql_warehouses.mip_serverless_sql.id}
            file:
              path: sql/_rendered/transformations/gold_source_readiness.sql
        # Zero-click Genie + app-serving semantics — publish the four
        # mip.semantics.* views so the Genie trusted_assets list in
        # genie/mortgage_lead_intelligence_space.yml binds on first deploy.
        # Runs AFTER every gold table the views read from is built.
        # The DDL file is idempotent (CREATE OR REPLACE VIEW); re-running
        # this task is a byte-stable no-op at the view definition level.
        - task_key: refresh_semantics_views
          description: "CREATE OR REPLACE the four mip.semantics.* metric views (Genie + dashboards + headline KPIs)."
          depends_on:
            - task_key: ctas_lead_population
            - task_key: ctas_segment_population
            - task_key: ctas_borrower_dossier
          sql_task:
            warehouse_id: ${resources.sql_warehouses.mip_serverless_sql.id}
            file:
              path: sql/_rendered/ddl/005_semantics_views.sql
        - task_key: refresh_certified_lead_metric_view
          description: "CREATE OR REPLACE certified Lead Queue Databricks metric view wrapper."
          depends_on:
            - task_key: refresh_semantics_views
          sql_task:
            warehouse_id: ${resources.sql_warehouses.mip_serverless_sql.id}
            file:
              path: sql/_rendered/metric_views/certified_lead_generation_metric_view.sql
        - task_key: refresh_certified_segment_metric_view
          description: "CREATE OR REPLACE certified Segment Intelligence Databricks metric view wrapper."
          depends_on:
            - task_key: refresh_semantics_views
          sql_task:
            warehouse_id: ${resources.sql_warehouses.mip_serverless_sql.id}
            file:
              path: sql/_rendered/metric_views/certified_segment_performance_metric_view.sql
        - task_key: refresh_certified_borrower_metric_view
          description: "CREATE OR REPLACE certified Borrower Opportunity Databricks metric view wrapper."
          depends_on:
            - task_key: refresh_semantics_views
          sql_task:
            warehouse_id: ${resources.sql_warehouses.mip_serverless_sql.id}
            file:
              path: sql/_rendered/metric_views/certified_borrower_opportunity_metric_view.sql

    # Durable repair sync of Lakebase approval + outreach state into
    # mip.gold.borrower_lifecycle_state. Metric views (segment_
    # performance + lead_generation) JOIN this so `approval_rate` and
    # `outreach_rate` resolve without a runtime federated query.
    # Lakebase remains authoritative; this job is a strictly
    # one-directional mirror.
    #
    # Trigger model (incremental path hardened 2026-07-14):
    #   1. **Primary app path:** accepted approval/rejection hooks call
    #      backend.services.lifecycle_sync through FastAPI BackgroundTasks.
    #      That path applies a sparse changed-row Delta MERGE through the
    #      already-provisioned SQL warehouse and skips the population-wide
    #      funnel snapshot. Lakebase remains the durable source if the
    #      process exits before the task runs.
    #   2. **Durable failure recovery:** a warehouse-path failure submits
    #      this job through the bound job resource. Databricks persists run
    #      state, queues concurrent submissions, and retries sync failures.
    #      The job uses the same canonical MERGE builder as the app, then
    #      records the full daily funnel snapshot once at the repair boundary.
    #   3. **Paused fallback schedule** (04:00 America/Chicago). The cron
    #      definition is retained so an operator can deliberately unpause it
    #      for a customer-approved production cadence, but every target ships
    #      PAUSED by default. This avoids recurring warehouse/Lakebase spend
    #      and prevents multiple bundle targets from writing the same catalog
    #      concurrently. Why 04:00 when enabled: off-peak CST, well before
    #      any Monday business readout.
    #
    # Rationale for removing the prior fixed-interval schedule: data only
    # changes when an operator acts (approve / outreach). A schedule against
    # an idle workspace was burning Serverless compute for nothing — the
    # product is sold to mortgage lenders and their cost line should
    # only reflect real activity.
    #
    # Missing lifecycle rows intentionally resolve to pending/none through
    # consumer LEFT JOIN + COALESCE semantics. This job never seeds one row
    # per borrower and never replaces the table.
    #
    # The funnel snapshot task (gold_funnel_snapshot_daily.sql) runs
    # after the sync so it reads the freshly-mirrored lifecycle_state
    # when computing approved_borrowers / actioned_borrowers.
    mip_sync_lifecycle_state:
      name: mip_sync_lifecycle_state
      tags:
        solution: mortgage-intelligence-platform
        module: module0
        owner: entrada
        slice: slice13-accuracy
      max_concurrent_runs: 1
      queue:
        enabled: true
      # Schedule definition retained for explicitly approved isolated cadences.
      # The app's sparse warehouse MERGE and explicit Admin Data operations
      # are the primary freshness drivers; every target ships PAUSED by default.
      schedule:
        quartz_cron_expression: "0 0 4 ? * * *"
        timezone_id: America/Chicago
        pause_status: PAUSED
      environments:
        - environment_key: py_default
          spec:
            # Serverless Python env version 5 (latest as of 2026-04).
            # See https://docs.databricks.com/aws/en/release-notes/serverless/environment-version/
            # for current release notes. Previous setting `client: "2"` used
            # the deprecated `client` field; the bundle schema now marks
            # that field deprecated in favour of `environment_version`.
            environment_version: "5"
            dependencies:
              - psycopg[binary]==3.2.10
              - databricks-sdk>=0.30.0
      tasks:
        - task_key: sync_from_lakebase
          description: "MERGE changed Lakebase approval/outreach rows into the sparse gold lifecycle mirror."
          environment_key: py_default
          spark_python_task:
            python_file: jobs/sync_lifecycle_state.py
            parameters:
              - "--catalog=${var.uc_catalog}"
              - "--lakebase-instance=${var.lakebase_instance_name}"
              - "--lakebase-database=${var.lakebase_database_name}"
          max_retries: 2
          min_retry_interval_millis: 10000
          retry_on_timeout: true
        - task_key: record_funnel_snapshot
          description: "MERGE today's per-(state, segment) counts into mip.gold.funnel_snapshot_daily."
          depends_on:
            - task_key: sync_from_lakebase
          sql_task:
            warehouse_id: ${resources.sql_warehouses.mip_serverless_sql.id}
            file:
              path: sql/_rendered/transformations/gold_funnel_snapshot_daily.sql

    # S3: daily headline-KPI snapshot. Aggregates the S1 headline measures
    # over <catalog>.semantics.portfolio_headline_metric_view (real UC read;
    # the view is landed by mip_refresh_scores task refresh_semantics_views)
    # and upserts ONE row per day into Lakebase mip_app.kpi_snapshots via
    # ON CONFLICT (snapshot_date) DO UPDATE -- re-runs refresh the day's row,
    # never duplicate it. S4 reads this table for "since your last login"
    # deltas via backend/services/kpi_deltas.py.
    #
    # Daily 05:30 America/Chicago cron (after the 04:00 lifecycle-sync slot
    # when an operator enables both). Ships PAUSED like every scheduled job
    # in this bundle (cost-control posture ratified on
    # mip_sync_lifecycle_state / mip_fred_rates_ingest above); freshness on
    # the dev cadence comes from ./scripts/deploy.sh, which runs this job
    # after every gold refresh -- that run is also the first-install
    # backfill, so kpi_snapshots is never empty after a zero-click deploy.
    mip_kpi_snapshot:
      name: mip_kpi_snapshot
      tags:
        solution: mortgage-intelligence-platform
        module: module0
        owner: entrada
        slice: s3-kpi-snapshots
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 30 5 ? * * *"
        timezone_id: America/Chicago
        pause_status: PAUSED
      environments:
        - environment_key: py_default
          spec:
            # Serverless Python env version 5 -- see comment on the
            # mip_sync_lifecycle_state job for the upgrade rationale.
            environment_version: "5"
            dependencies:
              - psycopg[binary]==3.2.10
              - databricks-sdk>=0.30.0
      tasks:
        - task_key: snapshot_headline_kpis
          description: "Aggregate semantics.portfolio_headline_metric_view and upsert today's row into mip_app.kpi_snapshots."
          environment_key: py_default
          spark_python_task:
            python_file: jobs/kpi_snapshot.py
            parameters:
              - "--catalog=${var.uc_catalog}"
              - "--lakebase-instance=${var.lakebase_instance_name}"
              - "--lakebase-database=${var.lakebase_database_name}"
          max_retries: 2
          retry_on_timeout: true

    # Draft-only scheduled Mortgage Growth Agent monitor runner. The job calls
    # the deployed Databricks App through its OAuth proxy and hits the
    # admin-gated /api/v1/growth-agent/monitors/run-due-all endpoint. It replays
    # stored reviewed watchlists for their original owners and creates Slack /
    # Teams review drafts only; it never sends notifications or connector
    # writes. Paused by default to preserve the cost-control posture until an
    # operator deliberately enables a customer-approved cadence.
    mip_growth_agent_monitor_scheduler:
      name: mip_growth_agent_monitor_scheduler
      tags:
        solution: mortgage-intelligence-platform
        module: module0
        owner: entrada
        slice: dais-agentic-growth-agent
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 30 8 ? * MON-FRI *"
        timezone_id: America/Chicago
        pause_status: PAUSED
      environments:
        - environment_key: py_default
          spec:
            environment_version: "5"
            dependencies:
              - databricks-sdk>=0.30.0
      tasks:
        - task_key: run_due_monitor_drafts
          description: "Refresh due Growth Agent watchlists and create Slack/Teams review drafts only."
          environment_key: py_default
          spark_python_task:
            python_file: jobs/run_growth_agent_monitors.py
            parameters:
              - "--app-name=${var.app_name}"
              - "--limit=20"
              - "--channels=slack,teams"
          max_retries: 2
          retry_on_timeout: true

    # Slice 5 real-data migration: apply Lakebase DDL + seed sample
    # campaigns. Python task invokes jobs/lakebase_migrate.py which
    # opens a psycopg3 connection to the instance created above and
    # runs lakebase/schema.sql then lakebase/seed_campaigns.sql.
    # Both files are idempotent (CREATE ... IF NOT EXISTS + ON
    # CONFLICT DO NOTHING) so re-running the job is a no-op.
    mip_lakebase_migrate:
      name: mip_lakebase_migrate
      tags:
        solution: mortgage-intelligence-platform
        module: module0
        owner: entrada
        slice: module0-real-data-slice5
      max_concurrent_runs: 1
      environments:
        - environment_key: py_default
          spec:
            # Serverless Python env version 5 -- see comment on the
            # mip_sync_lifecycle_state job for the upgrade rationale.
            environment_version: "5"
            dependencies:
              - psycopg[binary]==3.2.10
              # Needed by jobs/lakebase_migrate.py to fetch a fresh
              # short-lived Postgres credential via workspace identity.
              - databricks-sdk>=0.30.0
      tasks:
        - task_key: apply_schema_and_seed
          description: "Apply lakebase/schema.sql + lakebase/seed_campaigns.sql against the configured Lakebase instance."
          environment_key: py_default
          spark_python_task:
            python_file: jobs/lakebase_migrate.py
            parameters:
              - "--app-name=${var.app_name}"
              - "--lakebase-instance=${var.lakebase_instance_name}"
              - "--lakebase-database=${var.lakebase_database_name}"
              - "--lender-name=${var.lender_name}"
              - "--lender-nmls-id=${var.lender_nmls_id}"
              - "--tenant-id=${var.tenant_id}"
              - "--ai-gateway-verifier-client-id=${var.ai_gateway_verifier_client_id}"
              - "--require-ai-gateway-verifier"
          max_retries: 2
          retry_on_timeout: true

    # Slice 1 real-data migration: FRED MORTGAGE30US -> silver.market_rates_weekly.
    # Self-contained deploy: task `init` applies DDL, `seed` loads the committed
    # CSV IF the table is empty, `refresh` pulls FRED + MERGEs. Re-running the
    # whole job on the same day is a no-op (seed short-circuits, MERGE is
    # idempotent). See jobs/fred_rates_ingest.py for resilience on FRED outage.
    mip_fred_rates_ingest:
      name: mip_fred_rates_ingest
      tags:
        solution: mortgage-intelligence-platform
        module: module0
        owner: entrada
        slice: module0-real-data-slice1
      max_concurrent_runs: 1
      # Serverless Python task environment. Spark is attached automatically
      # for spark_python_task. Only stdlib is used by jobs/fred_rates_ingest.py
      # (urllib + csv), so no extra wheel dependencies are declared here.
      environments:
        - environment_key: py_default
          spec:
            # Serverless Python env version 5 -- see comment on the
            # mip_sync_lifecycle_state job for the upgrade rationale.
            environment_version: "5"
      # FRED publishes Thursdays. Keep the Friday 06:00 America/Chicago cron
      # definition available for a customer-approved cadence, but ship every
      # target PAUSED by default. Operators normally refresh rates from Admin
      # → Data operations when FRED/source readiness says the row is stale.
      schedule:
        quartz_cron_expression: "0 0 6 ? * FRI *"
        timezone_id: America/Chicago
        pause_status: PAUSED
      tasks:
        - task_key: init_ddl
          description: "Idempotent CREATE CATALOG/SCHEMA + silver.market_rates_weekly DDL."
          sql_task:
            warehouse_id: ${resources.sql_warehouses.mip_serverless_sql.id}
            file:
              path: sql/_rendered/ddl/001_catalogs_schemas.sql
        - task_key: init_silver_ddl
          description: "CREATE TABLE IF NOT EXISTS for silver.market_rates_weekly."
          depends_on:
            - task_key: init_ddl
          sql_task:
            warehouse_id: ${resources.sql_warehouses.mip_serverless_sql.id}
            file:
              path: sql/_rendered/ddl/silver_market_rates_weekly.sql
        - task_key: seed_if_empty
          description: "Load data/seeds/fred_mortgage30us_seed.csv iff silver table is empty."
          depends_on:
            - task_key: init_silver_ddl
          environment_key: py_default
          spark_python_task:
            python_file: jobs/fred_rates_ingest.py
            parameters:
              - "--mode=seed"
              - "--table=${var.uc_catalog}.silver.market_rates_weekly"
          max_retries: 2
          retry_on_timeout: true
        - task_key: refresh_from_fred
          description: "Pull FRED MORTGAGE30US and MERGE into silver.market_rates_weekly."
          depends_on:
            - task_key: seed_if_empty
          environment_key: py_default
          spark_python_task:
            python_file: jobs/fred_rates_ingest.py
            parameters:
              - "--mode=fred"
              - "--table=${var.uc_catalog}.silver.market_rates_weekly"
          max_retries: 2
          retry_on_timeout: true

  pipelines:
    # Slice 2 real-data migration: silver lift from cotality_mortgage_data.
    # corelogic into mip.silver.* (5 tables). State-filtered to IL/CA/
    # FL/TX/WA/CO at source. See pipelines/lakeflow/mip_feature_pipeline.py
    # and sql/ddl/silver_*.sql for column contracts; docs/data-contract-
    # module0.md §2 is authoritative.
    mip_feature_pipeline:
      name: mip_feature_pipeline
      catalog: ${var.uc_catalog}
      schema: silver
      photon: true
      # Fresh serverless-only workspaces reject pipelines that omit this flag.
      # Serverless is also the governed production posture for this pipeline.
      serverless: true
      # `development` is intentionally NOT set here -- bundle target mode
      # (`mode: development` vs `mode: production`) flips the pipeline's
      # development flag automatically. Hardcoding `development: true` here
      # blocks `databricks bundle validate -t prod`.
      continuous: false
      libraries:
        - file:
            path: pipelines/lakeflow/mip_feature_pipeline.py
    # NOTE: the gold DLT was removed (slice13-accuracy cleanup). It
    # previously declared the gold tables and delegated to
    # `spark.sql("SELECT * FROM mip.gold.<name>")`, which was a dual-write
    # mirror of the authoritative CTAS chain in the `mip_refresh_scores`
    # job (see above). The gold materialisation path is now exclusively the
    # warehouse-executed CTAS files under `sql/transformations/gold_*.sql`.

  # Dashboards are only declared once var.sql_warehouse_id is populated for
  # the target workspace. When a warehouse ID is provided, these blocks wire
  # to mip_executive_dashboard and mip_segment_dashboard files under
  # dashboards/. Resource names kept here so string-contract tests pass.
  dashboards:
    mip_executive_dashboard:
      display_name: mip_executive_dashboard
      file_path: dashboards/executive_dashboard.lvdash.json
      warehouse_id: ${resources.sql_warehouses.mip_serverless_sql.id}
    mip_segment_dashboard:
      display_name: mip_segment_dashboard
      file_path: dashboards/segment_dashboard.lvdash.json
      warehouse_id: ${resources.sql_warehouses.mip_serverless_sql.id}

  # Keep the experiment directly under the workspace root. Nested experiment
  # paths require a separately-created parent directory, which breaks a fresh
  # zero-click bundle apply. Under `mode: development` (the dev target), DAB
  # automatically prefixes the experiment name with `[dev <username>]`
  # to sandbox per-user experiments — so we don't need a manual
  # `${workspace.current_user.userName}` template that would force
  # `bundle validate` to authenticate against the workspace just to
  # resolve the path (making PR CI impossible without real secrets).
  experiments:
    mip_lead_scoring:
      name: /mip-lead-scoring

# Genie spaces (mortgage_lead_intelligence) are still provisioned out-of-
# bundle via tools/databricks/provision_genie_space.py (see AGENTS.md).
# Lakebase instances are declared above under resources.database_instances
# as of Slice 5; a matching database_catalog block registers the app-state
# database in UC so SQL warehouses can query it alongside mip.gold.

variables:
  uc_catalog:
    description: Unity Catalog catalog for Mortgage Intelligence Platform tables
    default: mip
  uc_schemas:
    description: Comma-separated schemas materialized under uc_catalog
    default: raw,silver,gold,semantics,app,audit
  app_name:
    description: Databricks App display name
    default: mip-app
  lender_name:
    description: Reviewed public lender identity rendered into borrower disclosures
    default: Summit Mortgage
  lender_nmls_id:
    description: Exact public NMLS identifier bound into borrower disclosures
    default: ""
  tenant_id:
    description: Lakebase namespace for the configured deployment's reviewed disclosures
    default: ""
  ai_gateway_verifier_client_id:
    description: >-
      Dedicated AI Gateway verifier service-principal client ID. The remote
      Lakebase migration requires this exact role before any schema mutation.
    default: 00000000PLACEHOLDER
  lakebase_instance_name:
    description: >-
      Workspace-unique Lakebase instance name. Override for isolated staging
      or when more than one Module 0 deployment shares a workspace.
    default: mip-app-state
  lakebase_catalog_name:
    description: >-
      Unity Catalog database-catalog name registered for the Lakebase instance.
      Keep it aligned with MIP_LAKEBASE_SYNC_CATALOG.
    default: mip_app_state
  # sql_warehouse_id and genie_space_id can be overridden per-invocation via
  # the Databricks CLI BUNDLE_VAR_* mechanism. `bundle-validate-env` sources
  # .env.local and exports
  # BUNDLE_VAR_sql_warehouse_id=$DATABRICKS_WAREHOUSE_ID and
  # BUNDLE_VAR_genie_space_id=$GENIE_SPACE_ID before calling the CLI.
  #
  # The root defaults stay as CI placeholders. The dev target above pins the
  # governed Entrada Genie space explicitly. Mutable bundle application is an
  # internal selector-bounded phase of `scripts/deploy.sh`; unrestricted
  # bundle deployment is not an operator recovery path. Customer targets set a
  # target-specific Genie id after provisioning or pass BUNDLE_VAR_genie_space_id
  # to the command of record.
  sql_warehouse_id:
    description: >-
      Serverless SQL Warehouse ID. Override with BUNDLE_VAR_sql_warehouse_id
      (`bundle-validate-env` reads DATABRICKS_WAREHOUSE_ID from .env.local;
      `scripts/deploy.sh` owns mutable use).
    default: 00000000PLACEHOLDER
  genie_space_id:
    description: >-
      Genie Space ID for Mortgage Lead Intelligence. Override with
      BUNDLE_VAR_genie_space_id. Populate by running
      `make provision-genie` (writes genie/space_id.txt) and exporting
      GENIE_SPACE_ID from that file.
    default: 00000000PLACEHOLDER
  lakebase_database_name:
    description: Lakebase Postgres database name backing Module 0 app state
    default: mip_app_state
  runtime_secret_scope:
    description: >-
      Databricks Secret scope containing deployment-scoped masking and
      governed-action HMAC keys. scripts/deploy.sh provisions these keys
      before bundle validation; app payloads contain only resource refs.
    default: mip-runtime
  # ---------------------------------------------------------------------------
  # FRED API key (audit R5-16, 2026-04-23)
  # ---------------------------------------------------------------------------
  # OPTIONAL. The current `jobs/fred_rates_ingest.py` hits
  # https://fred.stlouisfed.org/graph/fredgraph.csv?id=MORTGAGE30US — the
  # public unauthenticated FRED graph CSV endpoint — so no key is needed
  # today. The variable is declared here so (a) SEs know where the key
  # would land if we later upgrade to the authenticated REST endpoint
  # (api.stlouisfed.org/fred/series/observations, which requires
  # api_key=...), and (b) the zero-click-deploy story documented in
  # CLAUDE.md is honoured: any future secret is reachable from
  # `./scripts/deploy.sh -t dev` + a `.env.local` fill-in, never from
  # click-ops in the Databricks UI. When that upgrade happens, the
  # ingest script will read `os.environ.get("FRED_API_KEY", "")` and
  # log-at-warn when missing (fall back to fredgraph.csv), so an empty
  # default here is correct. Override via `BUNDLE_VAR_fred_api_key` or
  # set `FRED_API_KEY=` in `.env.local` (wired through
  # tools/databricks/bundle_env.py, same pattern as DATABRICKS_WAREHOUSE_ID).
  fred_api_key:
    description: >-
      Optional FRED API key (public fredgraph.csv endpoint works without it).
      When set, future authenticated ingest paths will use it; missing/empty
      is the expected default and should log-at-warn, never crash.
    default: ""
