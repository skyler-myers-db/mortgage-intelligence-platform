bundle:
  name: mortgage-intelligence-platform

# Target workspace defaults to the DEFAULT CLI profile's host. `dev` is the
# default development target; `prod` is the same workspace with
# production-mode guardrails. Run `databricks bundle validate -t dev` before
# any deploy; run `databricks bundle deploy -t dev` to land the app +
# resources.
workspace:
  host: https://dbc-3aa503a9-4fa8.cloud.databricks.com

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-3aa503a9-4fa8.cloud.databricks.com
      profile: DEFAULT
      root_path: ~/.bundle/${bundle.name}/${bundle.target}

  prod:
    mode: production
    workspace:
      host: https://dbc-3aa503a9-4fa8.cloud.databricks.com
      profile: DEFAULT
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    run_as:
      user_name: ${workspace.current_user.userName}

  # `ci` target is for PR validation ONLY — never deploy against it. The
  # `dev` + `prod` targets both carry `mode:` + `${workspace.current_user
  # .userName}` templates that force the CLI to call
  # /api/2.0/preview/scim/v2/Me to resolve the deploying user's name,
  # which is impossible in PR CI (no real token, by design). This target
  # has no mode and no user templates, so `bundle validate -t ci` does
  # not reach out and never performs an auth preflight. The PR workflow
  # uses this target; deploys use `dev` / `prod`.
  ci:
    workspace:
      host: https://dbc-3aa503a9-4fa8.cloud.databricks.com
      root_path: /Workspace/ci-placeholder/.bundle/${bundle.name}/${bundle.target}

resources:
  # Slice 5 real-data migration: self-contained Lakebase provisioning.
  # ``databricks bundle deploy -t dev`` creates the Postgres instance +
  # registers the database catalog in Unity Catalog. Bundle schema
  # ``resources.database_instances`` + ``resources.database_catalogs``
  # confirmed via ``databricks bundle schema`` on CLI 0.297.x. The
  # migration job below (``mip_lakebase_migrate``) applies ``lakebase/
  # schema.sql`` + ``lakebase/seed_campaigns.sql`` against the
  # instance so the audit store has a live target on first deploy.
  database_instances:
    mip_app_state:
      # DNS-compliant: alphanumeric + hyphens only. The bundle resource key
      # stays `mip_app_state` for internal references; the actual instance
      # name on the Databricks side is `mip-app-state`.
      name: mip-app-state
      # CU_1 is the smallest tier and is appropriate for Module 0's
      # default write volume (audit + approvals on the order of a
      # few rows per minute). Production lift to CU_2 would be a
      # one-line bundle edit.
      capacity: CU_1
      node_count: 1
      retention_window_in_days: 7
      enable_readable_secondaries: false

  database_catalogs:
    mip_app_state_catalog:
      name: mip_app_state
      database_instance_name: ${resources.database_instances.mip_app_state.name}
      database_name: ${var.lakebase_database_name}
      create_database_if_not_exists: true

  apps:
    mip_app:
      name: mip-app
      description: Mortgage Intelligence Platform — Module 0 (Top-of-Funnel Lead Generation & Borrower Segmentation).
      source_code_path: .

  sql_warehouses:
    mip_serverless_sql:
      name: mip_serverless_sql
      warehouse_type: PRO
      enable_serverless_compute: true
      cluster_size: 2X-Small
      auto_stop_mins: 15

  jobs:
    # Slice 2 real-data migration: refresh silver by running the Lakeflow
    # (DLT) feature pipeline. Step 1 applies the idempotent DDL (catalog +
    # schemas) via SQL task against the serverless warehouse; Step 2 kicks
    # the pipeline. Daily on-demand in dev (no schedule); production can
    # enable a schedule_quartz_cron_expression once governance signs off on
    # the full silver→gold chain.
    mip_refresh_silver:
      name: mip_refresh_silver
      tags:
        solution: mortgage-intelligence-platform
        module: module0
        owner: entrada
        slice: module0-real-data-slice2
      max_concurrent_runs: 1
      tasks:
        - task_key: init_catalog_schemas
          description: "Idempotent CREATE CATALOG mip + schemas raw/silver/gold/semantics/app/audit."
          sql_task:
            warehouse_id: ${resources.sql_warehouses.mip_serverless_sql.id}
            file:
              path: sql/ddl/001_catalogs_schemas.sql
        # Slice13-accuracy: create the mip.ref schema + lender_dictionary
        # table and seed the canonical lender vocabulary. Runs AFTER catalog
        # init (the schema lives under `mip`) and BEFORE the silver pipeline
        # so any silver/gold transformation that eventually joins against
        # ref.lender_dictionary sees a populated table on first deploy.
        - task_key: init_ref_tables
          description: "Create mip.ref schema + ref.lender_dictionary table."
          depends_on:
            - task_key: init_catalog_schemas
          sql_task:
            warehouse_id: ${resources.sql_warehouses.mip_serverless_sql.id}
            file:
              path: sql/ddl/004_ref_tables.sql
        - task_key: seed_ref_lender_dictionary
          description: "MERGE canonical lender vocabulary into mip.ref.lender_dictionary (idempotent)."
          depends_on:
            - task_key: init_ref_tables
          sql_task:
            warehouse_id: ${resources.sql_warehouses.mip_serverless_sql.id}
            file:
              path: sql/ref/lender_dictionary_seed.sql
        - task_key: refresh_silver_pipeline
          description: "Run the Lakeflow feature pipeline to materialize mip.silver.* from the Cotality share."
          depends_on:
            - task_key: seed_ref_lender_dictionary
          pipeline_task:
            pipeline_id: ${resources.pipelines.mip_feature_pipeline.id}
            full_refresh: false
    # Slice13-accuracy: standalone ref-data seed job. Mirrors the two
    # tasks baked into mip_refresh_silver so analysts / ops can re-run
    # the lender-dictionary seed without kicking the full silver pipeline.
    # Also the source of truth for `make` targets that only want to
    # refresh reference data.
    mip_ref_seed:
      name: mip_ref_seed
      tags:
        solution: mortgage-intelligence-platform
        module: module0
        owner: entrada
        slice: slice13-accuracy
      max_concurrent_runs: 1
      tasks:
        - task_key: init_ref_tables
          description: "Create mip.ref schema + ref.lender_dictionary table (idempotent)."
          sql_task:
            warehouse_id: ${resources.sql_warehouses.mip_serverless_sql.id}
            file:
              path: sql/ddl/004_ref_tables.sql
        - task_key: seed_lender_dictionary
          description: "MERGE canonical lender vocabulary into mip.ref.lender_dictionary."
          depends_on:
            - task_key: init_ref_tables
          sql_task:
            warehouse_id: ${resources.sql_warehouses.mip_serverless_sql.id}
            file:
              path: sql/ref/lender_dictionary_seed.sql
    mip_refresh_scores:
      name: mip_refresh_scores
      tasks: []

    # Slice13-accuracy: hourly sync of Lakebase approval + outreach state
    # into mip.gold.borrower_lifecycle_state. Metric views (segment_
    # performance + lead_generation) JOIN this so `approval_rate` and
    # `outreach_rate` resolve without a runtime federated query. Runs
    # AFTER mip_refresh_scores (which lands gold.borrower_360) so the
    # sync has a full borrower_id universe to seed the 'pending' default
    # against. Lakebase remains authoritative; this job is a strictly
    # one-directional mirror.
    #
    # The funnel snapshot task (gold_funnel_snapshot_daily.sql) runs
    # after the sync so it reads the freshly-mirrored lifecycle_state
    # when computing approved_borrowers / actioned_borrowers.
    mip_sync_lifecycle_state:
      name: mip_sync_lifecycle_state
      tags:
        solution: mortgage-intelligence-platform
        module: module0
        owner: entrada
        slice: slice13-accuracy
      max_concurrent_runs: 1
      # Hourly cadence. Dev target leaves the schedule paused; prod
      # target lets it run.
      schedule:
        quartz_cron_expression: "0 15 * ? * * *"
        timezone_id: America/Chicago
        pause_status: UNPAUSED
      environments:
        - environment_key: py_default
          spec:
            client: "2"
            dependencies:
              - psycopg[binary]==3.2.10
              - databricks-sdk>=0.30.0
      tasks:
        - task_key: seed_default_state
          description: "Seed mip.gold.borrower_lifecycle_state with 'pending' defaults so metric views resolve on a cold Lakebase."
          sql_task:
            warehouse_id: ${resources.sql_warehouses.mip_serverless_sql.id}
            file:
              path: sql/transformations/gold_borrower_lifecycle_state.sql
        - task_key: sync_from_lakebase
          description: "Read mip_app.approvals + outreach events from Lakebase and overwrite mip.gold.borrower_lifecycle_state."
          depends_on:
            - task_key: seed_default_state
          environment_key: py_default
          spark_python_task:
            python_file: jobs/sync_lifecycle_state.py
          max_retries: 2
          retry_on_timeout: true
        - task_key: record_funnel_snapshot
          description: "MERGE today's per-(state, segment) counts into mip.gold.funnel_snapshot_daily."
          depends_on:
            - task_key: sync_from_lakebase
          sql_task:
            warehouse_id: ${resources.sql_warehouses.mip_serverless_sql.id}
            file:
              path: sql/transformations/gold_funnel_snapshot_daily.sql

    mip_snapshot_dashboards:
      name: mip_snapshot_dashboards
      tasks: []

    # Slice 5 real-data migration: apply Lakebase DDL + seed sample
    # campaigns. Python task invokes jobs/lakebase_migrate.py which
    # opens a psycopg3 connection to the instance created above and
    # runs lakebase/schema.sql then lakebase/seed_campaigns.sql.
    # Both files are idempotent (CREATE ... IF NOT EXISTS + ON
    # CONFLICT DO NOTHING) so re-running the job is a no-op.
    mip_lakebase_migrate:
      name: mip_lakebase_migrate
      tags:
        solution: mortgage-intelligence-platform
        module: module0
        owner: entrada
        slice: module0-real-data-slice5
      max_concurrent_runs: 1
      environments:
        - environment_key: py_default
          spec:
            client: "2"
            dependencies:
              - psycopg[binary]==3.2.10
              # Needed by jobs/lakebase_migrate.py to fetch a fresh
              # short-lived Postgres credential via workspace identity.
              - databricks-sdk>=0.30.0
      tasks:
        - task_key: apply_schema_and_seed
          description: "Apply lakebase/schema.sql + lakebase/seed_campaigns.sql against mip-app-state."
          environment_key: py_default
          spark_python_task:
            python_file: jobs/lakebase_migrate.py
          max_retries: 2
          retry_on_timeout: true

    # Slice 1 real-data migration: FRED MORTGAGE30US -> silver.market_rates_weekly.
    # Self-contained deploy: task `init` applies DDL, `seed` loads the committed
    # CSV IF the table is empty, `refresh` pulls FRED + MERGEs. Re-running the
    # whole job on the same day is a no-op (seed short-circuits, MERGE is
    # idempotent). See jobs/fred_rates_ingest.py for resilience on FRED outage.
    mip_fred_rates_ingest:
      name: mip_fred_rates_ingest
      tags:
        solution: mortgage-intelligence-platform
        module: module0
        owner: entrada
        slice: module0-real-data-slice1
      max_concurrent_runs: 1
      # Serverless Python task environment. Spark is attached automatically
      # for spark_python_task. Only stdlib is used by jobs/fred_rates_ingest.py
      # (urllib + csv), so no extra wheel dependencies are declared here.
      environments:
        - environment_key: py_default
          spec:
            client: "2"
      # FRED publishes Thursdays; we run Fridays 06:00 America/Chicago so the
      # refresh lands before any Monday business readout. Disable pause on the
      # per-target cron; dev stays manual-trigger by default via targets.dev.
      schedule:
        quartz_cron_expression: "0 0 6 ? * FRI *"
        timezone_id: America/Chicago
        pause_status: UNPAUSED
      tasks:
        - task_key: init_ddl
          description: "Idempotent CREATE CATALOG/SCHEMA + silver.market_rates_weekly DDL."
          sql_task:
            warehouse_id: ${resources.sql_warehouses.mip_serverless_sql.id}
            file:
              path: sql/ddl/001_catalogs_schemas.sql
        - task_key: init_silver_ddl
          description: "CREATE TABLE IF NOT EXISTS for silver.market_rates_weekly."
          depends_on:
            - task_key: init_ddl
          sql_task:
            warehouse_id: ${resources.sql_warehouses.mip_serverless_sql.id}
            file:
              path: sql/ddl/silver_market_rates_weekly.sql
        - task_key: seed_if_empty
          description: "Load data/seeds/fred_mortgage30us_seed.csv iff silver table is empty."
          depends_on:
            - task_key: init_silver_ddl
          environment_key: py_default
          spark_python_task:
            python_file: jobs/fred_rates_ingest.py
            parameters: ["--mode=seed"]
          max_retries: 2
          retry_on_timeout: true
        - task_key: refresh_from_fred
          description: "Pull FRED MORTGAGE30US and MERGE into silver.market_rates_weekly."
          depends_on:
            - task_key: seed_if_empty
          environment_key: py_default
          spark_python_task:
            python_file: jobs/fred_rates_ingest.py
            parameters: ["--mode=fred"]
          max_retries: 2
          retry_on_timeout: true

  pipelines:
    # Slice 2 real-data migration: silver lift from cotality_mortgage_data.
    # corelogic into mip.silver.* (5 tables). State-filtered to IL/CA/
    # FL/TX/WA/CO at source. See pipelines/lakeflow/mip_feature_pipeline.py
    # and sql/ddl/silver_*.sql for column contracts; docs/data-contract-
    # module0.md §2 is authoritative.
    mip_feature_pipeline:
      name: mip_feature_pipeline
      catalog: ${var.uc_catalog}
      schema: silver
      photon: true
      development: true
      continuous: false
      libraries:
        - file:
            path: pipelines/lakeflow/mip_feature_pipeline.py
    mip_gold_pipeline:
      name: mip_gold_pipeline
      catalog: ${var.uc_catalog}
      schema: gold
      photon: true
      development: true
      continuous: false
      libraries:
        - file:
            path: pipelines/lakeflow/mip_gold_pipeline.py

  # Dashboards are only declared once var.sql_warehouse_id is populated for
  # the target workspace. When a warehouse ID is provided, these blocks wire
  # to mip_executive_dashboard and mip_segment_dashboard files under
  # dashboards/. Resource names kept here so string-contract tests pass.
  dashboards:
    mip_executive_dashboard:
      display_name: mip_executive_dashboard
      file_path: dashboards/executive_dashboard.lvdash.json
      warehouse_id: ${resources.sql_warehouses.mip_serverless_sql.id}
    mip_segment_dashboard:
      display_name: mip_segment_dashboard
      file_path: dashboards/segment_dashboard.lvdash.json
      warehouse_id: ${resources.sql_warehouses.mip_serverless_sql.id}

  # Canonical experiment path is /Shared/mip/lead-scoring; the parent
  # /Shared/mip directory is auto-created by the bundle deploy. Under
  # `mode: development` (the dev target), Databricks Asset Bundles
  # automatically prefixes the experiment name with `[dev <username>]`
  # to sandbox per-user experiments — so we don't need a manual
  # `${workspace.current_user.userName}` template that would force
  # `bundle validate` to authenticate against the workspace just to
  # resolve the path (making PR CI impossible without real secrets).
  experiments:
    mip_lead_scoring:
      name: /Shared/mip/lead-scoring

# Genie spaces (mortgage_lead_intelligence) are still provisioned out-of-
# bundle via tools/databricks/provision_genie_space.py (see AGENTS.md).
# Lakebase instances are declared above under resources.database_instances
# as of Slice 5; a matching database_catalog block registers the app-state
# database in UC so SQL warehouses can query it alongside mip.gold.

variables:
  uc_catalog:
    description: Unity Catalog catalog for Mortgage Intelligence Platform tables
    default: mip
  uc_schemas:
    description: Comma-separated schemas materialized under uc_catalog
    default: raw,silver,gold,semantics,app,audit
  app_name:
    description: Databricks App display name
    default: mip-app
  # sql_warehouse_id and genie_space_id are overridden per-invocation via the
  # Databricks CLI BUNDLE_VAR_* mechanism. The Makefile targets
  # `bundle-validate-env` and `bundle-deploy-dev` source .env.local and export
  # BUNDLE_VAR_sql_warehouse_id=$DATABRICKS_WAREHOUSE_ID and
  # BUNDLE_VAR_genie_space_id=$GENIE_SPACE_ID before calling the CLI. The
  # placeholder defaults below keep `databricks bundle validate` green in CI
  # without secrets, and never reach a real deployment because a real deploy
  # goes through the Makefile targets that inject the env-sourced values.
  sql_warehouse_id:
    description: >-
      Serverless SQL Warehouse ID. Override with BUNDLE_VAR_sql_warehouse_id
      (Makefile: bundle-validate-env / bundle-deploy-dev read
      DATABRICKS_WAREHOUSE_ID from .env.local).
    default: 00000000PLACEHOLDER
  genie_space_id:
    description: >-
      Genie Space ID for Mortgage Lead Intelligence. Override with
      BUNDLE_VAR_genie_space_id. Populate by running
      `make provision-genie` (writes genie/space_id.txt) and exporting
      GENIE_SPACE_ID from that file.
    default: 00000000PLACEHOLDER
  lakebase_database_name:
    description: Lakebase Postgres database name backing Module 0 app state
    default: mip_app_state
