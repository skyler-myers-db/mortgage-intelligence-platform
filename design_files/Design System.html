<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="bright" data-density="comfortable">
<head>
<meta charset="UTF-8">
<title>Design System · Mortgage Intelligence Platform</title>
<meta name="viewport" content="width=1440">
<style>
/* === shared/tokens.css === */
/* ============================================================
   Entrada × Cotality × Databricks — Mortgage Intelligence Platform
   Design Tokens
   ============================================================ */

@import url('https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap');

:root {
  /* ---------- Brand (Entrada AI) ---------- */
  --entrada-navy:   #025080;
  --entrada-navy-900: #013354;
  --entrada-navy-800: #023F69;
  --entrada-navy-700: #025080;
  --entrada-bright: #66C5FF;
  --entrada-light:  #CFEFFF;
  --entrada-grey:   #B2BDC2;
  --entrada-teal:   #5CE1E6;

  /* ---------- Signal colors ---------- */
  --signal-success: #10B981;
  --signal-warning: #F59E0B;
  --signal-danger:  #EF4444;
  --signal-info:    #66C5FF;

  /* ---------- Segment palette (chips, map fills) ---------- */
  --seg-itm:        #5CE1E6;  /* In the Money — teal */
  --seg-listed:     #F59E0B;  /* Listed for Sale — amber */
  --seg-permit:     #A78BFA;  /* Permit Activity — violet */
  --seg-investor:   #F472B6;  /* Investor / Multi-Property — rose */
  --seg-equity:     #66C5FF;  /* Home Equity Candidate — bright blue */
  --seg-retention:  #34D399;  /* Retention — green */

  /* ---------- Typography ---------- */
  --font-sans: 'Geist', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace;

  --fs-11: 11px;
  --fs-12: 12px;
  --fs-13: 13px;
  --fs-14: 14px;
  --fs-16: 16px;
  --fs-18: 18px;
  --fs-22: 22px;
  --fs-28: 28px;
  --fs-36: 36px;
  --fs-48: 48px;

  --lh-tight: 1.15;
  --lh-snug:  1.35;
  --lh-body:  1.5;

  --tracking-tight: -0.02em;
  --tracking-body:  -0.005em;
  --tracking-caps:  0.08em;

  /* ---------- Spacing (4px base) ---------- */
  --sp-1:  4px;
  --sp-2:  8px;
  --sp-3:  12px;
  --sp-4:  16px;
  --sp-5:  20px;
  --sp-6:  24px;
  --sp-8:  32px;
  --sp-10: 40px;
  --sp-12: 48px;
  --sp-16: 64px;

  /* ---------- Radii ---------- */
  --r-sm: 4px;
  --r-md: 6px;
  --r-lg: 10px;
  --r-xl: 14px;
  --r-pill: 999px;

  /* ---------- Durations ---------- */
  --dur-fast: 120ms;
  --dur-base: 200ms;
  --dur-slow: 360ms;
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
}

/* ============================================================
   Theme: DARK (default — demo stage impact)
   ============================================================ */
:root, [data-theme="dark"] {
  --bg-0: #04101F;   /* page — deepest */
  --bg-1: #071A2F;   /* surface */
  --bg-2: #0C2340;   /* raised card */
  --bg-3: #123052;   /* hover / well */
  --bg-4: #1A3E68;   /* active */

  --bg-gradient: radial-gradient(1200px 800px at 15% -10%, rgba(2,80,128,0.55), transparent 60%),
                 radial-gradient(900px 700px at 110% 10%, rgba(92,225,230,0.10), transparent 55%),
                 linear-gradient(180deg, #04101F 0%, #061624 100%);

  --line-1: rgba(178,189,194,0.10);
  --line-2: rgba(178,189,194,0.18);
  --line-3: rgba(102,197,255,0.28);

  --text-1: #EAF3FA;  /* primary */
  --text-2: #BACBD8;  /* secondary */
  --text-3: #7F96A7;  /* tertiary */
  --text-4: #4E6578;  /* disabled */

  --chip-bg:   rgba(102,197,255,0.10);
  --chip-line: rgba(102,197,255,0.28);
  --chip-text: #CFEFFF;

  --accent:        #66C5FF;
  --accent-hover:  #8AD5FF;
  --accent-soft:   rgba(102,197,255,0.14);
  --accent-contrast: #02263F;

  --kpi-glow: 0 0 0 1px rgba(102,197,255,0.22), 0 12px 40px -12px rgba(92,225,230,0.25);
  --shadow-sm: 0 1px 0 rgba(255,255,255,0.03) inset, 0 1px 2px rgba(0,0,0,0.5);
  --shadow-md: 0 8px 24px -12px rgba(0,0,0,0.65);
  --shadow-lg: 0 24px 60px -20px rgba(0,0,0,0.7);
}

[data-theme="light"] {
  --bg-0: #F4F7FA;
  --bg-1: #FFFFFF;
  --bg-2: #FFFFFF;
  --bg-3: #F0F5F9;
  --bg-4: #E4EDF4;

  --bg-gradient: radial-gradient(1000px 700px at 10% -10%, rgba(2,80,128,0.06), transparent 55%),
                 radial-gradient(800px 600px at 110% 0%, rgba(92,225,230,0.08), transparent 55%),
                 linear-gradient(180deg, #F4F7FA 0%, #ECF2F7 100%);

  --line-1: rgba(2,80,128,0.08);
  --line-2: rgba(2,80,128,0.14);
  --line-3: rgba(2,80,128,0.28);

  --text-1: #021F34;
  --text-2: #254A66;
  --text-3: #5A7890;
  --text-4: #96ADBF;

  --chip-bg:   rgba(2,80,128,0.06);
  --chip-line: rgba(2,80,128,0.18);
  --chip-text: #025080;

  --accent:        #025080;
  --accent-hover:  #013354;
  --accent-soft:   rgba(2,80,128,0.08);
  --accent-contrast: #FFFFFF;

  --kpi-glow: 0 0 0 1px rgba(2,80,128,0.12), 0 12px 40px -16px rgba(2,80,128,0.25);
  --shadow-sm: 0 1px 2px rgba(2,31,52,0.06);
  --shadow-md: 0 8px 24px -12px rgba(2,31,52,0.14);
  --shadow-lg: 0 24px 60px -20px rgba(2,31,52,0.18);
}

/* ---------- Accent overrides applied at runtime ---------- */
[data-accent="red"] {
  --accent: #FF3621; --accent-hover: #FF5A47; --accent-soft: rgba(255,54,33,0.14); --accent-contrast: #FFF;
  --chip-bg: rgba(255,54,33,0.10); --chip-line: rgba(255,54,33,0.32); --chip-text: #FFB4A8;
}
[data-accent="teal"] {
  --accent: #5CE1E6; --accent-hover: #8CEEF2; --accent-soft: rgba(92,225,230,0.14); --accent-contrast: #02263F;
  --chip-bg: rgba(92,225,230,0.10); --chip-line: rgba(92,225,230,0.32); --chip-text: #BEF4F6;
}
[data-accent="bright"] {
  --accent: #66C5FF; --accent-hover: #8AD5FF; --accent-soft: rgba(102,197,255,0.14); --accent-contrast: #02263F;
}
[data-accent="navy"] {
  --accent: #025080; --accent-hover: #013354; --accent-soft: rgba(2,80,128,0.14); --accent-contrast: #FFF;
}

/* ---------- Density ---------- */
[data-density="compact"] {
  --row-h: 36px;
  --pad-card: 16px;
  --gap-grid: 14px;
}
[data-density="comfortable"], :root {
  --row-h: 44px;
  --pad-card: 20px;
  --gap-grid: 18px;
}

/* ============================================================
   Base element styles
   ============================================================ */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font-sans);
  color: var(--text-1);
  background: var(--bg-0);
  background-image: var(--bg-gradient);
  background-attachment: fixed;
  font-size: var(--fs-14);
  line-height: var(--lh-body);
  letter-spacing: var(--tracking-body);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
code, kbd, .mono { font-family: var(--font-mono); }

/* ---------- Focus ---------- */
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: var(--r-sm);
}

/* ---------- Scrollbar (subtle) ---------- */
* { scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
*::-webkit-scrollbar { width: 8px; height: 8px; }
*::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 999px; }
*::-webkit-scrollbar-track { background: transparent; }

/* ---------- Helpers ---------- */
.caps { text-transform: uppercase; letter-spacing: var(--tracking-caps); font-size: var(--fs-11); font-weight: 500; color: var(--text-3); }
.num  { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
.divider { height: 1px; background: var(--line-1); }
.vdivider { width: 1px; background: var(--line-1); }

/* === shared/components.css === */
/* Component-specific styles that complement tokens.css */

/* ============================================================
   APP SHELL
   ============================================================ */
.app-shell {
  display: grid;
  grid-template-columns: 72px 1fr;
  grid-template-rows: 56px 1fr;
  grid-template-areas:
    "rail topbar"
    "rail main";
  height: 100vh;
  width: 100vw;
  overflow: hidden;
}

/* Top bar */
.topbar {
  grid-area: topbar;
  display: flex;
  align-items: center;
  gap: var(--sp-4);
  padding: 0 var(--sp-5);
  background: color-mix(in oklab, var(--bg-1) 88%, transparent);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line-1);
  position: relative;
  z-index: 10;
}
.topbar__crumbs { display: flex; align-items: center; gap: var(--sp-2); color: var(--text-2); font-size: var(--fs-13); }
.topbar__crumbs .sep { color: var(--text-4); }
.topbar__crumbs .cur { color: var(--text-1); font-weight: 500; }
.topbar__spacer { flex: 1; }
.topbar__pill {
  display: inline-flex; align-items: center; gap: var(--sp-2);
  padding: 5px 10px; border-radius: var(--r-pill);
  background: var(--bg-3); border: 1px solid var(--line-1);
  font-size: var(--fs-12); color: var(--text-2);
}
.topbar__pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--signal-success); box-shadow: 0 0 8px var(--signal-success); }
.topbar__pill .dot.amber { background: var(--signal-warning); box-shadow: 0 0 8px var(--signal-warning); }
.topbar__icon-btn {
  width: 34px; height: 34px; border-radius: var(--r-md);
  display: grid; place-items: center;
  background: transparent; border: 1px solid var(--line-1); color: var(--text-2);
  cursor: pointer; transition: all var(--dur-fast) var(--ease);
}
.topbar__icon-btn:hover { background: var(--bg-3); color: var(--text-1); border-color: var(--line-2); }

/* Left rail */
.rail {
  grid-area: rail;
  display: flex; flex-direction: column; align-items: stretch;
  background: var(--bg-1);
  border-right: 1px solid var(--line-1);
  padding: var(--sp-3) var(--sp-2);
  gap: var(--sp-1);
}
.rail__brand {
  width: 56px; height: 56px; margin: 0 auto var(--sp-4);
  display: grid; place-items: center;
  border-radius: var(--r-lg);
  background: linear-gradient(135deg, var(--entrada-navy) 0%, #013354 100%);
  color: white;
  font-family: var(--font-mono); font-weight: 600; font-size: 11px; letter-spacing: 0.08em;
  position: relative; overflow: hidden;
}
.rail__brand::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(circle at 30% 20%, rgba(92,225,230,0.45), transparent 60%);
}
.rail__brand span { position: relative; z-index: 1; }
.rail__item {
  width: 56px; height: 56px; margin: 0 auto;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px;
  border-radius: var(--r-md);
  border: 1px solid transparent;
  color: var(--text-3);
  cursor: pointer;
  transition: all var(--dur-fast) var(--ease);
  background: transparent;
  position: relative;
}
.rail__item:hover { background: var(--bg-3); color: var(--text-1); }
.rail__item.is-active {
  background: var(--accent-soft);
  border-color: var(--chip-line);
  color: var(--accent);
}
.rail__item.is-active::before {
  content:''; position:absolute; left:-10px; top:14px; bottom:14px; width:3px;
  background: var(--accent); border-radius: 3px;
}
.rail__item .mod { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.06em; }
.rail__item .ico { font-size: 16px; }
.rail__spacer { flex: 1; }

/* Main */
.main {
  grid-area: main;
  overflow-y: auto;
  position: relative;
}
.main__inner {
  padding: var(--sp-6) var(--sp-6) var(--sp-12);
  max-width: 1440px;
}

/* ============================================================
   TYPOGRAPHY
   ============================================================ */
.h-display { font-size: var(--fs-36); font-weight: 600; letter-spacing: var(--tracking-tight); line-height: var(--lh-tight); color: var(--text-1); }
.h-1 { font-size: var(--fs-28); font-weight: 600; letter-spacing: var(--tracking-tight); line-height: var(--lh-tight); color: var(--text-1); margin: 0; }
.h-2 { font-size: var(--fs-22); font-weight: 600; letter-spacing: var(--tracking-tight); line-height: var(--lh-snug); color: var(--text-1); margin: 0; }
.h-3 { font-size: var(--fs-18); font-weight: 600; letter-spacing: var(--tracking-tight); line-height: var(--lh-snug); color: var(--text-1); margin: 0; }
.h-4 { font-size: var(--fs-14); font-weight: 600; letter-spacing: var(--tracking-body); color: var(--text-1); margin: 0; }
.eyebrow { font-size: var(--fs-11); font-weight: 500; letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--text-3); }
.body { color: var(--text-2); font-size: var(--fs-14); }
.muted { color: var(--text-3); }

/* ============================================================
   SURFACES
   ============================================================ */
.surface {
  background: var(--bg-2);
  border: 1px solid var(--line-1);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-sm);
}
.surface--elev { box-shadow: var(--shadow-md); }
.surface__hdr {
  display: flex; align-items: center; gap: var(--sp-3);
  padding: var(--sp-4) var(--pad-card);
  border-bottom: 1px solid var(--line-1);
}
.surface__body { padding: var(--pad-card); }
.surface__ft {
  padding: var(--sp-3) var(--pad-card);
  border-top: 1px solid var(--line-1);
  display: flex; align-items: center; gap: var(--sp-2);
  color: var(--text-3); font-size: var(--fs-12);
}

/* ============================================================
   BUTTONS
   ============================================================ */
.btn {
  display: inline-flex; align-items: center; gap: var(--sp-2);
  padding: 8px 14px; border-radius: var(--r-md);
  font-family: var(--font-sans); font-size: var(--fs-13); font-weight: 500;
  letter-spacing: var(--tracking-body);
  border: 1px solid var(--line-2); background: transparent; color: var(--text-1);
  cursor: pointer; transition: all var(--dur-fast) var(--ease);
  white-space: nowrap;
}
.btn:hover { background: var(--bg-3); border-color: var(--line-3); }
.btn--primary {
  background: var(--accent); color: var(--accent-contrast); border-color: transparent;
  box-shadow: 0 1px 0 rgba(255,255,255,0.15) inset, 0 4px 14px -4px var(--accent);
}
.btn--primary:hover { background: var(--accent-hover); }
.btn--ghost { border-color: transparent; color: var(--text-2); }
.btn--ghost:hover { color: var(--text-1); background: var(--bg-3); }
.btn--sm { padding: 5px 10px; font-size: var(--fs-12); border-radius: var(--r-sm); }
.btn--danger { color: var(--signal-danger); border-color: rgba(239,68,68,0.35); }
.btn--danger:hover { background: rgba(239,68,68,0.10); }
.btn--success { background: var(--signal-success); border-color: transparent; color: white; }

/* ============================================================
   CHIPS
   ============================================================ */
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 8px; border-radius: var(--r-pill);
  background: var(--chip-bg); border: 1px solid var(--chip-line);
  color: var(--chip-text); font-size: var(--fs-11); font-weight: 500;
  font-family: var(--font-mono); letter-spacing: 0.02em;
  white-space: nowrap;
}
.chip--neutral { background: var(--bg-3); border-color: var(--line-1); color: var(--text-2); }
.chip--success { background: rgba(16,185,129,0.12); border-color: rgba(16,185,129,0.35); color: #6EE7B7; }
.chip--warning { background: rgba(245,158,11,0.12); border-color: rgba(245,158,11,0.35); color: #FCD34D; }
.chip--danger  { background: rgba(239,68,68,0.12); border-color: rgba(239,68,68,0.35); color: #FCA5A5; }
[data-theme="light"] .chip--success { color: #047857; }
[data-theme="light"] .chip--warning { color: #B45309; }
[data-theme="light"] .chip--danger { color: #B91C1C; }

.chip .src-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }

/* Evidence chip — clickable, opens data source drawer */
.evidence-chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 2px 7px 2px 6px;
  border-radius: var(--r-sm);
  background: var(--chip-bg);
  border: 1px solid var(--chip-line);
  color: var(--chip-text);
  font-family: var(--font-mono);
  font-size: var(--fs-11); font-weight: 500;
  cursor: pointer;
  transition: all var(--dur-fast) var(--ease);
  letter-spacing: 0;
}
.evidence-chip:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.evidence-chip .e-ico { font-size: 9px; opacity: 0.7; }

/* ============================================================
   KPI CARD
   ============================================================ */
.kpi {
  position: relative;
  background: var(--bg-2);
  border: 1px solid var(--line-1);
  border-radius: var(--r-lg);
  padding: var(--pad-card);
  overflow: hidden;
  transition: all var(--dur-base) var(--ease);
}
.kpi::before {
  content: ''; position: absolute; inset: 0 0 auto 0; height: 1px;
  background: linear-gradient(90deg, transparent, var(--chip-line), transparent);
  opacity: 0.6;
}
.kpi:hover { border-color: var(--line-2); }
.kpi__label {
  font-size: var(--fs-11); font-weight: 500; letter-spacing: var(--tracking-caps);
  text-transform: uppercase; color: var(--text-3); margin-bottom: var(--sp-3);
}
.kpi__value {
  font-family: var(--font-sans); font-weight: 600;
  font-size: var(--fs-36); letter-spacing: var(--tracking-tight);
  color: var(--text-1); line-height: 1;
  font-variant-numeric: tabular-nums;
  display: flex; align-items: baseline; gap: var(--sp-2);
}
.kpi__unit { font-size: var(--fs-16); color: var(--text-3); font-weight: 500; }
.kpi__delta {
  display: inline-flex; align-items: center; gap: 4px;
  margin-top: var(--sp-3);
  font-size: var(--fs-12);
  color: var(--signal-success);
  font-family: var(--font-mono);
}
.kpi__delta.down { color: var(--signal-danger); }
.kpi__delta.flat { color: var(--text-3); }
.kpi__spark { position: absolute; right: 12px; bottom: 12px; opacity: 0.65; }
.kpi__source {
  margin-top: var(--sp-3); padding-top: var(--sp-3);
  border-top: 1px dashed var(--line-1);
  display: flex; align-items: center; gap: var(--sp-2);
  font-size: var(--fs-11); color: var(--text-3);
}

/* ============================================================
   SEGMENT CARD
   ============================================================ */
.seg-card {
  position: relative;
  background: var(--bg-2);
  border: 1px solid var(--line-1);
  border-radius: var(--r-lg);
  padding: var(--pad-card);
  cursor: pointer;
  transition: all var(--dur-base) var(--ease);
  overflow: hidden;
}
.seg-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: var(--seg-color, var(--accent));
  opacity: 0.9;
}
.seg-card::after {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(400px 200px at 100% -20%, color-mix(in oklab, var(--seg-color, var(--accent)) 22%, transparent), transparent 60%);
  opacity: 0.35; pointer-events: none;
}
.seg-card:hover { border-color: var(--line-2); transform: translateY(-1px); }
.seg-card.is-selected {
  border-color: var(--seg-color, var(--accent));
  box-shadow: 0 0 0 1px var(--seg-color, var(--accent)), 0 10px 30px -12px color-mix(in oklab, var(--seg-color, var(--accent)) 40%, transparent);
}
.seg-card__hdr { display: flex; align-items: center; gap: var(--sp-2); margin-bottom: var(--sp-3); }
.seg-card__badge {
  width: 26px; height: 26px; border-radius: 7px;
  display: grid; place-items: center;
  background: color-mix(in oklab, var(--seg-color, var(--accent)) 18%, transparent);
  color: var(--seg-color, var(--accent));
  font-size: 13px;
}
.seg-card__title { font-size: var(--fs-14); font-weight: 600; color: var(--text-1); }
.seg-card__count {
  font-family: var(--font-sans); font-weight: 600;
  font-size: var(--fs-28); letter-spacing: var(--tracking-tight);
  color: var(--text-1); font-variant-numeric: tabular-nums; line-height: 1;
}
.seg-card__sub { margin-top: 6px; font-size: var(--fs-12); color: var(--text-3); }
.seg-card__meta {
  display: flex; gap: var(--sp-3); margin-top: var(--sp-3);
  font-size: var(--fs-11); color: var(--text-3);
  font-family: var(--font-mono);
}
.seg-card__meta .up { color: var(--signal-success); }

/* ============================================================
   SCORE BADGE
   ============================================================ */
.score {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 9px 3px 6px;
  border-radius: var(--r-pill);
  font-family: var(--font-mono); font-weight: 600; font-size: var(--fs-12);

.score--med     { background: rgba(245,158,11,0.14); color: #FCD34D; border-color: rgba(245,158,11,0.32); }

/* ============================================================
   CONFIDENCE METER
   ============================================================ */
.conf {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--font-mono); font-size: var(--fs-11); color: var(--text-3);
}

.conf__bar { width: 3px; height: 10px; background: var(--line-2); border-radius: 1px; }
.conf__bar.on { background: var(--accent); }
.conf--high .conf__bar.on { background: var(--signal-success); }
.conf--med  .conf__bar.on { background: var(--signal-warning); }
.conf--low  .conf__bar.on { background: var(--signal-danger); }

/* ============================================================
   TRIGGER TIMELINE
   ============================================================ */
.trig {
  position: relative;
  padding-left: var(--sp-5);
}
.trig::before {
  content: ''; position: absolute; left: 7px; top: 4px; bottom: 4px; width: 1px;
  background: linear-gradient(180deg, var(--line-2), transparent);
}
.trig__item {
  position: relative;
  padding: 4px 0 10px;
}
.trig__item::before {
  content: ''; position: absolute; left: -17px; top: 8px;
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--bg-0);
  border: 2px solid var(--seg-color, var(--accent));
}
.trig__when { font-family: var(--font-mono); font-size: 10px; color: var(--text-3); letter-spacing: 0.04em; text-transform: uppercase; }
.trig__what { font-size: var(--fs-13); color: var(--text-1); font-weight: 500; margin-top: 2px; }
.trig__why  { font-size: var(--fs-12); color: var(--text-2); margin-top: 2px; }

/* ============================================================
   TABLE
   ============================================================ */
.tbl {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  font-size: var(--fs-13);
}
.tbl thead th {
  position: sticky; top: 0; z-index: 1;
  background: var(--bg-2);
  text-align: left; padding: var(--sp-3) var(--sp-4);
  font-size: var(--fs-11); font-weight: 500; letter-spacing: var(--tracking-caps);
  text-transform: uppercase; color: var(--text-3);
  border-bottom: 1px solid var(--line-1);
  white-space: nowrap;
}
.tbl td {
  padding: 0 var(--sp-4);
  height: var(--row-h);
  border-bottom: 1px solid var(--line-1);
  color: var(--text-2);
  vertical-align: middle;
}
.tbl tbody tr { cursor: pointer; transition: background var(--dur-fast) var(--ease); }
.tbl tbody tr:hover { background: var(--bg-3); }
.tbl tbody tr.is-expanded { background: var(--accent-soft); }
.tbl td.is-primary { color: var(--text-1); font-weight: 500; }
.tbl td.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.tbl__expand {
  background: var(--bg-1);
  padding: 0;
}
.tbl__expand-inner {
  padding: var(--sp-5);
  border-bottom: 1px solid var(--line-1);
}

/* ============================================================

   ============================================================ */
.approval {
  display: flex; align-items: center; gap: var(--sp-4);
  padding: var(--sp-3) var(--sp-4);
  border-radius: var(--r-lg);
  background: linear-gradient(90deg, rgba(245,158,11,0.08), rgba(245,158,11,0.02));
  border: 1px solid rgba(245,158,11,0.30);
  color: var(--text-1);
}

  width: 32px; height: 32px; border-radius: 8px;
  background: rgba(245,158,11,0.18); color: var(--signal-warning);

  flex: 0 0 auto;
}
.approval__body { flex: 1; min-width: 0; }
.approval__title { font-size: var(--fs-13); font-weight: 600; }
.approval__sub { font-size: var(--fs-12); color: var(--text-2); margin-top: 2px; }
.approval__actions { display: flex; gap: var(--sp-2); }

/* ============================================================
   DATA SOURCE DRAWER
   ============================================================ */
.drawer-scrim {
  position: fixed; inset: 0;
  background: rgba(2, 16, 31, 0.55);
  backdrop-filter: blur(2px);

  border-left: 1px solid var(--line-2);
  box-shadow: var(--shadow-lg);
  transform: translateX(100%);

  display: flex; flex-direction: column;
}

.drawer__hdr {

}

.drawer__close {

}

.lineage-node {
  padding: var(--sp-3) var(--sp-4);

.lineage-arrow { text-align: center; color: var(--text-4); font-family: var(--font-mono); font-size: 14px; padding: 2px 0; }

.genie__body { flex: 1; overflow-y: auto; padding: var(--sp-4); display: flex; flex-direction: column; gap: var(--sp-3); }

}

.typing-dots { display: inline-flex; gap: 3px; padding: 6px 0; }

  display: flex; flex-wrap: wrap; gap: var(--sp-2) var(--sp-3);

    border: 1px solid var(--line-1);
    border-radius: var(--r-lg);
    overflow: hidden;
  }
  .comp__hdr {
    padding: 12px 16px; border-bottom: 1px solid var(--line-1);
    display: flex; justify-content: space-between; align-items: center;
    background: var(--bg-1);
  }
  .comp__hdr .t { font-size: 13px; font-weight: 600; }
  .comp__hdr .c { font-family: var(--font-mono); font-size: 11px; color: var(--text-3); }
  .comp__body {
    padding: 28px 24px;
    display: flex; align-items: center; justify-content: center; min-height: 140px;
    background:
      linear-gradient(var(--line-1) 1px, transparent 1px) 0 0 / 16px 16px,
      linear-gradient(90deg, var(--line-1) 1px, transparent 1px) 0 0 / 16px 16px,
      var(--bg-2);
    background-position: center;
  }
  .comp__notes { padding: 12px 16px; border-top: 1px dashed var(--line-1); color: var(--text-3); font-size: 12px; }

  /* Layout grid diagram */
  .layout-diag {
    display: grid;
    grid-template-columns: 72px 1fr 300px;
    grid-template-rows: 56px 180px 1fr 100px;
    grid-template-areas:
      "rail topbar topbar"
      "rail hero hero"
      "rail main right"
      "rail main right";
    gap: 10px;
    height: 520px;
    padding: 16px;
    background: var(--bg-1);
    border: 1px solid var(--line-1);
    border-radius: var(--r-lg);
  }
  .ld {
    background: var(--bg-3);
    border: 1px dashed var(--line-2);
    border-radius: var(--r-md);
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    color: var(--text-3); font-family: var(--font-mono); font-size: 11px;
    text-align: center; padding: 8px;
  }
  .ld strong { color: var(--text-1); font-size: 12px; font-weight: 600; display: block; margin-bottom: 2px; }
  .ld--accent { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .ld--rail { grid-area: rail; writing-mode: vertical-rl; transform: rotate(180deg); }
  .ld--top  { grid-area: topbar; }
  .ld--hero { grid-area: hero; }
  .ld--main { grid-area: main; }
  .ld--right{ grid-area: right; }

  /* Principles */
  .principle {
    padding: 20px 22px;
    background: var(--bg-2);
    border: 1px solid var(--line-1);
    border-radius: var(--r-lg);
    position: relative;
  }
  .principle::before {
    content: ''; position: absolute; left: 0; top: 20px; bottom: 20px; width: 3px;
    background: var(--accent); border-radius: 0 3px 3px 0;
  }
  .principle .num {
    font-family: var(--font-mono); font-size: 11px; color: var(--accent); letter-spacing: 0.1em;
  }
  .principle .h { font-size: 16px; font-weight: 600; margin: 4px 0 6px; color: var(--text-1); }
  .principle .b { font-size: 13px; color: var(--text-2); line-height: 1.55; }

  /* Accessibility checklist */
  .a11y-row {
    display: grid; grid-template-columns: 28px 1fr 120px;
    padding: 12px 0; align-items: center; gap: 12px;
    border-bottom: 1px solid var(--line-1);
  }
  .a11y-row .ico {
    width: 22px; height: 22px; border-radius: 6px;
    background: rgba(16,185,129,0.14); color: #6EE7B7;
    display: grid; place-items: center;
  }
  [data-theme="light"] .a11y-row .ico { color: #047857; }
  .a11y-row .what { font-size: 13px; color: var(--text-1); font-weight: 500; }
  .a11y-row .what .d { color: var(--text-2); font-weight: 400; font-size: 12px; margin-top: 2px; }
  .a11y-row .ratio { font-family: var(--font-mono); font-size: 11px; color: var(--text-3); text-align: right; }

  /* Motion demo */
  .motion-card {
    background: var(--bg-2); border: 1px solid var(--line-1); border-radius: var(--r-lg);
    padding: 18px 20px;
  }
  .motion-card .h { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  .motion-card .sub { font-size: 12px; color: var(--text-3); margin-bottom: 12px; }
  .motion-card code { background: var(--bg-3); padding: 2px 6px; border-radius: 4px; font-size: 11px; color: var(--accent); }

  /* Stack context */
  .stack { display: flex; flex-direction: column; gap: 14px; }
  .row-flex { display:flex; gap: 10px; flex-wrap: wrap; align-items: center; }

  /* Segment inventory */
  .seg-inv { display:grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
  @media (max-width: 1200px) { .seg-inv { grid-template-columns: repeat(3, 1fr); } }

  .theme-toggle {
    display: inline-flex; background: var(--bg-2); border: 1px solid var(--line-1); border-radius: var(--r-md);
    padding: 3px; gap: 2px;
  }
  .theme-toggle button {
    border: 0; background: transparent; padding: 5px 12px; border-radius: 4px;
    color: var(--text-2); font-size: 12px; font-family: var(--font-sans); cursor: pointer;
  }
  .theme-toggle button.is-active { background: var(--accent-soft); color: var(--accent); }
</style>
</head>

/* ============================================================
   APP CONTEXT — theme, accent, density, lender, toggles
   ============================================================ */
const AppCtx = createContext(null);
const useApp = () => useContext(AppCtx);

function AppProvider({ children, initial = {} }) {
  const [theme, setTheme] = useState(initial.theme || 'dark');
  const [accent, setAccent] = useState(initial.accent || 'bright'); // bright | teal | navy | red
  const [density, setDensity] = useState(initial.density || 'comfortable');
  const [font, setFont] = useState(initial.font || 'geist');
  const [lender, setLender] = useState(initial.lender || 'Harbor Mortgage Co.');
  const [showEvidence, setShowEvidence] = useState(true);
  const [showConfidence, setShowConfidence] = useState(true);
  const [tweaksOpen, setTweaksOpen] = useState(false);
  const [drawer, setDrawer] = useState(null); // {title, signals}
  const [genieOpen, setGenieOpen] = useState(false);
  const [auditLog, setAuditLog] = useState([
    { id: 1, t: '10:24:07', kind: 'sys',  what: 'Session started on Databricks One', who: 'System' },
    { id: 2, t: '10:24:31', kind: 'load', what: 'Loaded Cotality Public Records (Deed & Mortgage) via Delta Share', who: 'Pipeline' },
  ]);

  useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
    document.documentElement.setAttribute('data-accent', accent);
    document.documentElement.setAttribute('data-density', density);
    document.documentElement.style.setProperty('--font-sans',
      font === 'inter' ? "'Inter', system-ui, sans-serif"
      : font === 'general' ? "'General Sans', 'Geist', sans-serif"
      : "'Geist', ui-sans-serif, system-ui, sans-serif");
  }, [theme, accent, density, font]);

  const logAction = (entry) => setAuditLog((l) => [{ id: Date.now(), t: new Date().toLocaleTimeString('en-US',{hour12:false}), ...entry }, ...l]);

  const value = { theme, setTheme, accent, setAccent, density, setDensity, font, setFont,
    lender, setLender, showEvidence, setShowEvidence, showConfidence, setShowConfidence,
    tweaksOpen, setTweaksOpen, drawer, setDrawer, genieOpen, setGenieOpen,
    auditLog, logAction };
  return <AppCtx.Provider value={value}>{children}</AppCtx.Provider>;
}

/* ============================================================
   PRIMITIVES
   ============================================================ */
const Chip = ({ children, variant = '', icon }) => (
  <span className={`chip ${variant ? 'chip--' + variant : ''}`}>
    {icon && <Icon name={icon} size={10} />}
    {children}
  </span>
);

const EvidenceChip = ({ children, source, onClick }) => {
  const { setDrawer, showEvidence } = useApp();
  if (!showEvidence) return null;
  const handle = () => {
    if (onClick) onClick();
    else setDrawer(source);
  };
  return (
    <button className="evidence-chip" onClick={handle} title={`Source: ${source?.title || children}`}>
      <Icon name="link" size={9} className="e-ico" />
      {children}
    </button>
  );
};

const ScoreBadge = ({ value }) => {
  const tier = value >= 85 ? 'high' : value >= 65 ? 'med' : 'low';
  return (
    <span className={`score score--${tier}`}>
      <span className="score__dot" />
      {value}
    </span>
  );
};

const ConfidenceMeter = ({ value, compact }) => {
  const { showConfidence } = useApp();
  if (!showConfidence) return null;
  const filled = Math.round(value / 20);
  const tier = value >= 80 ? 'high' : value >= 60 ? 'med' : 'low';
  return (
    <span className={`conf conf--${tier}`}>
      <span className="conf__bars">
        {[0,1,2,3,4].map(i => <span key={i} className={`conf__bar ${i < filled ? 'on' : ''}`} />)}
      </span>
      {!compact && <span>{value}% conf.</span>}
    </span>
  );
};

const KPI = ({ label, value, unit, delta, deltaDir = 'up', source, spark }) => (
  <div className="kpi">
    <div className="kpi__label">{label}</div>
    <div className="kpi__value num">{value}{unit && <span className="kpi__unit">{unit}</span>}</div>
    {delta && (
      <div className={`kpi__delta ${deltaDir}`}>
        <Icon name={deltaDir === 'up' ? 'up' : deltaDir === 'down' ? 'down' : 'chevright'} size={11} />
        {delta}
      </div>
    )}
    {spark && <div className="kpi__spark">{spark}</div>}
    {source && (
      <div className="kpi__source">
        <Icon name="db" size={11} />
        <EvidenceChip source={source}>{source.short}</EvidenceChip>
      </div>
    )}
  </div>
);

const SegmentCard = ({ seg, selected, onClick }) => (
  <div className={`seg-card ${selected ? 'is-selected' : ''}`}
       style={{ '--seg-color': seg.color }}
       onClick={onClick}
       role="button" tabIndex={0}
       aria-pressed={selected}>
    <div className="seg-card__hdr">
      <div className="seg-card__badge"><Icon name={seg.icon} size={14} /></div>
      <div className="seg-card__title">{seg.name}</div>
    </div>
    <div className="seg-card__count num">{seg.count.toLocaleString()}</div>
    <div className="seg-card__sub">{seg.sub}</div>
    <div className="seg-card__meta">
      <span className="up">▲ {seg.delta}</span>
      <span>avg {seg.avgScore}</span>
      <span>{seg.window}</span>
    </div>
  </div>
);

const Button = ({ variant = '', size = '', children, icon, iconEnd, ...rest }) => (
  <button className={`btn ${variant ? 'btn--' + variant : ''} ${size ? 'btn--' + size : ''}`} {...rest}>
    {icon && <Icon name={icon} size={14} />}
    {children}
    {iconEnd && <Icon name={iconEnd} size={14} />}
  </button>
);

/* ============================================================
   APP SHELL: Rail + Topbar
   ============================================================ */
const MODULES = [
  { id: 0, name: 'Top-of-Funnel', icon: 'target',   short: 'M0' },
  { id: 1, name: 'Pipeline',      icon: 'flow',     short: 'M1' },
  { id: 2, name: 'Pricing',       icon: 'money',    short: 'M2' },
  { id: 3, name: 'Retention',     icon: 'shield',   short: 'M3' },
  { id: 4, name: 'Servicing',     icon: 'audit',    short: 'M4' },
];

const Rail = ({ activeModule = 0, onChange }) => (
  <nav className="rail" aria-label="Modules">
    <div className="rail__brand"><span>ENT</span></div>
    {MODULES.map(m => (
      <button key={m.id}
              className={`rail__item ${activeModule === m.id ? 'is-active' : ''}`}
              onClick={() => onChange && onChange(m.id)}
              aria-current={activeModule === m.id ? 'page' : undefined}
              title={`Module ${m.id}: ${m.name}`}>
        <Icon name={m.icon} size={18} className="ico" />
        <span className="mod">M{m.id}</span>
      </button>
    ))}
    <div className="rail__spacer" />
    <button className="rail__item" title="Settings"><Icon name="settings" size={16} /></button>
  </nav>
);

const TopBar = ({ crumbs = [], onTweaksToggle }) => {
  const { lender, theme, setTheme, setGenieOpen } = useApp();
  return (
    <header className="topbar" role="banner">
      <div className="topbar__crumbs">
        <span className="mono" style={{color:'var(--text-3)', fontSize: 11, letterSpacing: '0.06em'}}>WORKSPACE /</span>
        <span>entrada-mortgage-ai</span>
        <span className="sep">/</span>
        {crumbs.map((c, i) => (
          <React.Fragment key={i}>
            <span className={i === crumbs.length - 1 ? 'cur' : ''}>{c}</span>
            {i < crumbs.length - 1 && <span className="sep">/</span>}
          </React.Fragment>
        ))}
      </div>
      <div className="topbar__spacer" />
      <div className="topbar__pill" title="Demo lender">
        <Icon name="building" size={12} />
        <span>{lender}</span>
      </div>
      <div className="topbar__pill" title="Environment: sandbox">
        <span className="dot amber" />
        <span>demo.sandbox</span>
      </div>
      <div className="topbar__pill" title="Databricks warehouse: running">
        <span className="dot" />
        <span style={{fontFamily: 'var(--font-mono)'}}>serverless-xl</span>
      </div>
      <button className="topbar__icon-btn" onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')} title="Toggle theme">
        <Icon name={theme === 'dark' ? 'sun' : 'moon'} size={15} />
      </button>
      <button className="topbar__icon-btn" onClick={() => setGenieOpen(o => !o)} title="Ask Genie">
        <Icon name="sparkle" size={15} />
      </button>
      <button className="topbar__icon-btn" onClick={onTweaksToggle} title="Tweaks">
        <Icon name="tweak" size={15} />
      </button>
    </header>
  );
};

/* ============================================================
   DATA SOURCE DRAWER
   ============================================================ */
const DataSourceDrawer = () => {
  const { drawer, setDrawer } = useApp();
  const open = !!drawer;
  const d = drawer || {};
  return (
    <>
      <div className={`drawer-scrim ${open ? 'is-open' : ''}`} onClick={() => setDrawer(null)} />
      <aside className={`drawer ${open ? 'is-open' : ''}`} aria-hidden={!open} aria-label="Data source">
        <div className="drawer__hdr">
          <div style={{display:'grid', placeItems:'center', width:32, height:32, background:'var(--accent-soft)', color:'var(--accent)', borderRadius: 8}}>
            <Icon name="db" size={16}/>
          </div>
          <div>
            <div style={{fontSize: 13, fontWeight: 600}}>Data source & lineage</div>
            <div style={{fontSize: 11, color:'var(--text-3)'}}>{d.title || '—'}</div>
          </div>
          <button className="drawer__close" onClick={() => setDrawer(null)} aria-label="Close"><Icon name="close" size={14} /></button>
        </div>
        <div className="drawer__body">
          {d.description && <p className="body" style={{marginTop:0}}>{d.description}</p>}
          <div className="eyebrow" style={{marginTop: 16, marginBottom: 8}}>Lineage</div>
          {(d.lineage || []).map((n, i) => (
            <React.Fragment key={i}>
              <div className="lineage-node">
                <div className="lineage-node__label">{n.layer}</div>
                <div className="lineage-node__name">{n.name}</div>
                {n.meta && <div style={{fontSize: 11, color:'var(--text-3)', marginTop: 4}}>{n.meta}</div>}
              </div>

  'How many in-the-money borrowers in Travis County?',

];

const GenieChat = ({ onSourceClick }) => {
  const { genieOpen, setGenieOpen, lender, logAction } = useApp();
  const [msgs, setMsgs] = useState([
    { who: 'ai', text: `Hi — I'm Genie, grounded on ${lender}'s Unity Catalog metric views + Cotality semantic models. Ask about borrower segments, triggers, or evidence.`, sources: [] },
  ]);
  const [input, setInput] = useState('');
  const [typing, setTyping] = useState(false);
  const bodyRef = useRef(null);

  useEffect(() => { if (bodyRef.current) bodyRef.current.scrollTop = bodyRef.current.scrollHeight; }, [msgs, typing, genieOpen]);

  const ask = (q) => {
    if (!q.trim()) return;
    const userMsg = { who: 'user', text: q };
    setMsgs((m) => [...m, userMsg]);
    setInput('');
    setTyping(true);
    logAction({ kind: 'genie', what: `Asked Genie: "${q}"`, who: 'Dana K. (LO Ops)' });
    setTimeout(() => {
      const answer = answerFor(q);
      setMsgs((m) => [...m, { who: 'ai', ...answer }]);
      setTyping(false);
    }, 900);
  };

  const answerFor = (q) => {
    const lower = q.toLowerCase();
    if (lower.includes('travis') || lower.includes('in the money') || lower.includes('itm')) {
      return {
        text: '4,812 borrowers in Travis County currently satisfy In-the-Money criteria: lien rate ≥ 75 bps above current refi par and ≥ 15% equity on latest AVM. Average score 82. 3-month trend +18%.',
        sources: [
          { label: 'Mortgage Market Analytics', short: 'MMA v2026.03' },
          { label: 'AVM', short: 'CLIP-AVM' },
          { label: 'Voluntary Lien', short: 'VL' },
        ],
      };
    }
    if (lower.includes('propens') || lower.includes('conversion')) {
      return {
        text: 'Home Equity Candidate segment has the highest modeled propensity at 11.4% expected contact→app, driven by prior HELOC behavior and permit activity. See MLflow model mtg_prop_v3 · AUROC 0.81.',
        sources: [{ label: 'MLflow model', short: 'mtg_prop_v3' }, { label: 'Building Permits', short: 'PERMIT' }],
      };
    }
    if (lower.includes('multi') || lower.includes('investor') || lower.includes('2+')) {
      return {
        text: '318 Owner Link IDs in scope own 2+ properties with at least one lien currently in the money. 41% are non-owner-occupied on the second property.',
        sources: [{ label: 'Owner Link', short: 'OwnerLink' }, { label: 'Public Records', short: 'PRD&M' }],
      };
    }
    return {
      text: 'I can answer that against Cotality public records, liens, listings, permits and AVM, joined with your lender configuration. I always cite evidence back to Unity Catalog tables — tap any chip to see lineage.',
      sources: [{ label: 'Unity Catalog metric views', short: 'UC.metrics' }],
    };
  };

  return (
    <>
      <button className={`genie__fab ${genieOpen ? 'is-hidden' : ''}`} onClick={() => setGenieOpen(true)} aria-label="Open Genie">
        <Icon name="sparkle" size={22} />
      </button>
      <div className={`genie ${genieOpen ? 'is-open' : ''}`} role="dialog" aria-label="Genie chat">
        <div className="genie__hdr">
          <div className="genie__avatar" />
          <div style={{flex:1}}>
            <div className="genie__title">Ask Genie</div>
            <div className="genie__sub">Grounded on UC metric views · {lender}</div>
          </div>
          <button className="drawer__close" onClick={() => setGenieOpen(false)} aria-label="Close"><Icon name="close" size={14} /></button>
        </div>
        <div className="genie__body" ref={bodyRef}>
          {msgs.map((m, i) => m.who === 'user' ? (
            <div key={i} className="genie__msg genie__msg--user">{m.text}</div>
          ) : (
            <div key={i} className="genie__msg genie__msg--ai">
              <div className="bubble">{m.text}</div>
              {m.sources && m.sources.length > 0 && (
                <div className="sources">
                  {m.sources.map((s, j) => (
                    <button key={j} className="evidence-chip" onClick={() => onSourceClick && onSourceClick(s)}>
                      <Icon name="link" size={9} className="e-ico" />{s.short}

            </div>
          ))}

                  <Icon name="sparkle" size={11} /> {s}
                </button>

            </div>

          <input value={input} onChange={(e) => setInput(e.target.value)} placeholder="Ask about borrowers, segments, triggers…" />
          <Button variant="primary" size="sm" type="submit" icon="send">Ask</Button>
        </form>
      </div>
    </>
  );
};

          <div className="shadow-card">
            <div className="eyebrow">Typography</div>
            <div className="h-3" style={{marginTop: 4}}>Geist · Geist Mono</div>
            <p className="body" style={{fontSize: 13, marginTop: 8, color:'var(--text-3)'}}>Sans for UI, mono for identifiers, rates, IDs, and anything the user needs to trust as "data."</p>
          </div>
        </div>
      </section>

      {/* 3 · COLOR */}
      <section className="section" id="color">
        <div className="eyebrow">Section 3</div>
        <h2>Color</h2>
        <p className="sub">Entrada brand tokens first. Neutrals are theme-dependent (see dark/light toggle above). Signal colors are identical across themes for accessibility continuity.</p>

        <div className="eyebrow" style={{marginTop: 24, marginBottom: 10}}>Brand</div>
        <div className="grid-4">
          {BRAND_COLORS.map(c => (
            <div key={c.name} className="swatch">
              <div className="swatch__color" style={{background: c.hex}} />
              <div className="swatch__meta">
                <div className="swatch__name">{c.name}</div>
                <div className="swatch__hex">{c.hex}</div>
                <div className="swatch__role">{c.role}</div>
              </div>
            </div>
          ))}
        </div>

        <div className="eyebrow" style={{marginTop: 32, marginBottom: 10}}>Signal</div>
        <div className="grid-4">
          {SIGNAL_COLORS.map(c => (
            <div key={c.name} className="swatch">
              <div className="swatch__color" style={{background: c.hex}} />
              <div className="swatch__meta">
                <div className="swatch__name">{c.name}</div>
                <div className="swatch__hex">{c.hex}</div>
                <div className="swatch__role">{c.role}</div>
              </div>
            </div>
          ))}
        </div>

        <div className="eyebrow" style={{marginTop: 32, marginBottom: 10}}>Segment palette</div>
        <p className="sub" style={{marginBottom: 12}}>Each Module 0 segment has a single dedicated color carried through card, map overlay, timeline dot, and chip.</p>
        <div className="seg-inv">
          {SEGMENT_COLORS.map(c => (
            <div key={c.name} className="swatch">
              <div className="swatch__color" style={{background: c.hex, height: 64}} />
              <div className="swatch__meta">
                <div className="swatch__name" style={{fontSize: 12}}>{c.name}</div>
                <div className="swatch__hex">{c.hex}</div>
              </div>
            </div>
          ))}
        </div>
      </section>

      {/* 4 · TYPOGRAPHY */}
      <section className="section" id="type">
        <div className="eyebrow">Section 4</div>
        <h2>Typography</h2>
        <p className="sub">Geist for sans, Geist Mono for anything data-like. Tight tracking on display sizes, neutral tracking on body. Numbers are tabular.</p>
        <div>
          {TYPE_SCALE.map(t => (
            <div key={t.tok} className="type-row">
              <div className="meta">
                <span className="tok">{t.tok}</span>
                <span>{t.size}px · {t.weight}</span><br/>
                <span>track {t.tracking}</span>
              </div>
              <div className="sample" style={{
                fontSize: t.size, fontWeight: t.weight, letterSpacing: t.tracking,
                textTransform: t.caps ? 'uppercase' : 'none',
                fontFamily: t.size < 14 && t.caps ? 'var(--font-sans)' : 'var(--font-sans)',
                lineHeight: t.size > 22 ? 1.15 : 1.4,
              }}>{t.sample}</div>
            </div>
          ))}
        </div>
        <div className="grid-2" style={{marginTop: 28}}>
          <div className="surface" style={{padding: 20}}>
            <div className="eyebrow">Numeric treatment</div>
            <div style={{fontSize: 28, fontFamily:'var(--font-sans)', fontVariantNumeric:'tabular-nums', fontWeight: 600, letterSpacing:'-0.02em', marginTop: 8}}>$712,340</div>
            <div style={{fontFamily:'var(--font-mono)', fontSize: 13, color:'var(--text-3)', marginTop: 6}}>tabular-nums · font-feature-settings "tnum"</div>
            <p className="body" style={{fontSize: 13, marginTop: 10}}>KPI values use sans at display size. Table cell values use mono so decimals align without ambiguity.</p>
          </div>
          <div className="surface" style={{padding: 20}}>
            <div className="eyebrow">Identifier treatment</div>
            <div style={{fontFamily:'var(--font-mono)', fontSize: 14, color:'var(--text-1)', marginTop: 8}}>clip_b48291 · ol_a2f291 · B-48291</div>
            <div style={{fontFamily:'var(--font-mono)', fontSize: 13, color:'var(--text-3)', marginTop: 6}}>Geist Mono · never wrapped</div>
            <p className="body" style={{fontSize: 13, marginTop: 10}}>CLIP IDs, Owner Link IDs, rule versions, model tags — anything that's a canonical handle — uses mono at body size.</p>
          </div>
        </div>
      </section>

      {/* 5 · SPACING & RADII */}
      <section className="section" id="space">
        <div className="eyebrow">Section 5</div>
        <h2>Spacing &amp; radii</h2>
        <p className="sub">4px base grid. Cards use 20px padding in comfortable density, 16px in compact. Never use padding values off the scale.</p>
        <div className="grid-2">
          <div className="surface" style={{padding: 24}}>
            <div className="eyebrow" style={{marginBottom: 10}}>Spacing scale</div>
            {SPACE_SCALE.map(s => (
              <div key={s.tok} className="space-demo">
                <span className="space-label">{s.tok} · {s.px}px</span>
                <div className="space-bar" style={{width: s.px * 3}} />
              </div>
            ))}
          </div>
          <div>
            <div className="surface" style={{padding: 24}}>
              <div className="eyebrow" style={{marginBottom: 16}}>Radii</div>
              <div style={{display:'grid', gridTemplateColumns:'repeat(5,1fr)', gap: 12}}>
                {RADII.map(r => (
                  <div key={r.tok} className="radius-demo">
                    <div className="box" style={{borderRadius: r.px === 999 ? 999 : r.px}} />
                    <div className="mono" style={{fontSize: 11, color:'var(--text-2)'}}>{r.px === 999 ? 'pill' : r.px+'px'}</div>
                    <div style={{fontSize: 10, color:'var(--text-3)', textAlign:'center', maxWidth: 100}}>{r.use}</div>
                  </div>
                ))}
              </div>
            </div>
            <div className="surface" style={{padding: 24, marginTop: 16}}>
              <div className="eyebrow" style={{marginBottom: 16}}>Elevation</div>
              <div style={{display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap: 12}}>
                <div className="shadow-card" style={{background:'var(--bg-2)', boxShadow:'var(--shadow-sm)', padding: 16, fontSize: 11, color:'var(--text-3)'}}>sm · cards</div>
                <div className="shadow-card" style={{background:'var(--bg-2)', boxShadow:'var(--shadow-md)', padding: 16, fontSize: 11, color:'var(--text-3)'}}>md · popovers</div>
                <div className="shadow-card" style={{background:'var(--bg-2)', boxShadow:'var(--shadow-lg)', padding: 16, fontSize: 11, color:'var(--text-3)'}}>lg · drawers</div>
              </div>
            </div>
          </div>
        </div>
      </section>

      {/* 6 · COMPONENTS */}
      <section className="section" id="components">
        <div className="eyebrow">Section 6</div>
        <h2>Component inventory</h2>
        <p className="sub">The reusable parts of Module 0. Each is a React component in <span className="mono" style={{color:'var(--text-1)'}}>shared/components.jsx</span> or a CSS primitive in <span className="mono" style={{color:'var(--text-1)'}}>shared/components.css</span>.</p>
        <div className="grid-2">
          {COMPONENTS.map(c => (
            <div key={c.name} className="comp">
              <div className="comp__hdr">
                <div className="t">{c.name}</div>
                <div className="c">{c.count}</div>
              </div>
              <div className="comp__body">{c.render()}</div>
              <div className="comp__notes">{c.notes}</div>
            </div>
          ))}
        </div>
      </section>

      {/* 7 · LAYOUT GRID */}
      <section className="section" id="layout">
        <div className="eyebrow">Section 7</div>
        <h2>Example layout grid</h2>
        <p className="sub">Module 0 anchors on a 3-zone shell: 72px module rail, 56px workspace top bar, and a flexible main canvas that can host a right rail. Content width caps at 1280px; 1440 × 900 is the DAIS target.</p>
        <div className="layout-diag">
          <div className="ld ld--rail ld--accent"><strong>Module rail</strong>72px · M0–M4</div>
          <div className="ld ld--top"><strong>Top bar · 56px</strong>Workspace / breadcrumb / lender pill / env pill / warehouse pill / theme / Genie / tweaks</div>
          <div className="ld ld--hero"><strong>Hero + Portfolio Builder</strong>Eyebrow · H1 · Lede · Filter row · 4 KPI cards</div>
          <div className="ld ld--main"><strong>Main zone</strong>Map · Segment grid · Borrower table<br/>switches by layout variation</div>
          <div className="ld ld--right"><strong>Right rail · 300px</strong>Approval banner · Audit log · Sources in use · Genie</div>
        </div>
        <div className="grid-3" style={{marginTop: 16}}>
          <div className="surface" style={{padding: 18}}>
            <div className="eyebrow">Variation A</div>
            <div className="h-4" style={{marginTop: 4}}>Map-first</div>
            <p className="body" style={{fontSize: 12, marginTop: 6}}>Geography hero · county→ZIP drill · segments below. Best for exec / growth leader demos.</p>
          </div>
          <div className="surface" style={{padding: 18}}>
            <div className="eyebrow">Variation B</div>
            <div className="h-4" style={{marginTop: 4}}>Segment-first</div>
            <p className="body" style={{fontSize: 12, marginTop: 6}}>Six segment cards as the entry point. Table follows directly. Map is reference.</p>
          </div>
          <div className="surface" style={{padding: 18}}>
            <div className="eyebrow">Variation C</div>
            <div className="h-4" style={{marginTop: 4}}>Table-first</div>
            <p className="body" style={{fontSize: 12, marginTop: 6}}>Analyst view. Named borrowers up top, segments + map are scaffolding.</p>
          </div>
        </div>
      </section>

      {/* 8 · MOTION */}
      <section className="section" id="motion">
        <div className="eyebrow">Section 8</div>
        <h2>Interaction &amp; motion</h2>
        <p className="sub">Motion is functional. Use it to telegraph data provenance and to reassure during model latency. Never to delight.</p>
        <div className="grid-3">
          <div className="motion-card">
            <div className="h">Fast · 120ms</div>
            <div className="sub">Hover, chip, button</div>
            <code>--dur-fast</code>
            <p className="body" style={{fontSize: 12, marginTop: 10}}>State confirmation only. Opacity/background color only; no transforms.</p>
          </div>
          <div className="motion-card">
            <div className="h">Base · 200ms</div>
            <div className="sub">Modal, expand row</div>
            <code>--dur-base</code>
            <p className="body" style={{fontSize: 12, marginTop: 10}}>Row expansion, KPI hover lift, tooltip entrance.</p>
          </div>
          <div className="motion-card">
            <div className="h">Slow · 360ms</div>
            <div className="sub">Drawer, Genie panel</div>
            <code>--dur-slow</code>
            <p className="body" style={{fontSize: 12, marginTop: 10}}>Right-edge drawer slide-in, Genie scale-up.</p>
          </div>
        </div>
        <div className="grid-2" style={{marginTop: 16}}>
          <div className="motion-card">
            <div className="h">Map pulse</div>
            <div className="sub">Draws eye to the drillable region during live demo</div>
            <p className="body" style={{fontSize: 12}}>A subtle accent pulse sits on Texas (state level) and Travis (county level). Pulse stops the moment the user drills. Reinforces the narrative: <em>follow the data from market → borrower</em>.</p>
          </div>
          <div className="motion-card">
            <div className="h">Genie "thinking" dots</div>
            <div className="sub">Used instead of a spinner for model latency</div>
            <p className="body" style={{fontSize: 12}}>Three ascending dots, 1.2s cycle. If a response exceeds 2s, add a system message: <em>"Running UC SQL…"</em> — never leave the user guessing.</p>
          </div>
        </div>
        <div style={{marginTop: 16, padding: '16px 20px', background:'rgba(245,158,11,0.08)', border:'1px dashed rgba(245,158,11,0.4)', borderRadius: 'var(--r-lg)', color:'var(--text-2)', fontSize: 13}}>
          <strong style={{color:'var(--signal-warning)'}}>Booth guidance.</strong>&nbsp; Reduce motion in public-spaces settings. Respect <span className="mono" style={{color:'var(--text-1)'}}>prefers-reduced-motion</span> — drawer becomes instant, pulse stops. Tweaks &rarr; theme toggle should <em>not</em> animate during a pitch; switch immediately.
        </div>
      </section>

      {/* 9 · A11Y */}
      <section className="section" id="a11y">
        <div className="eyebrow">Section 9</div>
        <h2>Accessibility</h2>
        <p className="sub">Target WCAG 2.2 AA. Every interactive element is keyboard-reachable, labeled, and high-contrast in both themes.</p>
        <div className="grid-2">
          <div className="surface" style={{padding: 20}}>
            <div className="eyebrow" style={{marginBottom: 12}}>Contrast · dark theme</div>
            <div className="a11y-row"><div className="ico"><Icon name="check" size={11}/></div><div className="what">Text-1 on Bg-0<div className="d">#EAF3FA on #04101F</div></div><div className="ratio">14.8 : 1 ✓ AAA</div></div>
            <div className="a11y-row"><div className="ico"><Icon name="check" size={11}/></div><div className="what">Text-2 on Bg-2<div className="d">#BACBD8 on #0C2340</div></div><div className="ratio">9.4 : 1 ✓ AAA</div></div>
            <div className="a11y-row"><div className="ico"><Icon name="check" size={11}/></div><div className="what">Accent on Bg-2<div className="d">#66C5FF on #0C2340</div></div><div className="ratio">8.2 : 1 ✓ AAA</div></div>
            <div className="a11y-row"><div className="ico"><Icon name="check" size={11}/></div><div className="what">Text-3 (muted) on Bg-2<div className="d">#7F96A7 on #0C2340</div></div><div className="ratio">4.6 : 1 ✓ AA</div></div>
          </div>
          <div className="surface" style={{padding: 20}}>
            <div className="eyebrow" style={{marginBottom: 12}}>Contrast · light theme</div>
            <div className="a11y-row"><div className="ico"><Icon name="check" size={11}/></div><div className="what">Text-1 on Bg-0<div className="d">#021F34 on #F4F7FA</div></div><div className="ratio">15.2 : 1 ✓ AAA</div></div>
            <div className="a11y-row"><div className="ico"><Icon name="check" size={11}/></div><div className="what">Text-2 on Bg-1<div className="d">#254A66 on #FFFFFF</div></div><div className="ratio">8.9 : 1 ✓ AAA</div></div>
            <div className="a11y-row"><div className="ico"><Icon name="check" size={11}/></div><div className="what">Accent (Navy) on White<div className="d">#025080 on #FFFFFF</div></div><div className="ratio">9.1 : 1 ✓ AAA</div></div>
            <div className="a11y-row"><div className="ico"><Icon name="check" size={11}/></div><div className="what">Text-3 (muted) on Bg-1<div className="d">#5A7890 on #FFFFFF</div></div><div className="ratio">4.9 : 1 ✓ AA</div></div>
          </div>
        </div>
        <div className="grid-2" style={{marginTop: 16}}>
          <div className="surface" style={{padding: 20}}>
            <div className="eyebrow" style={{marginBottom: 10}}>Interaction</div>
            <ul style={{margin:0, padding: '0 0 0 18px', color:'var(--text-2)', fontSize: 13, lineHeight: 1.7}}>
              <li>Every button, chip, row, and map region is focusable with visible 2px outline.</li>
              <li>Map regions expose <span className="mono" style={{color:'var(--text-1)'}}>aria-label</span> with name + count + avg score; keyboard-activatable.</li>
              <li>Segment cards are <span className="mono" style={{color:'var(--text-1)'}}>role="button"</span> with <span className="mono" style={{color:'var(--text-1)'}}>aria-pressed</span>.</li>
              <li>Approval banner uses <span className="mono" style={{color:'var(--text-1)'}}>role="region"</span> + label; Approve/Reject are distinct buttons with icons, not color alone.</li>
              <li>Audit log is a landmark region; new rows announced via <span className="mono" style={{color:'var(--text-1)'}}>aria-live="polite"</span>.</li>
              <li>Evidence chips include text content; never icon-only — screen readers read the signal name.</li>
            </ul>
          </div>
          <div className="surface" style={{padding: 20}}>
            <div className="eyebrow" style={{marginBottom: 10}}>Beyond contrast</div>
            <ul style={{margin:0, padding: '0 0 0 18px', color:'var(--text-2)', fontSize: 13, lineHeight: 1.7}}>
              <li>Score badges combine color, text, and a leading dot — not color alone.</li>
              <li>Confidence meters pair the 5-bar fill with a numeric %.</li>
              <li>Delta arrows on KPIs use both direction glyph and color.</li>
              <li>Choropleth uses monotonic lightness ramp tested against deuteranopia / protanopia sims.</li>
              <li>PII-free by default. Synthetic names only. Compliance chip visible on tables.</li>
              <li>All motion respects <span className="mono" style={{color:'var(--text-1)'}}>prefers-reduced-motion</span>.</li>
            </ul>
          </div>
        </div>
      </section>

      {/* 10 · STACK */}
      <section className="section" id="stack">
        <div className="eyebrow">Section 10</div>
        <h2>Framework map</h2>
        <p className="sub">How these tokens and components land in the Entrada stack.</p>
        <div className="grid-2">
          <div className="surface" style={{padding: 20}}>
            <div className="eyebrow" style={{marginBottom: 12}}>Frontend</div>
            <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap: 10, fontSize: 13}}>
              <div><div className="muted" style={{fontSize: 11}}>Framework</div><div className="mono" style={{color:'var(--text-1)'}}>React + Vite + TS</div></div>
              <div><div className="muted" style={{fontSize: 11}}>Styling</div><div className="mono" style={{color:'var(--text-1)'}}>Tailwind + shadcn/ui</div></div>
              <div><div className="muted" style={{fontSize: 11}}>Primitives</div><div className="mono" style={{color:'var(--text-1)'}}>Radix</div></div>
              <div><div className="muted" style={{fontSize: 11}}>Charts</div><div className="mono" style={{color:'var(--text-1)'}}>Recharts / ECharts</div></div>
              <div><div className="muted" style={{fontSize: 11}}>Maps</div><div className="mono" style={{color:'var(--text-1)'}}>MapLibre GL + GeoJSON</div></div>
              <div><div className="muted" style={{fontSize: 11}}>Runtime</div><div className="mono" style={{color:'var(--text-1)'}}>Databricks Apps</div></div>
            </div>
            <div className="muted" style={{fontSize: 11, marginTop: 16}}>→ Tokens in this system translate 1:1 to Tailwind theme extensions; shadcn primitives are restyled via CSS variables so brand and density toggle at runtime.</div>
          </div>
          <div className="surface" style={{padding: 20}}>
            <div className="eyebrow" style={{marginBottom: 12}}>Data &amp; AI</div>
            <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap: 10, fontSize: 13}}>
              <div><div className="muted" style={{fontSize: 11}}>Analytics</div><div className="mono" style={{color:'var(--text-1)'}}>UC Delta · SQL Warehouse</div></div>
              <div><div className="muted" style={{fontSize: 11}}>Semantics</div><div className="mono" style={{color:'var(--text-1)'}}>UC metric views</div></div>
              <div><div className="muted" style={{fontSize: 11}}>Transactional</div><div className="mono" style={{color:'var(--text-1)'}}>Lakebase</div></div>
              <div><div className="muted" style={{fontSize: 11}}>Chat</div><div className="mono" style={{color:'var(--text-1)'}}>Genie API</div></div>
              <div><div className="muted" style={{fontSize: 11}}>Agents</div><div className="mono" style={{color:'var(--text-1)'}}>Agent Bricks + MCP</div></div>
              <div><div className="muted" style={{fontSize: 11}}>Backend</div><div className="mono" style={{color:'var(--text-1)'}}>FastAPI · Databricks SDK</div></div>
            </div>
            <div className="muted" style={{fontSize: 11, marginTop: 16}}>→ Every evidence chip maps to a UC table or metric view. Audit log writes to Lakebase. Deployment via Declarative Automation Bundles.</div>
          </div>
        </div>
      </section>

      <div style={{marginTop: 80, padding: 24, borderTop:'1px solid var(--line-1)', display:'flex', justifyContent:'space-between', alignItems:'center', fontSize: 12, color:'var(--text-3)'}}>
        <div>Entrada AI · Mortgage Intelligence Platform · Design System v0.1 · DAIS April 2026</div>
        <div className="mono">shared/tokens.css · shared/components.css · shared/components.jsx</div>
      </div>
    </div>
  );
}

function Root() {
  return <AppProvider initial={{ theme: 'dark', accent: 'bright' }}><DS /></AppProvider>;
}

function mount() {
  if (typeof AppProvider === 'undefined' || typeof SEGMENTS === 'undefined' || typeof SOURCES === 'undefined') {
    return setTimeout(mount, 30);
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
}
mount();
</script>
</body>
</html>
