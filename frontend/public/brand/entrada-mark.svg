<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 22" role="img" aria-label="Entrada">
  <title>Entrada</title>
  <!-- Three equal-length bars (full viewBox width).
       Top + bottom rows are split navy + accent; middle is solid navy.
       Tight vertical viewBox (22 tall) so rendered height matches cap-height. -->
  <rect x="0"  y="0"  width="9"  height="4.5" fill="#66C5FF"/>
  <rect x="11" y="0"  width="21" height="4.5" fill="#025080"/>
  <rect x="0"  y="8.75" width="32" height="4.5" fill="#025080"/>
  <rect x="0"  y="17.5" width="21" height="4.5" fill="#025080"/>
  <rect x="23" y="17.5" width="9"  height="4.5" fill="#66C5FF"/>
</svg>
