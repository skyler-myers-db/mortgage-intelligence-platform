<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Entrada">
  <title>Entrada</title>
  <!-- Top row: light accent bar (left) + navy bar (right) -->
  <rect x="0"  y="5"  width="9"  height="4.5" fill="#66C5FF"/>
  <rect x="11" y="5"  width="21" height="4.5" fill="#025080"/>
  <!-- Middle row: full-width navy bar -->
  <rect x="0"  y="13.75" width="28" height="4.5" fill="#025080"/>
  <!-- Bottom row: navy bar (left) + light accent bar (right) -->
  <rect x="0"  y="22.5" width="21" height="4.5" fill="#025080"/>
  <rect x="23" y="22.5" width="9"  height="4.5" fill="#66C5FF"/>
</svg>
