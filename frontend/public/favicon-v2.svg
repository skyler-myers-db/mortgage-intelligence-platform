<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Entrada">
  <title>Entrada</title>
  <!-- Browser-tab favicon — the measured Entrada "E" centered in the
       rounded pale-icy tile. Bar geometry mirrors EntradaMark in
       frontend/src/components/brand/Entrada.tsx exactly (32x22 viewBox
       pixel-measured from the brand wordmark PNG: bar height 4.5, cyan
       tip 13/32 ~ 40.6%, flush tokens, cyan diagonal top-left +
       bottom-right), translated +5y to center vertically in the 32x32
       tile. Regenerated 2026-08-06; the previous rects used the
       pre-measurement guess (22-unit bars, 25% tips). The <1/10-unit
       bar overhang past the rounded corner at y=5/27 is invisible at
       icon sizes; the PNG raster (tools/render_brand_icons.py) clips it.
  -->
  <rect width="32" height="32" rx="6" ry="6" fill="#CFEFFF"/>
  <rect x="0"  y="5"     width="13" height="4.5" fill="#66C5FF"/>
  <rect x="13" y="5"     width="19" height="4.5" fill="#025080"/>
  <rect x="0"  y="13.75" width="32" height="4.5" fill="#025080"/>
  <rect x="0"  y="22.5"  width="19" height="4.5" fill="#025080"/>
  <rect x="19" y="22.5"  width="13" height="4.5" fill="#66C5FF"/>
</svg>
