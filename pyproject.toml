[project]
name = "mortgage-intelligence-platform"
version = "0.1.0"
description = "Databricks-native Mortgage Intelligence Platform — Module 0"
requires-python = ">=3.11"

# Optional extras. Keep ``otel`` strictly optional: the app must boot
# without these wheels even when ``MIP_OTEL_ENDPOINT`` is set
# (backend/services/observability.py logs a warning and falls back to
# stdout). See docs/observability.md for enablement.
[project.optional-dependencies]
otel = [
    "opentelemetry-sdk>=1.27,<2",
    "opentelemetry-exporter-otlp>=1.27,<2",
]
# Hypothesis powers tests/integration/test_genie_fuzz.py. Pinned in
# requirements.txt for CI; listed here so ``pip install .[fuzz]`` works.
fuzz = [
    "hypothesis>=6.123,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
pythonpath = ["."]
addopts = "-q"
# Custom pytest markers. Registered so `-m genie_fuzz_deep` selects the
# heavy Hypothesis run and PR CI's `pytest` doesn't emit
# PytestUnknownMarkWarning. See tests/integration/test_genie_fuzz.py.
markers = [
    "integration: live-infra tests gated on workspace creds",
    "genie_fuzz_deep: 200-example deep Hypothesis fuzz run (workflow_dispatch only)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# 2026-06-11 audit P2-14: Python type-checking gate ("strong types" goal had
# no enforcement step). Policy: a RATCHET, not theater —
#   * every module is checked by default (new code is born type-checked);
#   * the override list below exempts the 33 modules that carried 116
#     pre-existing errors at adoption. The list may ONLY SHRINK. Fix a
#     module -> delete its line in the same commit. Never add a line
#     without a dated rationale comment.
# Run: make typecheck  (wired into CI next to ruff).
# ---------------------------------------------------------------------------
[tool.mypy]
files = ["backend"]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# Adoption-time exemptions (audit P2-14). SHRINK ONLY — the list is pinned
# by tests/unit/test_typecheck_ratchet.py, which fails on ANY addition or
# wildcard. Re-audit 2026-06-11: the original "backend.api.*" wildcard
# silently exempted every future api module; replaced with the 12 actual
# dirty api modules (43 errors), enumerated below and scheduled for the
# post-Summit router slice (same files as the P2-4 pure-move refactor).
# Total at adoption: 33 modules / 116 errors.
module = [
    "backend.api.activation",
    "backend.api.admin",
    "backend.api.analytics",
    "backend.api.borrowers",
    "backend.api.campaigns",
    "backend.api.config",
    "backend.api.genie",
    "backend.api.geo",
    "backend.api.health",
    "backend.api.leads",
    "backend.api.sales",
    "backend.api.segments",
    "backend.schemas.portfolio",
    "backend.services.activation_state",
    "backend.services.asset_metadata",
    "backend.services.audit_lakebase_store",
    "backend.services.audit_store",
    "backend.services.databricks_sql",
    "backend.services.genie_client",
    "backend.services.genie_prompt_guardrails",
    "backend.services.lakebase",
    "backend.services.repositories.databricks_analytics",
    "backend.services.repositories.databricks_genie",
    "backend.services.repositories.databricks_genie_numeric",
    "backend.services.repositories.databricks_genie_policy",
    "backend.services.repositories.databricks_genie_trust",
    "backend.services.repositories.databricks_genie_visualization",
    "backend.services.repositories.databricks_geo",
