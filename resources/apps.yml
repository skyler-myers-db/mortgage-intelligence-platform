resources:
  apps:
    mip_module0_app:
      name: ${var.app_name}
      description: "Mortgage Intelligence Platform Module 0 DAIS demo"
      source_code_path: .
      resources:
        - name: sql_warehouse
          description: "Serverless SQL Warehouse for gold-table queries"
          sql_warehouse:
            id: ${var.sql_warehouse_id}
            permission: CAN_USE
        - name: genie_space
          description: "Mortgage Lead Intelligence Genie Space"
          genie_space:
            id: ${var.genie_space_id}
            permission: CAN_RUN
        # Slice 5 real-data migration: bind the app to the Lakebase
        # instance provisioned in databricks.yml. ``instance_name`` is
        # a required field on ``AppResourceDatabase`` (confirmed via
        # ``databricks bundle schema``). CAN_CONNECT_AND_CREATE lets
        # the app open a connection AND run DDL on first boot if the
        # migrate job hasn't landed yet (defensive; the normal path
        # runs ``mip_lakebase_migrate`` at deploy).
        - name: database
          description: "Lakebase/Postgres app state database"
          database:
            instance_name: mip_app_state
            database_name: ${var.lakebase_database_name}
            permission: CAN_CONNECT_AND_CREATE
