resources:
  jobs:
    # NOTE: `refresh_silver` is the canonical silver-refresh job and lives
    # in `databricks.yml` as `mip_refresh_silver`. The stub previously here
    # referenced a retired gold DLT file; the gold materialisation path is
    # the CTAS chain in `mip_refresh_scores`, not a DLT. Kept as a comment
    # marker in case a future slice wires `include: [resources/*.yml]` and
    # wants a sibling block here; in that case, re-author it against the
    # canonical silver pipeline (`mip_feature_pipeline`).

    # Slice13-accuracy mirror: canonical definition lives in `databricks.yml`
    # as `mip_refresh_scores`. Runs the gold CTAS chain (idempotent DDL +
    # 7 dependency-ordered CTAS tasks including `ctas_lockin_cohort`).
    # Keep in sync with the databricks.yml definition.
    mip_refresh_scores:
      name: mip-refresh-scores-${bundle.target}
      tags:
        solution: mortgage-intelligence-platform
        module: module0
        owner: entrada
        slice: slice13-accuracy
      max_concurrent_runs: 1
      tasks:
        - task_key: init_gold_ddl
          sql_task:
            warehouse_id: ${var.sql_warehouse_id}
            file:
              path: ../sql/ddl/003_gold_tables.sql
        - task_key: ctas_property_owner_bridge
          depends_on:
            - task_key: init_gold_ddl
          sql_task:
            warehouse_id: ${var.sql_warehouse_id}
            file:
              path: ../sql/transformations/gold_property_owner_bridge.sql
        - task_key: ctas_evidence_events
          depends_on:
            - task_key: init_gold_ddl
          sql_task:
            warehouse_id: ${var.sql_warehouse_id}
            file:
              path: ../sql/transformations/gold_evidence_events.sql
        - task_key: ctas_borrower_360
          depends_on:
            - task_key: ctas_property_owner_bridge
            - task_key: ctas_evidence_events
          sql_task:
            warehouse_id: ${var.sql_warehouse_id}
            file:
              path: ../sql/transformations/gold_borrower_360.sql
        - task_key: ctas_lead_scores
          depends_on:
            - task_key: ctas_borrower_360
          sql_task:
            warehouse_id: ${var.sql_warehouse_id}
            file:
              path: ../sql/transformations/gold_lead_scores.sql
        - task_key: ctas_lead_population
          depends_on:
            - task_key: ctas_lead_scores
          sql_task:
            warehouse_id: ${var.sql_warehouse_id}
            file:
              path: ../sql/transformations/gold_lead_population.sql
        - task_key: ctas_segment_population
          depends_on:
            - task_key: ctas_lead_scores
          sql_task:
            warehouse_id: ${var.sql_warehouse_id}
            file:
              path: ../sql/transformations/gold_segment_population.sql
        - task_key: ctas_lockin_cohort
          depends_on:
            - task_key: ctas_borrower_360
          sql_task:
            warehouse_id: ${var.sql_warehouse_id}
            file:
              path: ../sql/transformations/gold_lockin_cohort.sql
        - task_key: ctas_borrower_dossier
          depends_on:
            - task_key: ctas_borrower_360
            - task_key: ctas_evidence_events
          sql_task:
            warehouse_id: ${var.sql_warehouse_id}
            file:
              path: ../sql/transformations/gold_borrower_dossier.sql
        # slice13-accuracy-validation: three geography rollup tables feed
        # the USChoroplethMap drill. Keep in sync with databricks.yml.
        - task_key: ctas_county_rollup
          depends_on:
            - task_key: ctas_borrower_360
          sql_task:
            warehouse_id: ${var.sql_warehouse_id}
            file:
              path: ../sql/transformations/gold_county_rollup.sql
        - task_key: ctas_zip_rollup
          depends_on:
            - task_key: ctas_borrower_360
          sql_task:
            warehouse_id: ${var.sql_warehouse_id}
            file:
              path: ../sql/transformations/gold_zip_rollup.sql
        - task_key: ctas_state_top_segment
          depends_on:
            - task_key: ctas_borrower_360
          sql_task:
            warehouse_id: ${var.sql_warehouse_id}
            file:
              path: ../sql/transformations/gold_state_top_segment.sql
        # Zero-click Genie provisioning: rebuild the three mip.semantics.*
        # metric views on every refresh so Genie's trusted_assets bind
        # without a manual UI step. See databricks.yml for the canonical
        # definition and rationale. Keep this block in sync with that file.
        - task_key: refresh_semantics_views
          depends_on:
            - task_key: ctas_lead_population
            - task_key: ctas_segment_population
            - task_key: ctas_borrower_dossier
          sql_task:
            warehouse_id: ${var.sql_warehouse_id}
            file:
              path: ../sql/ddl/005_semantics_views.sql

    # Mirror: canonical definition lives in `databricks.yml` as
    # `mip_sync_lifecycle_state`. Same rationale as `fred_rates_ingest`
    # and `mip_ref_seed` below -- keep sibling jobs co-located so a
    # future `include: [resources/*.yml]` wiring makes per-resource
    # files the single source of truth. Keep both blocks in sync.
    #
    # Trigger model (2026-04-22): event-triggered from the backend
    # approval path + daily 04:00 America/Chicago fallback. Not hourly.
    # See databricks.yml comment for full rationale.
    mip_sync_lifecycle_state:
      name: mip-sync-lifecycle-state-${bundle.target}
      tags:
        solution: mortgage-intelligence-platform
        module: module0
        owner: entrada
        slice: slice13-accuracy
      schedule:
        quartz_cron_expression: "0 0 4 ? * * *"
        timezone_id: America/Chicago
      tasks:
        - task_key: seed_default_state
          sql_task:
            warehouse_id: ${var.sql_warehouse_id}
            file:
              path: ../sql/transformations/gold_borrower_lifecycle_state.sql
        - task_key: sync_from_lakebase
          depends_on:
            - task_key: seed_default_state
          spark_python_task:
            python_file: ../jobs/sync_lifecycle_state.py
        - task_key: record_funnel_snapshot
          depends_on:
            - task_key: sync_from_lakebase
          sql_task:
            warehouse_id: ${var.sql_warehouse_id}
            file:
              path: ../sql/transformations/gold_funnel_snapshot_daily.sql

    # Slice13-accuracy mirror: canonical definition lives in `databricks.yml`
    # as `mip_ref_seed`. This block is the same rationale as
    # `fred_rates_ingest` below -- keep sibling jobs co-located so a future
    # `include: [resources/*.yml]` wiring makes per-resource files the single
    # source of truth. Keep both blocks in sync.
    mip_ref_seed:
      name: mip-ref-seed-${bundle.target}
      tags:
        solution: mortgage-intelligence-platform
        module: module0
        owner: entrada
        slice: slice13-accuracy
      tasks:
        - task_key: init_ref_tables
          sql_task:
            warehouse_id: ${var.sql_warehouse_id}
            file:
              path: ../sql/ddl/004_ref_tables.sql
        - task_key: seed_lender_dictionary
          depends_on:
            - task_key: init_ref_tables
          sql_task:
            warehouse_id: ${var.sql_warehouse_id}
            file:
              path: ../sql/ref/lender_dictionary_seed.sql
        - task_key: seed_offer_rules_config
          depends_on:
            - task_key: init_ref_tables
          sql_task:
            warehouse_id: ${var.sql_warehouse_id}
            file:
              path: ../sql/ref/offer_rules_config_seed.sql

    # Slice 1 mirror: the canonical definition lives in `databricks.yml` as
    # `mip_fred_rates_ingest` (that file is what the bundle actually
    # materializes -- see `databricks bundle validate -o json`). This block
    # is kept alongside its sibling jobs so that if a future slice wires an
    # `include: [resources/*.yml]` block in `databricks.yml`, the per-resource
    # files become the single source of truth without losing this job.
    # Keep the two blocks in sync when editing; governance-reviewer will
    # enforce that on the Slice 8 CI pass.
    fred_rates_ingest:
      name: mip-fred-rates-ingest-${bundle.target}
      # Do NOT hardcode `pause_status: UNPAUSED`. Target mode controls pause.
      # Mirror of databricks.yml `mip_fred_rates_ingest`; keep in sync.
      schedule:
        quartz_cron_expression: "0 0 6 ? * FRI *"
        timezone_id: America/Chicago
      max_concurrent_runs: 1
      tasks:
        - task_key: init_ddl
          sql_task:
            warehouse_id: ${var.sql_warehouse_id}
            file:
              path: ../sql/ddl/001_catalogs_schemas.sql
        - task_key: init_silver_ddl
          depends_on:
            - task_key: init_ddl
          sql_task:
            warehouse_id: ${var.sql_warehouse_id}
            file:
              path: ../sql/ddl/silver_market_rates_weekly.sql
        - task_key: seed_if_empty
          depends_on:
            - task_key: init_silver_ddl
          spark_python_task:
            python_file: ../jobs/fred_rates_ingest.py
            parameters: ["--mode=seed"]
          max_retries: 2
          retry_on_timeout: true
        - task_key: refresh_from_fred
          depends_on:
            - task_key: seed_if_empty
          spark_python_task:
            python_file: ../jobs/fred_rates_ingest.py
            parameters: ["--mode=fred"]
          max_retries: 2
          retry_on_timeout: true
      tags:
        solution: mortgage-intelligence-platform
        module: module0
        owner: entrada
        slice: module0-real-data-slice1
